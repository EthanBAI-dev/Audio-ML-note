<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 807" width="880" height="807" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="从声音到机器学习特征的二十三课桌面课程总纲">
<rect width="880" height="807" fill="#ffffff"/>
<text x="28" y="35" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="28" dy="0">从声音到机器学习特征：23 课课程总纲</tspan></text><text x="28" y="68" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">目标不是背函数名，而是理解每一步保留什么、丢掉什么、参数错了会怎样</text><rect x="28" y="92" width="824" height="70" rx="5" fill="#eef5fd" stroke="#cbdff5" stroke-width="1"/><text x="44" y="119" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start">系列目的</text><text x="132" y="119" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">把空气振动变成电脑可计算、可解释、可复现的声音证据</text><text x="132" y="145" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start">终点是准备可信的模型输入；模型训练、网络结构与部署不在本系列范围内</text><rect x="28" y="188" width="155.2" height="430" rx="4" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><rect x="28" y="188" width="155.2" height="6" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="40" y="220" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">01—05</text><text x="40" y="248" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="40" dy="0">认识声音</tspan><tspan x="40" dy="23">与数字录音</tspan></text><polyline points="46.0,333.1 65.1,312.8 81.8,341.9 103.2,319.9 123.5,337.5 165.2,316.6" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="46.0" y1="348.5" x2="165.2" y2="348.5" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="40" y="382" font-size="13.5" font-weight="700" fill="#2a78d6" text-anchor="start"><tspan x="40" dy="0">电脑拿到声音时，</tspan><tspan x="40" dy="20">到底能看见什么？</tspan></text><line x1="40.0" y1="427.0" x2="171.2" y2="427.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="42" y="451" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">01  三种声音表示</text><text x="42" y="474" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">02  波形、频率与音高</text><text x="42" y="497" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">03  分贝、响度与音色</text><text x="42" y="520" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">04  采样率与位深</text><text x="42" y="543" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">05  按任务选择特征</text><line x1="40.0" y1="558.0" x2="171.2" y2="558.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><text x="40" y="581" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="start"><tspan x="40" dy="0">读懂基本声音图形</tspan><tspan x="40" dy="19">理解录音参数</tspan></text><line x1="185.2" y1="268.0" x2="193.2" y2="268.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="193.2,268 187.05692206676738,271.3559787702294 187.05692206676738,264.6440212297706" fill="#6f7b89"/><rect x="195.2" y="188" width="155.2" height="430" rx="4" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="195.2" y="188" width="155.2" height="6" rx="2" fill="#eb6834" stroke="none" stroke-width="1"/><text x="207.2" y="220" font-size="14" font-weight="700" fill="#eb6834" text-anchor="start">06—10</text><text x="207.2" y="248" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="207.2" dy="0">把录音变成</tspan><tspan x="207.2" dy="23">可计算片段</tspan></text><polyline points="213.2,326.5 217.6,318.7 222.0,314.8 226.4,320.5 230.9,333.6 235.3,334.3 239.7,334.2 244.1,326.3 248.5,315.4 252.9,311.0 257.3,323.2 261.8,331.1 266.2,338.3 270.6,337.2 275.0,326.0 279.4,320.1 283.8,316.8 288.3,321.7 292.7,333.1 297.1,342.2 301.5,332.5 305.9,326.0 310.3,316.7 314.7,313.0 319.2,320.4 323.6,330.4 328.0,336.4 332.4,335.4" fill="none" stroke="#eb6834" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><line x1="237.0" y1="303.0" x2="237.0" y2="350.0" stroke="#eb6834" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="260.9" y1="303.0" x2="260.9" y2="350.0" stroke="#eb6834" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="284.7" y1="303.0" x2="284.7" y2="350.0" stroke="#eb6834" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="308.6" y1="303.0" x2="308.6" y2="350.0" stroke="#eb6834" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><text x="207.2" y="382" font-size="13.5" font-weight="700" fill="#eb6834" text-anchor="start"><tspan x="207.2" dy="0">怎样沿时间切开声音，</tspan><tspan x="207.2" dy="20">再提取基础证据？</tspan></text><line x1="207.2" y1="427.0" x2="338.4" y2="427.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="209.2" y="451" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">06  分帧、加窗与聚合</text><text x="209.2" y="474" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">07  三种时域特征</text><text x="209.2" y="497" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">08  实现振幅包络</text><text x="209.2" y="520" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">09  实现 RMS 与过零率</text><text x="209.2" y="543" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">10  建立傅里叶直觉</text><line x1="207.2" y1="558.0" x2="338.4" y2="558.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><text x="207.2" y="581" font-size="12.5" font-weight="700" fill="#eb6834" text-anchor="start"><tspan x="207.2" dy="0">会分帧和建立时间轴</tspan><tspan x="207.2" dy="19">会计算时域特征</tspan></text><line x1="352.4" y1="268.0" x2="360.4" y2="268.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="360.4,268 354.25692206676734,271.3559787702294 354.25692206676734,264.6440212297706" fill="#6f7b89"/><rect x="362.4" y="188" width="155.2" height="430" rx="4" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><rect x="362.4" y="188" width="155.2" height="6" rx="2" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="374.4" y="220" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">11—15</text><text x="374.4" y="248" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="374.4" dy="0">从波形进入</tspan><tspan x="374.4" dy="23">时间—频率</tspan></text><circle cx="412.58399999999995" cy="326.5" r="17.05" fill="none" stroke="#e3e7ea" stroke-width="1.5"/><line x1="412.6" y1="326.5" x2="424.9" y2="315.4" stroke="#1baf7a" stroke-width="1.7" stroke-linecap="round"/><polygon points="424.85999999999996,315.4175 422.54904132857894,322.0250313104808 418.05133782208594,317.0429597340578" fill="#1baf7a"/><rect x="448.34399999999994" y="342.34" width="8.344" height="2.8600000000000003" rx="1" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="458.47599999999994" y="338.05" width="8.344" height="7.15" rx="1" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="468.60799999999995" y="330.185" width="8.344" height="15.014999999999999" rx="1" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="478.73999999999995" y="319.46" width="8.344" height="25.740000000000002" rx="1" fill="#1baf7a" stroke="none" stroke-width="1"/><rect x="488.87199999999996" y="309.45" width="8.344" height="35.75" rx="1" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="374.4" y="382" font-size="13.5" font-weight="700" fill="#1baf7a" text-anchor="start"><tspan x="374.4" dy="0">怎样找到有哪些频率，</tspan><tspan x="374.4" dy="20">以及它们何时出现？</tspan></text><line x1="374.4" y1="427.0" x2="505.6" y2="427.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="376.4" y="451" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">11  复数的模与相位</text><text x="376.4" y="474" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">12  傅里叶为何使用复数</text><text x="376.4" y="497" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">13  DFT 与频率格</text><text x="376.4" y="520" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">14  正确读取 FFT</text><text x="376.4" y="543" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">15  短时傅里叶变换</text><line x1="374.4" y1="558.0" x2="505.6" y2="558.0" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/><text x="374.4" y="581" font-size="12.5" font-weight="700" fill="#1baf7a" text-anchor="start"><tspan x="374.4" dy="0">正确计算频谱与 STFT</tspan><tspan x="374.4" dy="19">理解矩阵形状和取舍</tspan></text><line x1="519.6" y1="268.0" x2="527.6" y2="268.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="527.5999999999999,268 521.4569220667673,271.3559787702294 521.4569220667673,264.6440212297706" fill="#6f7b89"/><rect x="529.5999999999999" y="188" width="155.2" height="430" rx="4" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="529.5999999999999" y="188" width="155.2" height="6" rx="2" fill="#eda100" stroke="none" stroke-width="1"/><text x="541.5999999999999" y="220" font-size="14" font-weight="700" fill="#ab7400" text-anchor="start">16—20</text><text x="541.5999999999999" y="248" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="541.5999999999999" dy="0">把频谱整理成</tspan><tspan x="541.5999999999999" dy="23">可用的模型输入</tspan></text><line x1="547.6" y1="301.0" x2="583.4" y2="301.0" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="306.1" x2="583.4" y2="306.1" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="311.2" x2="583.4" y2="311.2" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="316.3" x2="583.4" y2="316.3" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="321.4" x2="583.4" y2="321.4" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="326.5" x2="583.4" y2="326.5" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="331.6" x2="583.4" y2="331.6" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="336.7" x2="583.4" y2="336.7" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="341.8" x2="583.4" y2="341.8" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="346.9" x2="583.4" y2="346.9" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="547.6" y1="352.0" x2="583.4" y2="352.0" stroke="#ab7400" stroke-width="1.1" stroke-linecap="round"/><line x1="591.7" y1="326.5" x2="612.0" y2="326.5" stroke="#ab7400" stroke-width="1.7" stroke-linecap="round"/><polygon points="611.9679999999998,326.5 605.8249220667673,329.8559787702294 605.8249220667673,323.1440212297706" fill="#ab7400"/><rect x="631.04" y="302" width="19.668" height="9.25" rx="1.5" fill="#ab7400" stroke="none" stroke-width="1"/><rect x="631.04" y="314.25" width="35.76" height="9.25" rx="1.5" fill="#ab7400" stroke="none" stroke-width="1"/><rect x="631.04" y="326.5" width="26.82" height="9.25" rx="1.5" fill="#ab7400" stroke="none" stroke-width="1"/><rect x="631.04" y="338.75" width="12.515999999999998" height="9.25" rx="1.5" fill="#ab7400" stroke="none" stroke-width="1"/><text x="541.5999999999999" y="382" font-size="13.5" font-weight="700" fill="#ab7400" text-anchor="start"><tspan x="541.5999999999999" dy="0">怎样让频率表示更稳定，</tspan><tspan x="541.5999999999999" dy="20">也更接近听觉尺度？</tspan></text><line x1="541.6" y1="427.0" x2="672.8" y2="427.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="543.5999999999999" y="451" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">16  可信的功率声谱图</text><text x="543.5999999999999" y="474" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">17  梅尔刻度与滤波器组</text><text x="543.5999999999999" y="497" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">18  对数梅尔频谱</text><text x="543.5999999999999" y="520" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">19  MFCC 与 DCT</text><text x="543.5999999999999" y="543" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">20  Delta 与 39 维拼接</text><line x1="541.6" y1="558.0" x2="672.8" y2="558.0" stroke="#eda100" stroke-width="2" stroke-linecap="round"/><text x="541.5999999999999" y="581" font-size="12.5" font-weight="700" fill="#ab7400" text-anchor="start"><tspan x="541.5999999999999" dy="0">实现对数梅尔与 MFCC</tspan><tspan x="541.5999999999999" dy="19">固定参数和边界</tspan></text><line x1="686.8" y1="268.0" x2="694.8" y2="268.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="694.8,268 688.6569220667674,271.3559787702294 688.6569220667674,264.6440212297706" fill="#6f7b89"/><rect x="696.8" y="188" width="155.2" height="430" rx="4" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><rect x="696.8" y="188" width="155.2" height="6" rx="2" fill="#7656b5" stroke="none" stroke-width="1"/><text x="708.8" y="220" font-size="14" font-weight="700" fill="#7656b5" text-anchor="start">21—23</text><text x="708.8" y="248" font-size="16.5" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="708.8" dy="0">用少量数字</tspan><tspan x="708.8" dy="23">概括一帧频谱</tspan></text><polyline points="714.8,350.0 718.3,346.7 721.8,341.7 725.3,334.9 728.8,326.5 732.3,317.4 735.8,308.9 739.3,302.6 742.8,299.7 746.4,300.6 749.9,305.1 753.4,311.9 756.9,319.2 760.4,325.6 763.9,329.8 767.4,331.4 770.9,330.5 774.4,327.9 777.9,324.3 781.4,320.7 784.9,317.8 788.4,316.3 791.9,316.5 795.4,318.5 798.9,321.9 802.4,326.3 806.0,331.3 809.5,336.2 813.0,340.8 816.5,344.6 820.0,347.7 823.5,349.9 827.0,351.5 830.5,352.5 834.0,353.2" fill="none" stroke="#7656b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="774.4" y1="299.0" x2="774.4" y2="354.0" stroke="#eb6834" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/><text x="708.8" y="382" font-size="13.5" font-weight="700" fill="#7656b5" text-anchor="start"><tspan x="708.8" dy="0">怎样量出频率分布的</tspan><tspan x="708.8" dy="20">比例、中心与扩散？</tspan></text><line x1="708.8" y1="427.0" x2="840.0" y2="427.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="710.8" y="451" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">21  三类频域统计问题</text><text x="710.8" y="474" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">22  实现带能量比 BER</text><text x="710.8" y="497" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">23  计算质心与带宽</text><line x1="708.8" y1="558.0" x2="840.0" y2="558.0" stroke="#7656b5" stroke-width="2" stroke-linecap="round"/><text x="708.8" y="581" font-size="12.5" font-weight="700" fill="#7656b5" text-anchor="start"><tspan x="708.8" dy="0">按任务选择频域特征</tspan><tspan x="708.8" dy="19">保持权重与坐标一致</tspan></text><text x="28" y="653" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="start">学完以后，读者能够</text><line x1="28.0" y1="676.0" x2="183.2" y2="676.0" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/><text x="28" y="704" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="start">看懂</text><text x="28" y="728" font-size="12.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="28" dy="0">波形、频谱与声谱图</tspan></text><line x1="195.2" y1="676.0" x2="350.4" y2="676.0" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/><text x="195.2" y="704" font-size="16" font-weight="700" fill="#eb6834" text-anchor="start">计算</text><text x="195.2" y="728" font-size="12.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="195.2" dy="0">时域特征、FFT 与 STFT</tspan></text><line x1="362.4" y1="676.0" x2="517.6" y2="676.0" stroke="#1baf7a" stroke-width="4" stroke-linecap="round"/><text x="362.4" y="704" font-size="16" font-weight="700" fill="#1baf7a" text-anchor="start">实现</text><text x="362.4" y="728" font-size="12.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="362.4" dy="0">对数梅尔、MFCC 与 BER</tspan></text><line x1="529.6" y1="676.0" x2="684.8" y2="676.0" stroke="#eda100" stroke-width="4" stroke-linecap="round"/><text x="529.5999999999999" y="704" font-size="16" font-weight="700" fill="#ab7400" text-anchor="start">排错</text><text x="529.5999999999999" y="728" font-size="12.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="529.5999999999999" dy="0">单位、坐标、形状与边界</tspan></text><line x1="696.8" y1="676.0" x2="852.0" y2="676.0" stroke="#7656b5" stroke-width="4" stroke-linecap="round"/><text x="696.8" y="704" font-size="16" font-weight="700" fill="#7656b5" text-anchor="start">选择</text><text x="696.8" y="728" font-size="12.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="696.8" dy="0">从任务证据到模型输入</tspan></text><text x="440" y="781" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">一条主线：听懂声音 → 切分声音 → 看见频率 → 构建表示 → 提取特征</text>
</svg>
