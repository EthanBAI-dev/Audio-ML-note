<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="二十三课从共同基础分向四类声音特征的桌面课程路线图">
<rect width="880" height="770" fill="#ffffff"/>
<text x="28" y="35" font-size="23" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="28" dy="0">23 课的真实结构：共同基础之后，特征路线开始分叉</tspan></text><text x="28" y="68" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">课程按课号学习；实际项目按任务选择，不必把所有特征首尾串联</text><text x="28" y="96" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">所有路线共用</text><rect x="28" y="112" width="260" height="112" rx="5" fill="#eef5fd" stroke="#cbdff5" stroke-width="1"/><rect x="28" y="112" width="260" height="5" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="42" y="141" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">01</text><text x="98" y="141" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">先认清问题</text><text x="42" y="167" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="42" dy="0">为什么声音分类需要</tspan><tspan x="42" dy="19">先把录音变成证据</tspan></text><text x="42" y="211" font-size="13.5" font-weight="700" fill="#2a78d6" text-anchor="start">明确课程目标与边界</text><line x1="292.0" y1="168.0" x2="306.0" y2="168.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="306,168 299.85692206676737,171.35597877022943 299.85692206676737,164.64402122977057" fill="#6f7b89"/><rect x="310" y="112" width="260" height="112" rx="5" fill="#eef5fd" stroke="#cbdff5" stroke-width="1"/><rect x="310" y="112" width="260" height="5" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="324" y="141" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">02—04</text><text x="380" y="141" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">认识输入</text><text x="324" y="167" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="324" dy="0">声音、听感与波形</tspan><tspan x="324" dy="19">连续声音怎样数字化</tspan></text><text x="324" y="211" font-size="13.5" font-weight="700" fill="#2a78d6" text-anchor="start">看懂录音中的数字</text><line x1="574.0" y1="168.0" x2="588.0" y2="168.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="588,168 581.8569220667674,171.35597877022943 581.8569220667674,164.64402122977057" fill="#6f7b89"/><rect x="592" y="112" width="260" height="112" rx="5" fill="#eef5fd" stroke="#cbdff5" stroke-width="1"/><rect x="592" y="112" width="260" height="5" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="606" y="141" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">05—06</text><text x="662" y="141" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">建立方法</text><text x="606" y="167" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="606" dy="0">特征怎样分类</tspan><tspan x="606" dy="19">录音怎样分帧和计算</tspan></text><text x="606" y="211" font-size="13.5" font-weight="700" fill="#2a78d6" text-anchor="start">得到统一提取步骤</text><line x1="722.0" y1="224.0" x2="722.0" y2="263.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><line x1="169.0" y1="263.0" x2="722.0" y2="263.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><line x1="169.0" y1="263.0" x2="169.0" y2="286.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="169,286 165.64402122977057,279.85692206676737 172.35597877022943,279.85692206676737" fill="#6f7b89"/><line x1="596.0" y1="263.0" x2="596.0" y2="286.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="596,286 592.6440212297706,279.85692206676737 599.3559787702294,279.85692206676737" fill="#6f7b89"/><text x="28" y="278" font-size="14" font-weight="700" fill="#6f7b89" text-anchor="start">可选的特征路线</text><rect x="28" y="292" width="282" height="162" rx="5" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="28" y="292" width="6" height="162" rx="2" fill="#eb6834" stroke="none" stroke-width="1"/><text x="46" y="321" font-size="14" font-weight="700" fill="#eb6834" text-anchor="start">路线 A  07—09</text><text x="46" y="349" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">时域特征</text><text x="46" y="376" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="46" dy="0">直接沿时间观察波形</tspan><tspan x="46" dy="20">量出强弱与正负变化</tspan></text><line x1="46.0" y1="420.0" x2="292.0" y2="420.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><text x="46" y="442" font-size="13.5" font-weight="700" fill="#eb6834" text-anchor="start">振幅包络 · RMS · 过零率</text><rect x="340" y="292" width="512" height="162" rx="5" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="340" y="292" width="6" height="162" rx="2" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="358" y="321" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">路线 B  10—16</text><text x="358" y="349" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">频率与时间—频率</text><text x="358" y="376" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="358" dy="0">从傅里叶变换走到 STFT</tspan><tspan x="358" dy="20">找到成分及其出现时间</tspan></text><line x1="358.0" y1="420.0" x2="834.0" y2="420.0" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/><text x="358" y="442" font-size="13.5" font-weight="700" fill="#1baf7a" text-anchor="start">频谱 · 声谱图（也可直接使用）</text><line x1="596.0" y1="454.0" x2="596.0" y2="480.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><line x1="463.0" y1="480.0" x2="729.0" y2="480.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><line x1="463.0" y1="480.0" x2="463.0" y2="496.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="463,496 459.6440212297706,489.85692206676737 466.3559787702294,489.85692206676737" fill="#6f7b89"/><line x1="729.0" y1="480.0" x2="729.0" y2="496.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="729,496 725.6440212297706,489.85692206676737 732.3559787702294,489.85692206676737" fill="#6f7b89"/><rect x="340" y="502" width="246" height="145" rx="5" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="340" y="502" width="6" height="145" rx="2" fill="#eda100" stroke="none" stroke-width="1"/><text x="358" y="531" font-size="14" font-weight="700" fill="#ab7400" text-anchor="start">路线 C  17—20</text><text x="358" y="559" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">听觉表示</text><text x="358" y="586" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="358" dy="0">按人耳的分辨方式</tspan><tspan x="358" dy="20">重新整理频率</tspan></text><line x1="358.0" y1="613.0" x2="568.0" y2="613.0" stroke="#eda100" stroke-width="2" stroke-linecap="round"/><text x="358" y="635" font-size="13.5" font-weight="700" fill="#ab7400" text-anchor="start">梅尔频谱 · MFCC</text><rect x="606" y="502" width="246" height="145" rx="5" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="606" y="502" width="6" height="145" rx="2" fill="#7656b5" stroke="none" stroke-width="1"/><text x="624" y="531" font-size="14" font-weight="700" fill="#7656b5" text-anchor="start">路线 D  21—23</text><text x="624" y="559" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">频谱统计</text><text x="624" y="586" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="624" dy="0">直接概括一帧频谱的</tspan><tspan x="624" dy="20">比例、中心与宽度</tspan></text><line x1="624.0" y1="613.0" x2="834.0" y2="613.0" stroke="#7656b5" stroke-width="2" stroke-linecap="round"/><text x="624" y="635" font-size="13.5" font-weight="700" fill="#7656b5" text-anchor="start">BER · 质心 · 带宽</text><rect x="28" y="681" width="824" height="62" rx="5" fill="#fff8e5" stroke="#f0d99d" stroke-width="1"/><text x="46" y="707" font-size="15" font-weight="700" fill="#7d5c00" text-anchor="start">实际任务</text><text x="132" y="707" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="start">时域　＋／或　频谱/声谱图　＋／或　梅尔/MFCC　＋／或　频谱统计</text><text x="132" y="730" font-size="13.5" font-weight="400" fill="#6f7b89" text-anchor="start">四类证据都能直接使用，也可以按任务组合</text>
</svg>
