<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1432" width="420" height="1432" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="二十三课从共同基础分向四类声音特征的手机课程路线图">
<rect width="420" height="1432" fill="#ffffff"/>
<text x="20" y="31" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="20" dy="0">23 课不是一条</tspan><tspan x="20" dy="28">首尾相接的流水线</tspan></text><text x="20" y="96" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="20" dy="0">先学习共同基础，再按任务选择</tspan><tspan x="20" dy="21">时域、频率、听觉表示或频谱统计。</tspan></text><text x="20" y="151" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">所有路线共用</text><rect x="48" y="169" width="352" height="115" rx="5" fill="#eef5fd" stroke="#cbdff5" stroke-width="1"/><rect x="48" y="169" width="6" height="115" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="65" y="196" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">01</text><text x="131" y="196" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">先认清问题</text><text x="65" y="222" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="65" dy="0">为什么声音分类需要</tspan><tspan x="65" dy="20">先把录音变成证据</tspan></text><line x1="65.0" y1="253.0" x2="383.0" y2="253.0" stroke="#cbdff5" stroke-width="1" stroke-linecap="round"/><text x="65" y="274" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">明确课程目标与边界</text><line x1="210.0" y1="287.0" x2="210.0" y2="295.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="210,295 206.64402122977057,288.85692206676737 213.35597877022943,288.85692206676737" fill="#6f7b89"/><rect x="48" y="302" width="352" height="115" rx="5" fill="#eef5fd" stroke="#cbdff5" stroke-width="1"/><rect x="48" y="302" width="6" height="115" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="65" y="329" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">02—04</text><text x="131" y="329" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">认识输入</text><text x="65" y="355" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="65" dy="0">声音、听感与波形</tspan><tspan x="65" dy="20">连续声音怎样数字化</tspan></text><line x1="65.0" y1="386.0" x2="383.0" y2="386.0" stroke="#cbdff5" stroke-width="1" stroke-linecap="round"/><text x="65" y="407" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">看懂录音中的数字</text><line x1="210.0" y1="420.0" x2="210.0" y2="428.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="210,428 206.64402122977057,421.85692206676737 213.35597877022943,421.85692206676737" fill="#6f7b89"/><rect x="48" y="435" width="352" height="115" rx="5" fill="#eef5fd" stroke="#cbdff5" stroke-width="1"/><rect x="48" y="435" width="6" height="115" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="65" y="462" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">05—06</text><text x="131" y="462" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">建立方法</text><text x="65" y="488" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="65" dy="0">特征怎样分类</tspan><tspan x="65" dy="20">录音怎样分帧和计算</tspan></text><line x1="65.0" y1="519.0" x2="383.0" y2="519.0" stroke="#cbdff5" stroke-width="1" stroke-linecap="round"/><text x="65" y="540" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">得到统一提取步骤</text><text x="20" y="585" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">从这里开始，特征分成不同路线</text><line x1="34.0" y1="620.0" x2="34.0" y2="863.0" stroke="#e3e7ea" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="645" r="10" fill="#fff" stroke="#eb6834" stroke-width="3"/><line x1="44.0" y1="645.0" x2="53.0" y2="645.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><rect x="58" y="620" width="342" height="132" rx="5" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="58" y="620" width="6" height="132" rx="2" fill="#eb6834" stroke="none" stroke-width="1"/><text x="75" y="647" font-size="14" font-weight="700" fill="#eb6834" text-anchor="start">路线 A  07—09</text><text x="75" y="675" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">时域特征</text><text x="75" y="701" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="75" dy="0">直接沿时间观察波形</tspan><tspan x="75" dy="20">量出强弱与正负变化</tspan></text><text x="75" y="739" font-size="14" font-weight="700" fill="#eb6834" text-anchor="start">振幅包络 · RMS · 过零率</text><circle cx="34" cy="800" r="10" fill="#fff" stroke="#1baf7a" stroke-width="3"/><line x1="44.0" y1="800.0" x2="53.0" y2="800.0" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/><rect x="58" y="775" width="342" height="145" rx="5" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="58" y="775" width="6" height="145" rx="2" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="75" y="802" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">路线 B  10—16</text><text x="75" y="830" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">频率与时间—频率</text><text x="75" y="856" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="75" dy="0">从傅里叶变换走到 STFT</tspan><tspan x="75" dy="20">找到成分及其出现时间</tspan></text><text x="75" y="907" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">频谱 · 声谱图（也可直接使用）</text><text x="77" y="956" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start"><tspan x="77" dy="0">频率基础继续分成两条路线</tspan></text><line x1="67.0" y1="932.0" x2="67.0" y2="1225.0" stroke="#e3e7ea" stroke-width="3" stroke-linecap="round"/><circle cx="67" cy="1007" r="9" fill="#fff" stroke="#eda100" stroke-width="3"/><line x1="76.0" y1="1007.0" x2="84.0" y2="1007.0" stroke="#eda100" stroke-width="2" stroke-linecap="round"/><rect x="89" y="984" width="311" height="128" rx="5" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="89" y="984" width="6" height="128" rx="2" fill="#eda100" stroke="none" stroke-width="1"/><text x="106" y="1011" font-size="14" font-weight="700" fill="#ab7400" text-anchor="start">路线 C  17—20</text><text x="106" y="1038" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">听觉表示</text><text x="106" y="1063" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="106" dy="0">按人耳的分辨方式</tspan><tspan x="106" dy="20">重新整理频率</tspan></text><text x="106" y="1100" font-size="14" font-weight="700" fill="#ab7400" text-anchor="start">梅尔频谱 · MFCC</text><circle cx="67" cy="1156" r="9" fill="#fff" stroke="#7656b5" stroke-width="3"/><line x1="76.0" y1="1156.0" x2="84.0" y2="1156.0" stroke="#7656b5" stroke-width="2" stroke-linecap="round"/><rect x="89" y="1133" width="311" height="128" rx="5" fill="#fbfcfd" stroke="#e3e7ea" stroke-width="1"/><rect x="89" y="1133" width="6" height="128" rx="2" fill="#7656b5" stroke="none" stroke-width="1"/><text x="106" y="1160" font-size="14" font-weight="700" fill="#7656b5" text-anchor="start">路线 D  21—23</text><text x="106" y="1187" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">频谱统计</text><text x="106" y="1212" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="106" dy="0">直接概括一帧频谱的</tspan><tspan x="106" dy="20">比例、中心与宽度</tspan></text><text x="106" y="1249" font-size="14" font-weight="700" fill="#7656b5" text-anchor="start">BER · 质心 · 带宽</text><rect x="20" y="1295" width="380" height="112" rx="5" fill="#fff8e5" stroke="#f0d99d" stroke-width="1"/><text x="210" y="1324" font-size="16" font-weight="700" fill="#7d5c00" text-anchor="middle">实际任务：选择或组合</text><text x="210" y="1350" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle"><tspan x="210" dy="0">时域 · 频谱/声谱图</tspan><tspan x="210" dy="20">梅尔与 MFCC · 频谱统计</tspan><tspan x="210" dy="20">四类证据都能直接使用</tspan></text>
</svg>
