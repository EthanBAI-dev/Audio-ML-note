<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 585" width="420" height="585" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="相同全局频率成分的两种时间顺序">
<rect width="420" height="585" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">整段包含的频率相同，</tspan><tspan x="22" dy="25">出现顺序却可以完全不同</tspan></text><text x="22" y="103" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">先低后高</text><rect x="32" y="129" width="178" height="86" rx="0" fill="#ddecfb" stroke="#2a78d6" stroke-width="1.4"/><rect x="210" y="129" width="178" height="86" rx="0" fill="#fde7dc" stroke="#eb6834" stroke-width="1.4"/><text x="121" y="179" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">300 Hz</text><text x="299" y="179" font-size="15" font-weight="700" fill="#eb6834" text-anchor="middle">900 Hz</text><text x="32" y="251" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">整段频谱：都有 300 与 900 Hz</text><text x="32" y="291" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">只有时间顺序不同</text><text x="22" y="356" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">先高后低</text><rect x="32" y="382" width="178" height="86" rx="0" fill="#fde7dc" stroke="#eb6834" stroke-width="1.4"/><rect x="210" y="382" width="178" height="86" rx="0" fill="#ddecfb" stroke="#2a78d6" stroke-width="1.4"/><text x="121" y="432" font-size="15" font-weight="700" fill="#eb6834" text-anchor="middle">900 Hz</text><text x="299" y="432" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">300 Hz</text><text x="32" y="504" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">整段频谱：都有 300 与 900 Hz</text><text x="32" y="544" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">只有时间顺序不同</text>
</svg>
