<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 409" width="420" height="409" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="四段声音依次经过读取、快速傅里叶变换、取绝对值和低频范围显示">
<rect width="420" height="409" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">四段声音交给程序后，</tspan><tspan x="20.0" dy="25">依次经过这四步</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#eef6fd" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">四段声音</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">小提琴、钢琴、萨克斯、噪声</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><text x="60.0" y="156.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">读成数组</text><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#fff3ee" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">FFT</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">N 个样本得到 N 个复数</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><text x="60.0" y="230.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">只看强度</text><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#edf8f3" stroke="#3b8f68" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">取绝对值</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">np.abs(X)：复数变成幅度</text><line x1="46.0" y1="291.0" x2="46.0" y2="305.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,305.0 43.1,299.7 48.9,299.7" fill="#5b6673"/><text x="60.0" y="304.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">放大低频</text><rect x="20.0" y="309.0" width="380.0" height="54.0" rx="9" fill="#fff8e8" stroke="#a5761a" stroke-width="1.6"/><text x="34.0" y="333.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">只画前 10%</text><text x="34.0" y="353.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">f_ratio = 0.1：约 0—2205 Hz</text><text x="20.0" y="387.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">f_ratio 只改显示范围，高频仍然算过</text>
</svg>
