<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 577" width="420" height="577" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="复数的直角坐标与极坐标表示">
<rect width="420" height="577" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">同一个复数，</tspan><tspan x="22" dy="25">可以读成坐标，也可以读成长度与方向</tspan></text><text x="22" y="103" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">横向与纵向：3 + 4i</text><rect x="22" y="119" width="376" height="166" rx="5" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="34.0" y1="202.0" x2="386.0" y2="202.0" stroke="#6f7b89" stroke-width="1" stroke-linecap="round"/><line x1="210.0" y1="131.0" x2="210.0" y2="273.0" stroke="#6f7b89" stroke-width="1" stroke-linecap="round"/><line x1="210.0" y1="202.0" x2="243.9" y2="156.8" stroke="#2a78d6" stroke-width="2.3" stroke-linecap="round"/><polygon points="243.864,156.84799999999998 242.56181109412492,164.74130754838652 236.65103764719396,160.30822746318827" fill="#2a78d6"/><text x="250.864" y="149.84799999999998" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">3 + 4i</text><text x="34" y="305" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">横向 3，纵向 4</text><text x="22" y="351" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">长度与方向：5，约 53°</text><rect x="22" y="367" width="376" height="166" rx="5" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="34.0" y1="450.0" x2="386.0" y2="450.0" stroke="#6f7b89" stroke-width="1" stroke-linecap="round"/><line x1="210.0" y1="379.0" x2="210.0" y2="521.0" stroke="#6f7b89" stroke-width="1" stroke-linecap="round"/><line x1="210.0" y1="450.0" x2="243.9" y2="404.8" stroke="#1baf7a" stroke-width="2.3" stroke-linecap="round"/><polygon points="243.864,404.848 242.56181109412492,412.74130754838654 236.65103764719396,408.3082274631883" fill="#1baf7a"/><text x="250.864" y="397.848" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">3 + 4i</text><text x="34" y="553" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">同一个箭头，没有增加信息</text>
</svg>
