<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 947" width="420" height="947" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="STFT 输出矩阵尺寸的计算">
<rect width="420" height="947" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">输出矩阵有多少行和列，</tspan><tspan x="22" dy="25">由频率箱数与帧数共同决定</tspan></text><rect x="22" y="81" width="376" height="170" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="46" cy="108" r="14" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="46" y="113" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="70" y="113" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">录音</text><text x="38" y="161" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start"><tspan x="38" dy="0">10000 个样本</tspan></text><line x1="210.0" y1="254.0" x2="210.0" y2="266.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="210,266 206.76754577120963,259.791035540545 213.23245422879037,259.791035540545" fill="#6f7b89"/><rect x="22" y="269" width="376" height="170" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="46" cy="296" r="14" fill="#eb6834" stroke="none" stroke-width="1"/><text x="46" y="301" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="70" y="301" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">每帧</text><text x="38" y="349" font-size="15" font-weight="700" fill="#eb6834" text-anchor="start"><tspan x="38" dy="0">1000 个样本</tspan></text><line x1="210.0" y1="442.0" x2="210.0" y2="454.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="210,454 206.76754577120963,447.791035540545 213.23245422879037,447.791035540545" fill="#6f7b89"/><rect x="22" y="457" width="376" height="170" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="46" cy="484" r="14" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="46" y="489" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="70" y="489" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">每次前进</text><text x="38" y="537" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start"><tspan x="38" dy="0">500 个样本</tspan></text><line x1="210.0" y1="630.0" x2="210.0" y2="642.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="210,642 206.76754577120963,635.791035540545 213.23245422879037,635.791035540545" fill="#6f7b89"/><rect x="22" y="645" width="376" height="170" rx="9" fill="#fff8e5" stroke="#e3e7ea" stroke-width="1"/><circle cx="46" cy="672" r="14" fill="#eda100" stroke="none" stroke-width="1"/><text x="46" y="677" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="70" y="677" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">输出</text><text x="38" y="725" font-size="15" font-weight="700" fill="#eda100" text-anchor="start"><tspan x="38" dy="0">501 行 × 19 列</tspan></text><text x="22" y="843" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="22" dy="0">501 = 1000/2 + 1</tspan><tspan x="22" dy="25">即 501 个非负频率位置</tspan><tspan x="22" dy="25">19 = (10000 − 1000)/500 + 1</tspan><tspan x="22" dy="25">即 19 个完整帧</tspan></text>
</svg>
