<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 558" width="420" height="558" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="真实信号的离散傅里叶变换在奈奎斯特位置两侧成共轭镜像">
<rect width="420" height="558" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">8 个格子为什么看起来成双？</tspan><tspan x="20.0" dy="25">真实信号的后一半是镜像</tspan></text><rect x="20.0" y="105.0" width="380.0" height="166.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="20.0" y="97.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">同一份 8 点 DFT 的幅度谱线</text><line x1="20.0" y1="271.0" x2="20.0" y2="271.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><circle cx="20.0" cy="271.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="74.3" y1="271.0" x2="74.3" y2="123.4" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><circle cx="74.3" cy="123.4" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="128.6" y1="271.0" x2="128.6" y2="197.2" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><circle cx="128.6" cy="197.2" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="182.9" y1="271.0" x2="182.9" y2="271.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><circle cx="182.9" cy="271.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="237.1" y1="271.0" x2="237.1" y2="271.0" stroke="#a5761a" stroke-width="1.8" stroke-linecap="round"/><circle cx="237.1" cy="271.0" r="4.5" fill="#a5761a" stroke="none" stroke-width="1"/><line x1="291.4" y1="271.0" x2="291.4" y2="271.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><circle cx="291.4" cy="271.0" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="345.7" y1="271.0" x2="345.7" y2="197.2" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><circle cx="345.7" cy="197.2" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="400.0" y1="271.0" x2="400.0" y2="123.4" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><circle cx="400.0" cy="123.4" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="20.0" y="289.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">0</text><text x="74.3" y="289.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1</text><text x="128.6" y="289.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">2</text><text x="182.9" y="289.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">3</text><text x="237.1" y="289.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">4</text><text x="291.4" y="289.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">5</text><text x="345.7" y="289.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">6</text><text x="400.0" y="289.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">7</text><line x1="237.1" y1="103.0" x2="237.1" y2="277.0" stroke="#a5761a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="237.1" y="125.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="middle">k=4 · 4 Hz</text><rect x="20.0" y="315.0" width="380.0" height="46.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="32.0" y="334.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">k=1</text><text x="210.0" y="334.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">互为共轭镜像  ↔</text><text x="388.0" y="334.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">k=7</text><text x="210.0" y="353.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">对应 +1 Hz 与 -1 Hz</text><rect x="20.0" y="369.0" width="380.0" height="46.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="32.0" y="388.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">k=2</text><text x="210.0" y="388.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">互为共轭镜像  ↔</text><text x="388.0" y="388.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">k=6</text><text x="210.0" y="407.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">对应 +2 Hz 与 -2 Hz</text><rect x="20.0" y="423.0" width="380.0" height="46.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="32.0" y="442.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">k=3</text><text x="210.0" y="442.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">互为共轭镜像  ↔</text><text x="388.0" y="442.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">k=5</text><text x="210.0" y="461.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">对应 +3 Hz 与 -3 Hz</text><text x="20.0" y="485.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">蓝色正频率和橙色负频率成对出现。</tspan><tspan x="20.0" dy="21">真实录音只保留 0 到奈奎斯特这一半，也能恢复</tspan><tspan x="20.0" dy="21">另一半；这是去掉重复，不是删除新信息。</tspan></text>
</svg>
