<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 439" width="420" height="439" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="采样率与样本数决定 DFT 频率间隔">
<rect width="420" height="439" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">频率格间隔由两件事决定：</tspan><tspan x="22" dy="25">采样率 ÷ 样本数</tspan></text><rect x="22" y="81" width="376" height="340" rx="9" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="50.0" y1="196.0" x2="370.0" y2="196.0" stroke="#6f7b89" stroke-width="1.4" stroke-linecap="round"/><line x1="50.0" y1="188.0" x2="50.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="50" y="226" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">0</text><line x1="90.0" y1="188.0" x2="90.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><line x1="130.0" y1="188.0" x2="130.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="130" y="226" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">1000</text><line x1="170.0" y1="188.0" x2="170.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><line x1="210.0" y1="188.0" x2="210.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="210" y="226" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">2000</text><line x1="250.0" y1="188.0" x2="250.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><line x1="290.0" y1="188.0" x2="290.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="290" y="226" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">3000</text><line x1="330.0" y1="188.0" x2="330.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><line x1="370.0" y1="188.0" x2="370.0" y2="204.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="370" y="226" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">4000</text><text x="46" y="115" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">例：采样率 8000 Hz，N = 16</text><text x="46" y="148" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">频率间隔 = 8000 ÷ 16 = 500 Hz</text><text x="46" y="279" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start">延长真实观察时间 → N 增加 → 频率格更密</text><text x="46" y="310" font-size="15" font-weight="400" fill="#eb6834" text-anchor="start">只在后面补零 → 画得更密，但没有新增观察证据</text>
</svg>
