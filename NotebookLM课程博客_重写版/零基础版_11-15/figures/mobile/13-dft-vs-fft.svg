<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 648" width="420" height="648" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="直接离散傅里叶变换和快速傅里叶变换随样本数增长的实测耗时曲线">
<rect width="420" height="648" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">样本数每翻一倍，</tspan><tspan x="20.0" dy="25">直接 DFT 和 FFT 的耗时怎样长</tspan></text><rect x="20.0" y="105.0" width="380.0" height="142.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="20.0" y="97.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">直接 DFT（毫秒）</text><polyline points="20.0,243.7 146.7,238.3 273.3,213.0 400.0,120.2" fill="none" stroke="#c65a3d" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20.0" cy="243.7" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="20.0" y="235.7" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="middle">0.15</text><circle cx="146.7" cy="238.3" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="146.7" y="230.3" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="middle">0.41</text><circle cx="273.3" cy="213.0" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="273.3" y="205.0" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="middle">1.61</text><circle cx="400.0" cy="120.2" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="400.0" y="112.2" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="middle">5.99</text><text x="20.0" y="265.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">64</text><text x="146.7" y="265.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">128</text><text x="273.3" y="265.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">256</text><text x="400.0" y="265.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">512</text><rect x="20.0" y="305.0" width="380.0" height="142.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="20.0" y="297.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">NumPy FFT（毫秒）</text><polyline points="20.0,368.0 146.7,361.6 273.3,341.1 400.0,320.2" fill="none" stroke="#3b8f68" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20.0" cy="368.0" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="20.0" y="360.0" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">0.0037</text><circle cx="146.7" cy="361.6" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="146.7" y="353.6" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">0.0040</text><circle cx="273.3" cy="341.1" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="273.3" y="333.1" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">0.0050</text><circle cx="400.0" cy="320.2" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="400.0" y="312.2" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">0.0060</text><text x="20.0" y="465.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">64</text><text x="146.7" y="465.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">128</text><text x="273.3" y="465.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">256</text><text x="400.0" y="465.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">512</text><rect x="20.0" y="499.0" width="380.0" height="58.0" rx="8" fill="#edf8f3" stroke="#3b8f68" stroke-width="1.5"/><text x="34.0" y="522.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">N=512 的本机实测</text><text x="34.0" y="546.0" font-size="19" font-weight="700" fill="#3b8f68" text-anchor="start">FFT 快约 998 倍</text><text x="386.0" y="538.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">两张图纵轴不同；比较增长形状，不比较线高</text><text x="20.0" y="575.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">直接计算约按 N² 增长；FFT 利用重复结构，</tspan><tspan x="20.0" dy="21">把增长压到约 N log₂N。毫秒数会随机器变化，</tspan><tspan x="20.0" dy="21">这里看的是增长趋势。</tspan></text>
</svg>
