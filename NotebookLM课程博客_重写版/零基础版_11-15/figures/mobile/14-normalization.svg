<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 595" width="420" height="595" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="FFT 原始模值与单边幅值归一化">
<rect width="420" height="595" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">同样振幅的 250 Hz 正弦，</tspan><tspan x="22" dy="25">原始 FFT 峰值会随样本数增长</tspan></text><text x="22" y="103" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">原始 FFT 模值</text><rect x="22" y="119" width="376" height="155" rx="9" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><rect x="92.28000000000002" y="201.27272727272754" width="70" height="47.727272727272464" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="127.28000000000002" y="271" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">1 秒</text><text x="127.28000000000002" y="193.27272727272754" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="middle">2867</text><rect x="235.16000000000003" y="153.54545454545456" width="70" height="95.45454545454544" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/><text x="270.16" y="271" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">2 秒</text><text x="270.16" y="145.54545454545456" font-size="14" font-weight="700" fill="#eb6834" text-anchor="middle">5734</text><text x="28" y="309" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">2 秒结果是 1 秒的两倍</text><text x="22" y="361" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">按样本数归一化后</text><rect x="22" y="377" width="376" height="155" rx="9" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><rect x="92.28000000000002" y="415.12500000000085" width="70" height="91.87499999999915" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="127.28000000000002" y="529" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">1 秒</text><text x="127.28000000000002" y="407.12500000000085" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="middle">0.70</text><rect x="235.16000000000003" y="415.12500000000034" width="70" height="91.87499999999964" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/><text x="270.16" y="529" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">2 秒</text><text x="270.16" y="407.12500000000034" font-size="14" font-weight="700" fill="#eb6834" text-anchor="middle">0.70</text><text x="28" y="567" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">两段都回到振幅 0.70</text>
</svg>
