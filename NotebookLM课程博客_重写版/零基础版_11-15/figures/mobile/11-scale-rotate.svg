<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 838" width="420" height="838" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="复数乘法对应缩放和旋转">
