<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 335" width="420" height="335" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="连续傅里叶公式经过有限时间和有限频率两次限制后变成离散傅里叶变换">
<rect width="420" height="335" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">计算机怎样处理两个无穷？</tspan><tspan x="20.0" dy="25">时间和频率各收一次口</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#5b6673" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#5b6673" text-anchor="start">连续公式</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">时间和频率都没有尽头</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><text x="60.0" y="156.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">先限制时间</text><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#eef6fd" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">第 1 次收口 · 时间</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">只留下 8 个样本，n = 0 … 7</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><text x="60.0" y="230.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">再限制频率</text><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#fff3ee" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">第 2 次收口 · 频率</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">只计算 8 个格子，k = 0 … 7</text><text x="20.0" y="313.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">8 个样本 ↔ 8 个复数系数：两边都有限，而且可以完整往返</text>
</svg>
