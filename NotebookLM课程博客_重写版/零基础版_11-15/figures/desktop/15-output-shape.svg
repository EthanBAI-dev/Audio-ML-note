<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 308" width="880" height="308" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="STFT 输出矩阵尺寸的计算">
<rect width="880" height="308" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">输出矩阵有多少行和列，由频率箱数与帧数共同决定</text><rect x="30" y="56" width="190" height="170" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="54" cy="83" r="14" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="54" y="88" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="78" y="88" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">录音</text><text x="46" y="136" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start"><tspan x="46" dy="0">10000 个样本</tspan></text><line x1="223.0" y1="141.0" x2="237.0" y2="141.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="237,141 230.791035540545,144.23245422879037 230.791035540545,137.76754577120963" fill="#6f7b89"/><rect x="240" y="56" width="190" height="170" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="264" cy="83" r="14" fill="#eb6834" stroke="none" stroke-width="1"/><text x="264" y="88" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="288" y="88" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">每帧</text><text x="256" y="136" font-size="15" font-weight="700" fill="#eb6834" text-anchor="start"><tspan x="256" dy="0">1000 个样本</tspan></text><line x1="433.0" y1="141.0" x2="447.0" y2="141.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="447,141 440.791035540545,144.23245422879037 440.791035540545,137.76754577120963" fill="#6f7b89"/><rect x="450" y="56" width="190" height="170" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="474" cy="83" r="14" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="474" y="88" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="498" y="88" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">每次前进</text><text x="466" y="136" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start"><tspan x="466" dy="0">500 个样本</tspan></text><line x1="643.0" y1="141.0" x2="657.0" y2="141.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="657,141 650.791035540545,144.23245422879037 650.791035540545,137.76754577120963" fill="#6f7b89"/><rect x="660" y="56" width="190" height="170" rx="9" fill="#fff8e5" stroke="#e3e7ea" stroke-width="1"/><circle cx="684" cy="83" r="14" fill="#eda100" stroke="none" stroke-width="1"/><text x="684" y="88" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="708" y="88" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">输出</text><text x="676" y="136" font-size="15" font-weight="700" fill="#eda100" text-anchor="start"><tspan x="676" dy="0">501 行 × 19 列</tspan></text><text x="30" y="254" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="30" dy="0">501 = 1000/2 + 1 个非负频率位置</tspan><tspan x="30" dy="25">19 = (10000 − 1000)/500 + 1 个完整帧</tspan></text>
</svg>
