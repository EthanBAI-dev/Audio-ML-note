<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">同样振幅的 250 Hz 正弦，原始 FFT 峰值会随样本数增长</text><text x="30" y="78" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">原始 FFT 模值</text><rect x="30" y="94" width="400" height="155" rx="9" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><rect x="107" y="176.27272727272754" width="70" height="47.727272727272464" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="142" y="246" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">1 秒</text><text x="142" y="168.27272727272754" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="middle">2867</text><rect x="259" y="128.54545454545456" width="70" height="95.45454545454544" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/><text x="294" y="246" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">2 秒</text><text x="294" y="120.54545454545456" font-size="14" font-weight="700" fill="#eb6834" text-anchor="middle">5734</text><text x="36" y="284" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">2 秒结果是 1 秒的两倍</text><text x="450" y="78" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">按样本数归一化后</text><rect x="450" y="94" width="400" height="155" rx="9" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><rect x="527" y="132.12500000000085" width="70" height="91.87499999999915" rx="3" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="562" y="246" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">1 秒</text><text x="562" y="124.12500000000085" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="middle">0.70</text><rect x="679" y="132.12500000000034" width="70" height="91.87499999999964" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/><text x="714" y="246" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">2 秒</text><text x="714" y="124.12500000000034" font-size="14" font-weight="700" fill="#eb6834" 