<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 413" width="880" height="413" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="两支试探波的读数拼成一个复数后，模是强度、角是相位">
<rect width="880" height="413" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">第 10 课那两个读数，拼起来就是一个复数</text><text x="30.0" y="72.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">两支试探波各自的读数</text><line x1="30.0" y1="143.0" x2="358.0" y2="143.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="96.0" y="143.0" width="32.0" height="2.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="112.0" y="137.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.0000</text><text x="112.0" y="224.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">余弦那支</text><rect x="260.0" y="91.0" width="32.0" height="52.0" rx="2" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="276.0" y="85.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="middle">1.0000</text><text x="276.0" y="224.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">正弦那支</text><rect x="384.0" y="78.0" width="150.0" height="150.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="390.0" y1="153.0" x2="528.0" y2="153.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="459.0" y1="84.0" x2="459.0" y2="222.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="526.0" y="147.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="465.0" y="96.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><line x1="459.0" y1="153.0" x2="459.0" y2="107.8" stroke="#c65a3d" stroke-width="2.4" stroke-linecap="round"/><circle cx="459.0" cy="107.8" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="465.0" y="121.8" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">模 1.0000</text><rect x="30.0" y="238.0" width="820.0" height="26.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="256.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">模 |z|</text><text x="341.6" y="256.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">1.0000</text><text x="840.0" y="256.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">＝ 第 10 课量到的强度</text><rect x="30.0" y="268.0" width="820.0" height="26.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="286.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">角 γ</text><text x="341.6" y="286.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">1.5708 弧度</text><text x="840.0" y="286.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">＝ 第 10 课量到的相位</text><rect x="30.0" y="298.0" width="820.0" height="26.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="316.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">起点挪四分之一圈后</text><text x="341.6" y="316.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">模 1.0000　角 -0.0000</text><text x="840.0" y="316.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">模没变，角变了 90°</text><text x="30.0" y="342.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">余弦那支当实部、正弦那支当虚部，两个读数就成了平面上一个点的横纵坐标。</tspan><tspan x="30.0" dy="21">这个点离原点多远，就是这个频率有多强；朝哪个方向，就是它从哪里起步。</tspan><tspan x="30.0" dy="21">起点挪四分之一圈时模纹丝不动——上一课「一支试探波会被起点抹掉」的问题就此消失。</tspan></text>
</svg>
