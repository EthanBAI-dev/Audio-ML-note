<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 375" width="880" height="375" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="复数在复平面上的直角坐标与极坐标两种表示">
<rect width="880" height="375" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">同一个点，两种说法装的信息一样多</text><rect x="30.0" y="78.0" width="200.0" height="200.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="36.0" y1="178.0" x2="224.0" y2="178.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="130.0" y1="84.0" x2="130.0" y2="272.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="222.0" y="172.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="136.0" y="96.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><text x="38.0" y="96.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">直角坐标</text><line x1="176.1" y1="178.0" x2="176.1" y2="116.6" stroke="#0878b9" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="130.0" y1="116.6" x2="176.1" y2="116.6" stroke="#0878b9" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="176.1" cy="116.6" r="5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="184.1" y="110.6" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">3 + 4i</text><text x="153.0" y="194.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">实部 3</text><text x="124.0" y="147.3" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">虚部 4</text><rect x="254.0" y="78.0" width="200.0" height="200.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="260.0" y1="178.0" x2="448.0" y2="178.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="354.0" y1="84.0" x2="354.0" y2="272.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="446.0" y="172.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="360.0" y="96.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><text x="262.0" y="96.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">极坐标</text><line x1="354.0" y1="178.0" x2="400.1" y2="116.6" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="400.1" cy="116.6" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><path d="M380.0,178.0 A26,26 0 0 0 369.6,157.2" fill="none" stroke="#c65a3d" stroke-width="1.6"/><text x="384.0" y="200.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">γ = 0.9273</text><text x="371.0" y="139.3" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">模 5</text><text x="30.0" y="304.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">左边用「往右 3、往上 4」定位，右边用「离原点 5、朝 53.13°」定位。</tspan><tspan x="30.0" dy="21">两种说法互相转得回去，装的信息一样多。极坐标那一种正好对上声音要的两样东西：</tspan><tspan x="30.0" dy="21">模对应「这个频率有多强」，角对应「从一轮的哪个位置起步」。</tspan></text>
</svg>
