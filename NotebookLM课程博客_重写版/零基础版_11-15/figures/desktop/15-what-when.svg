<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 307" width="880" height="307" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="相同全局频率成分的两种时间顺序">
<rect width="880" height="307" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">整段包含的频率相同，出现顺序却可以完全不同</text><text x="30" y="78" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">先低后高</text><rect x="40" y="104" width="190" height="86" rx="0" fill="#ddecfb" stroke="#2a78d6" stroke-width="1.4"/><rect x="230" y="104" width="190" height="86" rx="0" fill="#fde7dc" stroke="#eb6834" stroke-width="1.4"/><text x="135" y="154" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">300 Hz</text><text x="325" y="154" font-size="15" font-weight="700" fill="#eb6834" text-anchor="middle">900 Hz</text><text x="40" y="226" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">整段频谱：都有 300 与 900 Hz</text><text x="40" y="266" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">只有时间顺序不同</text><text x="450" y="78" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">先高后低</text><rect x="460" y="104" width="190" height="86" rx="0" fill="#fde7dc" stroke="#eb6834" stroke-width="1.4"/><rect x="650" y="104" width="190" height="86" rx="0" fill="#ddecfb" stroke="#2a78d6" stroke-width="1.4"/><text x="555" y="154" font-size="15" font-weight="700" fill="#eb6834" text-anchor="middle">900 Hz</text><text x="745" y="154" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">300 Hz</text><text x="460" y="226" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">整段频谱：都有 300 与 900 Hz</text><text x="460" y="266" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">只有时间顺序不同</text>
</svg>
