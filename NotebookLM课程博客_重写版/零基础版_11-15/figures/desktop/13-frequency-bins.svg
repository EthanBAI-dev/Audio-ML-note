<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 339" width="880" height="339" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="采样率与样本数决定 DFT 频率间隔">
<rect width="880" height="339" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">频率格间隔由两件事决定：采样率 ÷ 样本数</text><rect x="30" y="56" width="820" height="265" rx="9" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="58.0" y1="171.0" x2="822.0" y2="171.0" stroke="#6f7b89" stroke-width="1.4" stroke-linecap="round"/><line x1="58.0" y1="163.0" x2="58.0" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="58" y="201" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">0</text><line x1="153.5" y1="163.0" x2="153.5" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><line x1="249.0" y1="163.0" x2="249.0" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="249" y="201" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">1000</text><line x1="344.5" y1="163.0" x2="344.5" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><line x1="440.0" y1="163.0" x2="440.0" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="440" y="201" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">2000</text><line x1="535.5" y1="163.0" x2="535.5" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><line x1="631.0" y1="163.0" x2="631.0" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="631" y="201" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">3000</text><line x1="726.5" y1="163.0" x2="726.5" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><line x1="822.0" y1="163.0" x2="822.0" y2="179.0" stroke="#2a78d6" stroke-width="1.5" stroke-linecap="round"/><text x="822" y="201" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">4000</text><text x="54" y="90" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">例：采样率 8000 Hz，N = 16</text><text x="54" y="123" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">频率间隔 = 8000 ÷ 16 = 500 Hz</text><text x="54" y="254" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start">延长真实观察时间 → N 增加 → 频率格更密</text><text x="54" y="285" font-size="15" font-weight="400" fill="#eb6834" text-anchor="start">只在后面补零 → 画得更密，但没有新增观察证据</text>
</svg>
