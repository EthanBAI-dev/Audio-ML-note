<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 304" width="880" height="304" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="复数的直角坐标与极坐标表示">
<rect width="880" height="304" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">同一个复数，可以读成坐标，也可以读成长度与方向</text><text x="30" y="78" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">横向与纵向：3 + 4i</text><rect x="30" y="94" width="400" height="166" rx="5" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="42.0" y1="177.0" x2="418.0" y2="177.0" stroke="#6f7b89" stroke-width="1" stroke-linecap="round"/><line x1="230.0" y1="106.0" x2="230.0" y2="248.0" stroke="#6f7b89" stroke-width="1" stroke-linecap="round"/><line x1="230.0" y1="177.0" x2="263.9" y2="131.8" stroke="#2a78d6" stroke-width="2.3" stroke-linecap="round"/><polygon points="263.86400000000003,131.84799999999998 262.56181109412495,139.74130754838652 256.65103764719396,135.30822746318827" fill="#2a78d6"/><text x="270.86400000000003" y="124.84799999999998" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">3 + 4i</text><text x="42" y="280" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">横向 3，纵向 4</text><text x="450" y="78" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">长度与方向：5，约 53°</text><rect x="450" y="94" width="400" height="166" rx="5" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="462.0" y1="177.0" x2="838.0" y2="177.0" stroke="#6f7b89" stroke-width="1" stroke-linecap="round"/><line x1="650.0" y1="106.0" x2="650.0" y2="248.0" stroke="#6f7b89" stroke-width="1" stroke-linecap="round"/><line x1="650.0" y1="177.0" x2="683.9" y2="131.8" stroke="#1baf7a" stroke-width="2.3" stroke-linecap="round"/><polygon points="683.864,131.84799999999998 682.561811094125,139.74130754838652 676.651037647194,135.30822746318827" fill="#1baf7a"/><text x="690.864" y="124.84799999999998" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">3 + 4i</text><text x="462" y="280" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">同一个箭头，没有增加信息</text>
