<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 238" width="880" height="238" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="真实录音的完整 FFT 与单边 FFT 数组长度和频率范围对应关系">
<rect width="880" height="238" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">一段小提琴录音，三个数组长度怎样对应</text><rect x="30.0" y="66.0" width="253.3" height="92.0" rx="9" fill="#eef6fd" stroke="#0878b9" stroke-width="1.6"/><text x="156.7" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">时间样本</text><text x="156.7" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="156.7" dy="0">N = 59772</tspan><tspan x="156.7" dy="19">22050 Hz 单声道</tspan></text><line x1="288.3" y1="112.0" x2="308.3" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="308.3,112.0 302.2,115.4 302.2,108.6" fill="#5b6673"/><text x="298.3" y="178.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">完整 FFT</text><rect x="313.3" y="66.0" width="253.3" height="92.0" rx="9" fill="#fff3ee" stroke="#c65a3d" stroke-width="1.6"/><text x="440.0" y="96.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="middle">正负频率都保留</text><text x="440.0" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="440.0" dy="0">59772 个系数</tspan><tspan x="440.0" dy="19">len(fft) = N</tspan></text><line x1="571.7" y1="112.0" x2="591.7" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="591.7,112.0 585.5,115.4 585.5,108.6" fill="#5b6673"/><text x="581.7" y="178.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">去掉镜像</text><rect x="596.7" y="66.0" width="253.3" height="92.0" rx="9" fill="#edf8f3" stroke="#3b8f68" stroke-width="1.6"/><text x="723.3" y="96.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="middle">只留非负频率</text><text x="723.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="723.3" dy="0">29887 个系数</tspan><tspan x="723.3" dy="19">rfft 与 rfftfreq 配对</tspan></text><text x="30.0" y="216.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">最高 11025 Hz；本课看 0—2205 Hz</text>
</svg>
