<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 238" width="880" height="238" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="四段声音依次经过读取、快速傅里叶变换、取绝对值和低频范围显示">
<rect width="880" height="238" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">四段声音交给程序后，依次经过这四步</text><rect x="30.0" y="66.0" width="182.5" height="92.0" rx="9" fill="#eef6fd" stroke="#0878b9" stroke-width="1.6"/><text x="121.3" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">四段声音</text><text x="121.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="121.3" dy="0">小提琴、钢琴</tspan><tspan x="121.3" dy="19">萨克斯、噪声</tspan></text><line x1="217.5" y1="112.0" x2="237.5" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="237.5,112.0 231.4,115.4 231.4,108.6" fill="#5b6673"/><text x="227.5" y="178.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">读成数组</text><rect x="242.5" y="66.0" width="182.5" height="92.0" rx="9" fill="#fff3ee" stroke="#c65a3d" stroke-width="1.6"/><text x="333.8" y="96.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="middle">FFT</text><text x="333.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="333.8" dy="0">每段 N 个样本</tspan><tspan x="333.8" dy="19">得到 N 个复数</tspan></text><line x1="430.0" y1="112.0" x2="450.0" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="450.0,112.0 443.9,115.4 443.9,108.6" fill="#5b6673"/><text x="440.0" y="178.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">只看强度</text><rect x="455.0" y="66.0" width="182.5" height="92.0" rx="9" fill="#edf8f3" stroke="#3b8f68" stroke-width="1.6"/><text x="546.3" y="96.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="middle">取绝对值</text><text x="546.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="546.3" dy="0">np.abs(X)</tspan><tspan x="546.3" dy="19">复数变成幅度</tspan></text><line x1="642.5" y1="112.0" x2="662.5" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="662.5,112.0 656.4,115.4 656.4,108.6" fill="#5b6673"/><text x="652.5" y="178.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">放大低频</text><rect x="667.5" y="66.0" width="182.5" height="92.0" rx="9" fill="#fff8e8" stroke="#a5761a" stroke-width="1.6"/><text x="758.8" y="96.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="middle">只画前 10%</text><text x="758.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="758.8" dy="0">f_ratio = 0.1</tspan><tspan x="758.8" dy="19">约 0—2205 Hz</tspan></text><text x="30.0" y="216.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">f_ratio 只改显示范围，高频仍然算过</text>
</svg>
