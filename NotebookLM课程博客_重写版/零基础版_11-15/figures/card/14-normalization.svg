<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 871.88" width="912" height="871.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="相同振幅不同样本数的 FFT 原始模值与归一化幅值">
<rect width="912" height="871.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">同样的声音录得久一点，</tspan><tspan x="40" dy="58">模值就翻倍</tspan></text><text x="40" y="199.88" font-size="38" font-weight="700" fill="#c65a3d" text-anchor="start">原始 FFT 模值</text><rect x="40.0" y="217.9" width="300.0" height="132.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="50.0" y="283.9" width="280.0" height="56.0" rx="6" fill="#c65a3d" stroke="none" stroke-width="1" opacity="1"/><text x="190" y="395.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">录 1 秒　8000</text><rect x="380.0" y="217.9" width="300.0" height="132.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="390.0" y="227.9" width="280.0" height="112.0" rx="6" fill="#c65a3d" stroke="none" stroke-width="1" opacity="1"/><text x="530" y="395.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">录 2 秒　16000</text><text x="40" y="449.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">录得越久数越大，没法比</text><text x="40" y="521.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="start">按样本数归一化后</text><rect x="40.0" y="539.9" width="300.0" height="132.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="50.0" y="583.5" width="280.0" height="78.4" rx="6" fill="#3b8f68" stroke="none" stroke-width="1" opacity="1"/><text x="190" y="717.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">录 1 秒　0.70</text><rect x="380.0" y="539.9" width="300.0" height="132.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="390.0" y="583.5" width="280.0" height="78.4" rx="6" fill="#3b8f68" stroke="none" stroke-width="1" opacity="1"/><text x="530" y="717.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">录 2 秒　0.70</text><text x="40" y="771.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">回到真实振幅，可以比了</text><text x="40" y="831.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">不归一化，两段录音的高低根本没有可比性。</text>
</svg>
