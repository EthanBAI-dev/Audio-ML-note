<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 771.88" width="912" height="771.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="FFT 数组位置换算成真实赫兹频率">
<rect width="912" height="771.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">数组位置不是频率，</tspan><tspan x="40" dy="58">换算过才是</tspan></text><rect x="40.0" y="167.9" width="403.0" height="300.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="223.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">只知道数组位置</text><text x="64" y="307.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start">k = 41</text><text x="64" y="383.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">这是第几个格子，不是赫兹</text><rect x="469.0" y="167.9" width="403.0" height="300.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="493" y="223.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">换算之后</text><text x="493" y="307.88" font-size="46" font-weight="700" fill="#0878b9" text-anchor="start">441.4 Hz</text><text x="493" y="383.88" font-size="32" font-weight="400" fill="#0878b9" text-anchor="start">k × 采样率 ÷ FFT 长度</text><line x1="447.0" y1="317.9" x2="465.0" y2="317.9" stroke="#c65a3d" stroke-width="4" stroke-linecap="round"/><polygon points="465.0,317.9 450.7,325.0 450.7,310.8" fill="#c65a3d"/><rect x="40.0" y="523.9" width="832.0" height="152.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="583.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">41 × 16000 ÷ 1486</text><text x="64" y="639.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">采样率和 FFT 长度都得知道，少一个都换不出来</text><text x="40" y="731.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">图上不写单位，读者就只能猜。</text>
</svg>
