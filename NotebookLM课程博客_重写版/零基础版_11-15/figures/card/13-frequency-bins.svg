<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 627.88" width="912" height="627.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="采样率 8000 Hz、16 个样本对应的非负频率格">
<rect width="912" height="627.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">频率格是算出来的，</tspan><tspan x="40" dy="58">不是随便挑的</tspan></text><rect x="40.0" y="167.9" width="832.0" height="104.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="217.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">采样率 8000 Hz　·　样本数 16</text><text x="64" y="257.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">两者一除，间隔就定了</text><rect x="40.0" y="285.9" width="832.0" height="104.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="335.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="start">间隔 = 8000 ÷ 16 = 500 Hz</text><text x="64" y="375.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">0 到 4000 Hz 之间正好 9 个位置</text><line x1="60.0" y1="465.9" x2="852.0" y2="465.9" stroke="#d7dfe6" stroke-width="3" stroke-linecap="round"/><line x1="60.0" y1="447.9" x2="60.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><text x="60" y="523.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">0</text><line x1="159.0" y1="447.9" x2="159.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><line x1="258.0" y1="447.9" x2="258.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><text x="258" y="523.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">1000</text><line x1="357.0" y1="447.9" x2="357.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><line x1="456.0" y1="447.9" x2="456.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><text x="456" y="523.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">2000</text><line x1="555.0" y1="447.9" x2="555.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><line x1="654.0" y1="447.9" x2="654.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><text x="654" y="523.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">3000</text><line x1="753.0" y1="447.9" x2="753.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><line x1="852.0" y1="447.9" x2="852.0" y2="483.9" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><text x="852" y="523.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">4000</text><text x="40" y="587.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">想让格子更细，只能拉长录音，不能换个算法。</text>
</svg>
