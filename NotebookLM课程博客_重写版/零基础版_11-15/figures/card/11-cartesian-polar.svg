<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 689.88" width="912" height="689.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="复数 3+4i 的坐标读法与长度方向读法">
<rect width="912" height="689.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">同一个箭头，</tspan><tspan x="40" dy="58">两种读法</tspan></text><text x="48" y="207.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">横 3，纵 4</text><rect x="40.0" y="225.9" width="403.0" height="290.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><line x1="54.0" y1="370.9" x2="429.0" y2="370.9" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="241.5" y1="239.9" x2="241.5" y2="501.9" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="241.5" y1="370.9" x2="308.1" y2="370.9" stroke="#d7dfe6" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/><line x1="308.1" y1="370.9" x2="308.1" y2="282.1" stroke="#d7dfe6" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/><line x1="241.5" y1="370.9" x2="308.1" y2="282.1" stroke="#0878b9" stroke-width="4" stroke-linecap="round"/><polygon points="308.1,282.1 304.8,299.8 292.0,290.2" fill="#0878b9"/><text x="48" y="567.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">按格子走：先横 3 再纵 4</text><text x="477" y="207.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="start">长 5，转约 53°</text><rect x="469.0" y="225.9" width="403.0" height="290.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><line x1="483.0" y1="370.9" x2="858.0" y2="370.9" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="670.5" y1="239.9" x2="670.5" y2="501.9" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><path d="M716.5 370.88 A46 46 0 0 0 698.1 334.1" fill="none" stroke="#3b8f68" stroke-width="3"/><line x1="670.5" y1="370.9" x2="737.1" y2="282.1" stroke="#3b8f68" stroke-width="4" stroke-linecap="round"/><polygon points="737.1,282.1 733.8,299.8 721.0,290.2" fill="#3b8f68"/><text x="477" y="567.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">按长度和方向：直接指过去</text><text x="40" y="649.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">同一个箭头，没多也没少，只是换了说法。</text>
</svg>
