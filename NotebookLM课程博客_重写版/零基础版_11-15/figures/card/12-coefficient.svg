<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 653.88" width="912" height="653.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="横纵两个结果合成一个复数系数">
<rect width="912" height="653.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">两根探针的结果，</tspan><tspan x="40" dy="58">合成一个复数</tspan></text><rect x="40.0" y="167.9" width="420.0" height="380.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><line x1="54.0" y1="357.9" x2="446.0" y2="357.9" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="250.0" y1="181.9" x2="250.0" y2="533.9" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="250.0" y1="357.9" x2="343.6" y2="357.9" stroke="#d7dfe6" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/><line x1="343.6" y1="357.9" x2="343.6" y2="482.7" stroke="#d7dfe6" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/><line x1="250.0" y1="357.9" x2="343.6" y2="482.7" stroke="#0878b9" stroke-width="5" stroke-linecap="round"/><polygon points="343.6,482.7 327.5,474.6 340.3,465.0" fill="#0878b9"/><text x="500" y="223.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">横向结果</text><text x="500" y="267.88" font-size="38" font-weight="700" fill="#c65a3d" text-anchor="start">6</text><text x="500" y="315.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">纵向结果</text><text x="500" y="359.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">-8</text><text x="500" y="407.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">合起来</text><text x="500" y="451.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">6 − 8i</text><text x="500" y="499.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">也可以读成</text><text x="500" y="543.88" font-size="32" font-weight="700" fill="#3b8f68" text-anchor="start">强度 10，方向约 −53°</text><text x="40" y="613.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">一个复数同时装下了「有多强」和「从哪儿起步」。</text>
</svg>
