<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 833.88" width="912" height="833.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="复数乘法对应箭头的缩放与旋转">
<rect width="912" height="833.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">复数乘法只做两件事：</tspan><tspan x="40" dy="58">拉长，转向</tspan></text><rect x="40.0" y="167.9" width="832.0" height="400.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><line x1="54.0" y1="367.9" x2="858.0" y2="367.9" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="456.0" y1="181.9" x2="456.0" y2="553.9" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><circle cx="456" cy="367.88" r="166" fill="none" stroke="#d7dfe6" stroke-width="2" stroke-dasharray="8 8"/><line x1="456.0" y1="367.9" x2="542.3" y2="318.1" stroke="#0878b9" stroke-width="5" stroke-linecap="round"/><polygon points="542.3,318.1 532.3,333.1 524.4,319.2" fill="#0878b9"/><line x1="456.0" y1="367.9" x2="602.1" y2="283.2" stroke="#c65a3d" stroke-width="5" stroke-linecap="round"/><polygon points="602.1,283.2 592.1,298.2 584.1,284.4" fill="#c65a3d"/><line x1="456.0" y1="367.9" x2="445.8" y2="268.7" stroke="#3b8f68" stroke-width="5" stroke-linecap="round"/><polygon points="445.8,268.7 455.4,284.0 439.5,285.6" fill="#3b8f68"/><line x1="40.0" y1="619.9" x2="94.0" y2="619.9" stroke="#0878b9" stroke-width="6" stroke-linecap="round"/><text x="108" y="629.88" font-size="32" font-weight="400" fill="#1f2933" text-anchor="start">原来的箭头</text><line x1="40.0" y1="675.9" x2="94.0" y2="675.9" stroke="#c65a3d" stroke-width="6" stroke-linecap="round"/><text x="108" y="685.88" font-size="32" font-weight="400" fill="#1f2933" text-anchor="start">只变长，方向没动</text><line x1="40.0" y1="721.9" x2="94.0" y2="721.9" stroke="#3b8f68" stroke-width="6" stroke-linecap="round"/><text x="108" y="731.88" font-size="32" font-weight="400" fill="#1f2933" text-anchor="start">只转向，长度没变</text><text x="40" y="793.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">一堆代数，画在平面上就是这两个动作。</text>
</svg>
