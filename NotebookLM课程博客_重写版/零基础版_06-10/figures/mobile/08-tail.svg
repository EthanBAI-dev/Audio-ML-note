<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 385" width="420" height="385" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="录音结尾不足一帧时的三种处理规则">
<rect width="420" height="385" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">最后不够一帧的那一小截，</tspan><tspan x="20.0" dy="25">你打算怎么办</tspan></text><rect x="20.0" y="93.0" width="379.4" height="26.0" rx="4" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.4"/><rect x="399.4" y="93.0" width="0.6" height="26.0" rx="4" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.4"/><text x="30.0" y="111.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">128 个完整帧，用掉 66048 个样本</text><text x="20.0" y="137.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">剩 102 个 = 4.63 ms</text><rect x="20.0" y="153.0" width="380.0" height="58.0" rx="8" fill="#f5f8fa" stroke="#5b6673" stroke-width="1.4"/><text x="32.0" y="175.0" font-size="16" font-weight="700" fill="#5b6673" text-anchor="start">丢掉</text><text x="32.0" y="197.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">每段输出形状整齐；最末尾那点声音消失</text><rect x="20.0" y="219.0" width="380.0" height="58.0" rx="8" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.4"/><text x="32.0" y="241.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">保留短帧</text><text x="32.0" y="263.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">不丢声音；最后一个数用的样本数和别的不同</text><rect x="20.0" y="285.0" width="380.0" height="58.0" rx="8" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.4"/><text x="32.0" y="307.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">补零到整帧</text><text x="32.0" y="329.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">长度一致；峰值不受影响，但 RMS 会被零拉低</text><text x="20.0" y="369.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">三种都对。错的是训练时用一种、上线时用另一种。</text>
</svg>
