<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 401" width="420" height="401" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="直接取最大值会漏掉负方向上的峰">
<rect width="420" height="401" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">先取绝对值，</tspan><tspan x="20.0" dy="25">还是直接取最大值</tspan></text><rect x="20.0" y="93.0" width="380.0" height="96.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="20.0" y1="141.0" x2="400.0" y2="141.0" stroke="#d7dfe6" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="67.5" y1="141.0" x2="67.5" y2="150.1" stroke="#c65a3d" stroke-width="3" stroke-linecap="round"/><circle cx="67.5" cy="150.1" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="67.5" y="168.1" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">-0.2</text><line x1="162.5" y1="141.0" x2="162.5" y2="109.0" stroke="#0878b9" stroke-width="3" stroke-linecap="round"/><circle cx="162.5" cy="109.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="162.5" y="99.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">0.7</text><line x1="257.5" y1="141.0" x2="257.5" y2="182.1" stroke="#c65a3d" stroke-width="3" stroke-linecap="round"/><circle cx="257.5" cy="182.1" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="257.5" y="200.1" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">-0.9</text><line x1="352.5" y1="141.0" x2="352.5" y2="122.7" stroke="#0878b9" stroke-width="3" stroke-linecap="round"/><circle cx="352.5" cy="122.7" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="352.5" y="112.7" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">0.4</text><rect x="20.0" y="205.0" width="380.0" height="72.0" rx="9" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="229.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">直接 max(frame)</text><text x="386.0" y="231.0" font-size="20" font-weight="700" fill="#c65a3d" text-anchor="end">0.7</text><text x="34.0" y="255.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">漏掉 −0.9，它在负方向上更远</text><rect x="20.0" y="287.0" width="380.0" height="72.0" rx="9" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="34.0" y="311.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">先 abs 再 max</text><text x="386.0" y="313.0" font-size="20" font-weight="700" fill="#3b8f68" text-anchor="end">0.9</text><text x="34.0" y="337.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">离中线多远才是真正的峰高</text><text x="20.0" y="385.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">两个答案差 0.2，占真实峰高的 22%——而且程序不会报错。</text>
</svg>
