<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 425" width="420" height="425" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="一个采样点远短于人耳的时间分辨率，常用帧长落在 256 到 8192">
<rect width="420" height="425" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">一个采样点太短了，</tspan><tspan x="20.0" dy="25">短到人耳根本分不出</tspan></text><rect x="20.0" y="101.0" width="247.7" height="26.0" rx="4" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.2"/><text x="28.0" y="119.0" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="start">人耳分不出这么短</text><line x1="267.7" y1="93.0" x2="267.7" y2="251.0" stroke="#c65a3d" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round"/><text x="273.7" y="89.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">人耳约 10 ms</text><circle cx="49.4" cy="143.0" r="4" fill="#5b6673" stroke="none" stroke-width="1"/><text x="59.4" y="147.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">1 个采样点 = 0.0227 ms</text><circle cx="248.2" cy="169.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="258.2" y="173.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">256 个样本 = 5.8 ms</text><circle cx="273.0" cy="191.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="283.0" y="195.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">512 个样本 = 11.6 ms</text><circle cx="297.9" cy="213.0" r="5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="307.9" y="217.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">1024 个样本 = 23.2 ms</text><circle cx="322.8" cy="235.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="332.8" y="239.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">2048 个样本 = 46.4 ms</text><circle cx="347.6" cy="257.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="357.6" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">4096 个样本 = 92.9 ms</text><circle cx="372.5" cy="279.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="382.5" y="283.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">8192 个样本 = 185.8 ms</text><line x1="20.0" y1="301.0" x2="20.0" y2="306.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="20.0" y="320.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">0.01 ms</text><line x1="102.6" y1="301.0" x2="102.6" y2="306.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="102.6" y="320.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">0.1 ms</text><line x1="185.1" y1="301.0" x2="185.1" y2="306.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="185.1" y="320.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1 ms</text><line x1="267.7" y1="301.0" x2="267.7" y2="306.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="267.7" y="320.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">10 ms</text><line x1="350.3" y1="301.0" x2="350.3" y2="306.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="350.3" y="320.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">100 ms</text><text x="20.0" y="333.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">横轴每格十倍。一个采样点 0.0227 ms，比人耳的</tspan><tspan x="20.0" dy="21">10 ms 短四百多倍，所以一帧要成百上千个</tspan><tspan x="20.0" dy="21">采样点。取 2 的幂是因为快速傅里叶变换在</tspan><tspan x="20.0" dy="21">这种长度下最快，常用 256 到 8192。</tspan></text>
</svg>
