<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 477" width="420" height="477" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="振幅包络公式逐项拆解，以及取不取绝对值的差别">
<rect width="420" height="477" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">公式里每个符号是什么，</tspan><tspan x="20.0" dy="25">以及为什么必须补上绝对值</tspan></text><rect x="20.0" y="97.0" width="380.0" height="104.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="20.0" y="89.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">这一帧的 8 个数</text><line x1="20.0" y1="149.0" x2="400.0" y2="149.0" stroke="#d7dfe6" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="46.0" y1="149.0" x2="46.0" y2="134.1" stroke="#9fc4dd" stroke-width="2" stroke-linecap="round"/><circle cx="46.0" cy="134.1" r="3.4" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="46.0" y="124.1" font-size="14" font-weight="400" fill="#9fc4dd" text-anchor="middle">0.3</text><line x1="92.9" y1="149.0" x2="92.9" y2="114.3" stroke="#0878b9" stroke-width="3.2" stroke-linecap="round"/><circle cx="92.9" cy="114.3" r="5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="92.9" y="104.3" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">0.7</text><line x1="139.7" y1="149.0" x2="139.7" y2="158.9" stroke="#c9a9a0" stroke-width="2" stroke-linecap="round"/><circle cx="139.7" cy="158.9" r="3.4" fill="#c9a9a0" stroke="none" stroke-width="1"/><text x="139.7" y="175.9" font-size="14" font-weight="400" fill="#c9a9a0" text-anchor="middle">-0.2</text><line x1="186.6" y1="149.0" x2="186.6" y2="193.6" stroke="#c65a3d" stroke-width="3.2" stroke-linecap="round"/><circle cx="186.6" cy="193.6" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="186.6" y="210.6" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">-0.9</text><line x1="233.4" y1="149.0" x2="233.4" y2="129.2" stroke="#9fc4dd" stroke-width="2" stroke-linecap="round"/><circle cx="233.4" cy="129.2" r="3.4" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="233.4" y="119.2" font-size="14" font-weight="400" fill="#9fc4dd" text-anchor="middle">0.4</text><line x1="280.3" y1="149.0" x2="280.3" y2="144.0" stroke="#9fc4dd" stroke-width="2" stroke-linecap="round"/><circle cx="280.3" cy="144.0" r="3.4" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="280.3" y="134.0" font-size="14" font-weight="400" fill="#9fc4dd" text-anchor="middle">0.1</text><line x1="327.1" y1="149.0" x2="327.1" y2="173.8" stroke="#c9a9a0" stroke-width="2" stroke-linecap="round"/><circle cx="327.1" cy="173.8" r="3.4" fill="#c9a9a0" stroke="none" stroke-width="1"/><text x="327.1" y="190.8" font-size="14" font-weight="400" fill="#c9a9a0" text-anchor="middle">-0.5</text><line x1="374.0" y1="149.0" x2="374.0" y2="119.3" stroke="#9fc4dd" stroke-width="2" stroke-linecap="round"/><circle cx="374.0" cy="119.3" r="3.4" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="374.0" y="109.3" font-size="14" font-weight="400" fill="#9fc4dd" text-anchor="middle">0.6</text><rect x="20.0" y="223.0" width="380.0" height="66.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="32.0" y="247.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">照公式直接取最大</text><text x="388.0" y="250.0" font-size="22" font-weight="700" fill="#0878b9" text-anchor="end">0.7</text><text x="32.0" y="271.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">漏掉 −0.9，它在负方向上离中线更远</text><rect x="20.0" y="297.0" width="380.0" height="66.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="32.0" y="321.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">先取绝对值再取最大</text><text x="388.0" y="324.0" font-size="22" font-weight="700" fill="#c65a3d" text-anchor="end">0.9</text><text x="32.0" y="345.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">离中线的距离才是这一帧真正的峰</text><text x="20.0" y="385.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">两个答案差 0.2，占真正峰高的 22%，</tspan><tspan x="20.0" dy="21">而且程序不会报错。PPT 写的是「max amplitude</tspan><tspan x="20.0" dy="21">value」，振幅本来就指离零多远、不带符号；</tspan><tspan x="20.0" dy="21">写成代码时必须补 abs，否则最深的谷看不见。</tspan></text>
</svg>
