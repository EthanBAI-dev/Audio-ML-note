<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 335" width="420" height="335" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="振幅包络、均方根、过零率各回答一个问题">
<rect width="420" height="335" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">同一段小片段，</tspan><tspan x="20.0" dy="25">三种特征各问一个不同的问题</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">振幅包络 AE</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">这一小段里最高峰有多高</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><text x="60.0" y="156.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">只看一个数</text><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">均方根 RMS</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">这一小段整体有多强</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><text x="60.0" y="230.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">全部数一起算</text><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#faf4e6" stroke="#a5761a" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">过零率 ZCR</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">波形穿过中线有多频繁</text><text x="20.0" y="313.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">三个答案都在，才知道是「短促一下」还是「一直很响」</text>
</svg>
