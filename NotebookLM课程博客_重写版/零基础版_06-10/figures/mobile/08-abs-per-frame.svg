<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 479" width="420" height="479" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="整段最大值看不出取绝对值的差别，逐帧才看得见">
<rect width="420" height="479" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">整段最大值几乎没差别，</tspan><tspan x="20.0" dy="25">逐帧却有两三成的帧被低估</tspan></text><text x="20.0" y="95.0" font-size="16" font-weight="700" fill="#5b6673" text-anchor="start">整段的最大值</text><line x1="20.0" y1="195.0" x2="400.0" y2="195.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="30.0" y="131.8" width="18.0" height="63.2" rx="2" fill="#9fc4dd" stroke="none" stroke-width="1"/><rect x="52.0" y="131.2" width="18.0" height="63.8" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="83.3" y="212.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="156.7" y="137.5" width="18.0" height="57.5" rx="2" fill="#9fc4dd" stroke="none" stroke-width="1"/><rect x="178.7" y="137.5" width="18.0" height="57.5" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="210.0" y="212.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="283.3" y="117.0" width="18.0" height="78.0" rx="2" fill="#9fc4dd" stroke="none" stroke-width="1"/><rect x="305.3" y="117.0" width="18.0" height="78.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="336.7" y="212.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="20.0" y="247.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">逐帧：有多少帧被低估</text><line x1="20.0" y1="347.0" x2="400.0" y2="347.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="67.3" y="NaN" width="32.0" height="NaN" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="83.3" y="NaN" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">NaN%</text><text x="83.3" y="364.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="194.0" y="NaN" width="32.0" height="NaN" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="210.0" y="NaN" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">NaN%</text><text x="210.0" y="364.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="320.7" y="NaN" width="32.0" height="NaN" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="336.7" y="NaN" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">NaN%</text><text x="336.7" y="364.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="20.0" y="387.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">左边两根柱几乎一样高：整段最大值把问题</tspan><tspan x="20.0" dy="21">掩盖了。右边逐帧看，18% 到 36% 的帧被低估，</tspan><tspan x="20.0" dy="21">最多一帧少算 0.2952。包络用的正是逐帧结果，</tspan><tspan x="20.0" dy="21">所以 abs 不能省。</tspan></text>
</svg>
