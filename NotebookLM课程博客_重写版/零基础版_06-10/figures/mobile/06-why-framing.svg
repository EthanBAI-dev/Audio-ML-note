<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 677" width="420" height="677" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="整段平均、逐个样本、分帧三种做法的对比">
<rect width="420" height="677" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">十几万个数字，</tspan><tspan x="20.0" dy="25">整段算和逐个算都不行</tspan></text><rect x="20.0" y="85.0" width="380.0" height="154.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="36.0" y="111.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">整段压成一个数</text><rect x="36.0" y="123.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="141.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">十几万个数字</text><line x1="50.0" y1="150.0" x2="50.0" y2="159.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,159.0 47.6,154.6 52.4,154.6" fill="#c65a3d"/><rect x="36.0" y="161.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="179.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">求一个平均值</text><line x1="50.0" y1="188.0" x2="50.0" y2="197.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,197.0 47.6,192.6 52.4,192.6" fill="#c65a3d"/><rect x="36.0" y="199.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="46.0" y="217.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">第几秒响的，没了</text><rect x="20.0" y="253.0" width="380.0" height="154.0" rx="10" fill="#fdf6e6" stroke="#a5761a" stroke-width="1.6"/><text x="36.0" y="279.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">逐个数字看</text><rect x="36.0" y="291.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="309.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">十几万个数字</text><line x1="50.0" y1="318.0" x2="50.0" y2="327.0" stroke="#a5761a" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,327.0 47.6,322.6 52.4,322.6" fill="#a5761a"/><rect x="36.0" y="329.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="347.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">十几万个判断</text><line x1="50.0" y1="356.0" x2="50.0" y2="365.0" stroke="#a5761a" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,365.0 47.6,360.6 52.4,360.6" fill="#a5761a"/><rect x="36.0" y="367.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#a5761a" stroke-width="2"/><text x="46.0" y="385.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="start">每个数都没有上下文</text><rect x="20.0" y="421.0" width="380.0" height="154.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="36.0" y="447.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">分帧</text><rect x="36.0" y="459.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="477.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">切成几百个小段</text><line x1="50.0" y1="486.0" x2="50.0" y2="495.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,495.0 47.6,490.6 52.4,490.6" fill="#3b8f68"/><rect x="36.0" y="497.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="515.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">每段算一个数</text><line x1="50.0" y1="524.0" x2="50.0" y2="533.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,533.0 47.6,528.6 52.4,528.6" fill="#3b8f68"/><rect x="36.0" y="535.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="46.0" y="553.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">一条带时间的曲线</text><text x="20.0" y="593.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">整段压成一个数：有数值可以比，但时间位置被抹掉了</tspan><tspan x="20.0" dy="21">逐个数字看：时间位置全在，但一个瞬间说明不了任何事</tspan><tspan x="20.0" dy="21">分帧：既有能比较的数值，又保住了「第几秒」</tspan></text>
</svg>
