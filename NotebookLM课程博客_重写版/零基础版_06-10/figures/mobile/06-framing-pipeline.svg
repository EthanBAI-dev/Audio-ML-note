<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 409" width="420" height="409" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="分帧、加窗、逐帧计算、聚合四步流程">
<rect width="420" height="409" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">分帧之后，</tspan><tspan x="20.0" dy="25">还要走三步</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">① 分帧</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">切成 N 个小段可以重叠</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">② 加窗</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">把每段两端压低（只在算频率时要）</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">③ 逐帧计算</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">每段算出一个数或一列数</text><line x1="46.0" y1="291.0" x2="46.0" y2="305.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,305.0 43.1,299.7 48.9,299.7" fill="#5b6673"/><rect x="20.0" y="309.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="333.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">④ 聚合</text><text x="34.0" y="353.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">压成几个统计量（要不要扔掉时间）</text><text x="20.0" y="387.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">②和④都是可选的；④一旦做了，「第几秒」就再也找不回来。</text>
</svg>
