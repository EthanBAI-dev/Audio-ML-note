<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 491" width="420" height="491" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="五段素材的均方根与过零率对比">
