<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 529" width="420" height="529" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="直接取最大值与先取绝对值的结果差别">
<rect width="420" height="529" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">为什么必须先取绝对值？</tspan><tspan x="22" dy="25">负方向的大峰也同样大</tspan></text><text x="22" y="105" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">只找数值最大的样本</text><rect x="47" y="196" width="46" height="14" rx="2" fill="#eb6834" stroke="none" stroke-width="1"/><text x="70" y="220" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">-0.2</text><rect x="128.5" y="147" width="46" height="49" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="151.5" y="220" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">0.7</text><rect x="210" y="196" width="46" height="63" rx="2" fill="#eb6834" stroke="none" stroke-width="1"/><text x="233" y="220" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">-0.9</text><rect x="291.5" y="168" width="46" height="28" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="314.5" y="220" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">0.4</text><line x1="34.0" y1="196.0" x2="386.0" y2="196.0" stroke="#0b0b0b" stroke-width="1.2" stroke-linecap="round"/><text x="34" y="264" font-size="15" font-weight="700" fill="#eb6834" text-anchor="start">结果：0.7（漏掉 −0.9）</text><text x="22" y="333" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">先看离零线有多远</text><rect x="47" y="424" width="46" height="14" rx="2" fill="#eb6834" stroke="none" stroke-width="1"/><text x="70" y="448" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">-0.2</text><rect x="128.5" y="375" width="46" height="49" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="151.5" y="448" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">0.7</text><rect x="210" y="424" width="46" height="63" rx="2" fill="#eb6834" stroke="none" stroke-width="1"/><text x="233" y="448" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">-0.9</text><rect x="291.5" y="396" width="46" height="28" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="314.5" y="448" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">0.4</text><line x1="34.0" y1="424.0" x2="386.0" y2="424.0" stroke="#0b0b0b" stroke-width="1.2" stroke-linecap="round"/><text x="34" y="492" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start">结果：0.9（正确）</text>
</svg>
