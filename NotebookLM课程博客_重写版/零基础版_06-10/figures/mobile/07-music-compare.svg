nt-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="310.7" y="681.9" width="52.0" height="53.1" rx="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="336.7" y="675.9" font-size="13.5" font-weight="700" fill="#3b8f68" text-anchor="middle">0.0962</text><text x="336.7" y="753.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="20.0" y="787.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="start">ZCR 平均</text><line x1="20.0" y1="863.0" x2="400.0" y2="863.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="57.3" y="838.3" width="52.0" height="24.7" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="83.3" y="832.3" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.0612</text><text x="83.3" y="881.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="184.0" y="837.4" width="52.0" height="25.6" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="210.0" y="831.4" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.0633</text><text x="210.0" y="881.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="310.7" y="809.2" width="52.0" height="53.8" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="336.7" y="803.2" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.1332</text><text x="336.7" y="881.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="400.0" y="787.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="end">摇滚 / 古典 2.18×</text><text x="20.0" y="929.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">统一电平只是把整段乘一个数。AE 和 RMS</tspan><tspan x="20.0" dy="21">跟着变，摇滚对古典从 1.78 和 1.49 掉到</tspan><tspan x="20.0" dy="21">1.18 和 0.99——原来那点差别几乎全是</tspan><tspan x="20.0" dy="21">「谁录得响」。ZCR 数的是穿过中线的次数，</tspan><tspan x="20.0" dy="21">整段乘一个正数一次也不会多不会少，</tspan><tspan x="20.0" dy="21">所以 2.18 倍纹丝不动。这条才是风格差别。</tspan></text>
