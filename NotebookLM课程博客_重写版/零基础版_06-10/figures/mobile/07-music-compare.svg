<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 595" width="420" height="595" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="三段音乐在振幅包络、均方根和过零率上的对比">
<rect width="420" height="595" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">三段音乐各 10 秒，</tspan><tspan x="20.0" dy="25">三种特征只有一种真的分得开</tspan></text><text x="20.0" y="93.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">AE 平均</text><line x1="20.0" y1="179.0" x2="400.0" y2="179.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="57.3" y="144.0" width="52.0" height="35.0" rx="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="83.3" y="138.0" font-size="13.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.1631</text><text x="83.3" y="197.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="184.0" y="131.1" width="52.0" height="47.9" rx="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="210.0" y="125.1" font-size="13.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.2234</text><text x="210.0" y="197.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="310.7" y="116.6" width="52.0" height="62.4" rx="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="336.7" y="110.6" font-size="13.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.2911</text><text x="336.7" y="197.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="20.0" y="231.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">RMS 平均</text><line x1="20.0" y1="317.0" x2="400.0" y2="317.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="57.3" y="275.2" width="52.0" height="41.8" rx="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="83.3" y="269.2" font-size="13.5" font-weight="700" fill="#3b8f68" text-anchor="middle">0.0587</text><text x="83.3" y="335.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="184.0" y="262.6" width="52.0" height="54.4" rx="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="210.0" y="256.6" font-size="13.5" font-weight="700" fill="#3b8f68" text-anchor="middle">0.0764</text><text x="210.0" y="335.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="310.7" y="254.6" width="52.0" height="62.4" rx="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="336.7" y="248.6" font-size="13.5" font-weight="700" fill="#3b8f68" text-anchor="middle">0.0876</text><text x="336.7" y="335.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="20.0" y="369.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="start">ZCR 平均</text><line x1="20.0" y1="455.0" x2="400.0" y2="455.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="57.3" y="426.3" width="52.0" height="28.7" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="83.3" y="420.3" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.0612</text><text x="83.3" y="473.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="184.0" y="425.3" width="52.0" height="29.7" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="210.0" y="419.3" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.0633</text><text x="210.0" y="473.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="310.7" y="392.6" width="52.0" height="62.4" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="336.7" y="386.6" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.1332</text><text x="336.7" y="473.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="20.0" y="505.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">AE 和 RMS 上三段挨得很近，因为电平</tspan><tspan x="20.0" dy="21">本来就统一过。ZCR 上摇滚是古典的</tspan><tspan x="20.0" dy="21">2.2 倍——失真吉他和镲片让波形穿过</tspan><tspan x="20.0" dy="21">中线的次数明显更多。这一条才有用。</tspan></text>
</svg>
