<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 657" width="420" height="657" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="尾帧不足时丢弃、保留和补零三种策略">
<rect width="420" height="657" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">录音结尾不够一整帧时，</tspan><tspan x="22" dy="25">必须明确采用哪一种规则</tspan></text><text x="22" y="104" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">丢弃尾帧</text><rect x="32" y="125" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="109.3913043478261" y="125" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="186.7826086956522" y="125" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="264.17391304347825" y="125" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><path d="M341.5652173913044 125 l42.56521739130435 42 M384.1304347826087 125 l-42.56521739130435 42" fill="none" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="199" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">长度整齐</text><text x="32" y="228" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">最后一点声音可能消失</text><text x="22" y="298" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">保留短尾帧</text><rect x="32" y="319" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="109.3913043478261" y="319" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="186.7826086956522" y="319" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="264.17391304347825" y="319" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="341.5652173913044" y="319" width="42.56521739130435" height="42" rx="2" fill="#edf7f2" stroke="#1baf7a" stroke-width="1.4"/><text x="32" y="393" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">不丢声音</text><text x="32" y="422" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">最后一帧样本数不同</text><text x="22" y="492" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">补零到整帧</text><rect x="32" y="513" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="109.3913043478261" y="513" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="186.7826086956522" y="513" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="264.17391304347825" y="513" width="73.3913043478261" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="341.5652173913044" y="513" width="42.56521739130435" height="42" rx="2" fill="#edf7f2" stroke="#1baf7a" stroke-width="1.4"/><rect x="384.1304347826087" y="513" width="34.82608695652174" height="42" rx="2" fill="#fff" stroke="#6f7b89" stroke-width="1"/><text x="32" y="587" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">形状整齐</text><text x="32" y="616" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">补入的零会改变统计量</text>
</svg>
