<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">RMS 的四步：</tspan><tspan x="22" dy="25">平方、求平均，再开平方</tspan></text><circle cx="40" cy="103" r="13" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="40" y="108" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="61" y="108" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">原始样本</text><rect x="22" y="126" width="376" height="78" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="210" y="171" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="middle">1, −1, 0.5, −0.5</text><line x1="210.0" y1="209.0" x2="210.0" y2="246.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="210,246 206.76754577120963,239.791035540545 213.23245422879037,239.791035540545" fill="#6f7b89"/><circle cx="40" cy="271" r="13" fill="#eb6834" stroke="none" stroke-width="1"/><text x="40" y="276" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="61" y="276" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">每个数平方</text><rect x="22" y="294" width="376" height="78" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="210" y="339" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="middle">1, 1, 0.25, 0.25</text><line x1="210.0" y1="377.0" x2="210.0" y2="414.0" stroke="#6f7b89" stroke-width="1.7" stroke-linecap="round"/><polygon points="210,414 206.76754577120963,407.791035540545 213.23245422879037,407.791035540545" fill="#6f7b89"/><circle cx="40" cy="439" r="13" fill="#1baf7a" stroke="none" stroke-width="1"/><text x="40" y="444" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="61" y="444" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">求平方的平均</text><rect x="22" y="462" width="376" height="78" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="210" y="507