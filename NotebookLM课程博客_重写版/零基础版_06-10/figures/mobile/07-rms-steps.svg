<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 409" width="420" height="409" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="均方根的三步计算，从四个数得到 0.7906">
<rect width="420" height="409" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">四个数直接求平均等于 0，</tspan><tspan x="20.0" dy="25">平方之后才不会互相抵消</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#5b6673" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#5b6673" text-anchor="start">原始四个数</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">1  -1  0.5  -0.5，平均 = 0</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">① 方：每个数平方</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">1  1  0.25  0.25，负号没有了</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">② 均：求平均</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0.625，一帧塌成一个数</text><line x1="46.0" y1="291.0" x2="46.0" y2="305.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,305.0 43.1,299.7 48.9,299.7" fill="#5b6673"/><rect x="20.0" y="309.0" width="380.0" height="54.0" rx="9" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="333.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">③ 根：再开平方</text><text x="34.0" y="353.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0.7906，量级回到和原数一样</text><text x="20.0" y="387.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">名字就是倒着念这三步：根 · 均 · 方</text>
</svg>
