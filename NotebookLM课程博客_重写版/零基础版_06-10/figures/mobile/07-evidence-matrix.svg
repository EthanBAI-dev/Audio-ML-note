<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 663" width="420" height="663" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="振幅包络、RMS 和过零率各自能回答与不能回答的问题">
<rect width="420" height="663" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">三条曲线都只是证据，</tspan><tspan x="22" dy="25">没有一条能独自认出声音</tspan></text><rect x="22" y="81" width="376" height="132" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="36" y="106" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">突然的点击或削波</text><text x="36" y="135" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">AE</text><text x="90" y="135" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">AE 最敏感</text><text x="36" y="160" font-size="14" font-weight="700" fill="#eb6834" text-anchor="start">RMS</text><text x="90" y="160" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">RMS 会被平均</text><text x="36" y="185" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">ZCR</text><text x="90" y="185" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">ZCR 不一定高</text><rect x="22" y="225" width="376" height="132" rx="9" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><text x="36" y="250" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">持续的强弱变化</text><text x="36" y="279" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">AE</text><text x="90" y="279" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">AE 看峰值</text><text x="36" y="304" font-size="14" font-weight="700" fill="#eb6834" text-anchor="start">RMS</text><text x="90" y="304" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">RMS 更稳定</text><text x="36" y="329" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">ZCR</text><text x="90" y="329" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">ZCR 说明不了强弱</text><rect x="22" y="369" width="376" height="132" rx="9" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="36" y="394" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">清音或噪声样片段</text><text x="36" y="423" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">AE</text><text x="90" y="423" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">强弱可能很低</text><text x="36" y="448" font-size="14" font-weight="700" fill="#eb6834" text-anchor="start">RMS</text><text x="90" y="448" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">RMS 可能很低</text><text x="36" y="473" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">ZCR</text><text x="90" y="473" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">ZCR 往往升高</text><rect x="22" y="513" width="376" height="132" rx="9" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><text x="36" y="538" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">音色或具体音高</text><text x="36" y="567" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="start">AE</text><text x="90" y="567" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">信息不足</text><text x="36" y="592" font-size="14" font-weight="700" fill="#eb6834" text-anchor="start">RMS</text><text x="90" y="592" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">信息不足</text><text x="36" y="617" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="start">ZCR</text><text x="90" y="617" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">只能给粗线索</text>
</svg>
