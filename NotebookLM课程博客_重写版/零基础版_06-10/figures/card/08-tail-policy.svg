<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 833.88" width="912" height="833.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="丢弃尾帧、保留短尾帧与补零三种结尾规则">
<rect width="912" height="833.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">最后不够一帧，</tspan><tspan x="40" dy="58">三种处理办法</tspan></text><rect x="40.0" y="167.9" width="832.0" height="176.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="219.88" font-size="38" font-weight="700" fill="#c65a3d" text-anchor="start">丢掉尾巴</text><text x="64" y="265.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">实现最简单，但录音末尾没有结果</text><rect x="532.0" y="285.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="614.0" y="285.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="696.0" y="285.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="778.0" y="285.9" width="40.0" height="36.0" rx="5" fill="#fff" stroke="#c8d2da" stroke-width="2" opacity="1"/><line x1="786.0" y1="293.9" x2="810.0" y2="313.9" stroke="#c65a3d" stroke-width="3.5" stroke-linecap="round"/><line x1="810.0" y1="293.9" x2="786.0" y2="313.9" stroke="#c65a3d" stroke-width="3.5" stroke-linecap="round"/><rect x="40.0" y="361.9" width="832.0" height="176.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="413.88" font-size="38" font-weight="700" fill="#a5761a" text-anchor="start">留一个短帧</text><text x="64" y="459.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">有结果，但这一帧和别的不可比</text><rect x="532.0" y="479.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="614.0" y="479.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="696.0" y="479.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="778.0" y="479.9" width="40.0" height="36.0" rx="5" fill="#fdf3df" stroke="#a5761a" stroke-width="2.5" opacity="1"/><rect x="40.0" y="555.9" width="832.0" height="176.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="607.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="start">补零到同样长</text><text x="64" y="653.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">长度一致，代价是末尾被压低</text><rect x="532.0" y="673.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="614.0" y="673.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="696.0" y="673.9" width="74.0" height="36.0" rx="5" fill="#edf6fc" stroke="#0878b9" stroke-width="2" opacity="1"/><rect x="778.0" y="673.9" width="40.0" height="36.0" rx="5" fill="#fff" stroke="#3b8f68" stroke-width="2.5" opacity="1"/><rect x="818.0" y="673.9" width="34.0" height="36.0" rx="5" fill="#eef7f2" stroke="#3b8f68" stroke-width="2.5" opacity="1"/><text x="835" y="699.88" font-size="32" font-weight="700" fill="#3b8f68" text-anchor="middle">0</text><text x="40" y="793.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">选哪种都行，但必须写下来，不然别人复现不了。</text>
</svg>
