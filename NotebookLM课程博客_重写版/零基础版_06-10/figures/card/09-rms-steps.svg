<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 771.88" width="912" height="771.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="RMS 从原始数字到平方、平均再开方的四步">
<rect width="912" height="771.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">RMS 的四步</tspan><tspan x="40" dy="58">（一帧四个数）</tspan></text><rect x="40.0" y="167.9" width="832.0" height="116.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="84.0" cy="211.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="84" y="222.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="124" y="221.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">原始数字</text><text x="848" y="221.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="end">0.6　-0.8　0.4　-1.0</text><text x="124" y="263.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">有正有负，直接相加会抵消</text><rect x="40.0" y="297.9" width="832.0" height="116.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="84.0" cy="341.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="84" y="352.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="124" y="351.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">各自平方</text><text x="848" y="351.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="end">0.36　0.64　0.16　1.00</text><text x="124" y="393.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">负号消失，大的更突出</text><rect x="40.0" y="427.9" width="832.0" height="116.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="84.0" cy="471.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="84" y="482.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="124" y="481.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">求平均</text><text x="848" y="481.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="end">0.54</text><text x="124" y="523.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">得到平均的“能量”</text><rect x="40.0" y="557.9" width="832.0" height="116.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="84.0" cy="601.9" r="24" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="84" y="612.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="124" y="611.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">再开平方</text><text x="848" y="611.88" font-size="38" font-weight="700" fill="#c65a3d" text-anchor="end">0.73</text><text x="124" y="653.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">回到和振幅相近的量级</text><text x="40" y="731.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">平方是为了不抵消，开方是为了量级能对得上。</text>
</svg>
