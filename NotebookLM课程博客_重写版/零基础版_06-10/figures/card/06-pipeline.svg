<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 759.88" width="912" height="759.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="录音经过切段、逐帧计算和汇总的四个步骤">
<rect width="912" height="759.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">录音变成数字</tspan><tspan x="40" dy="58">要走的四步</tspan></text><rect x="40.0" y="167.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="86.0" cy="223.9" r="26" fill="#0878b9" stroke="none" stroke-width="1"/><text x="86" y="235.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="132" y="213.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">连续录音</text><text x="132" y="257.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">一长串数字，还看不出结构</text><rect x="40.0" y="295.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="86.0" cy="351.9" r="26" fill="#0878b9" stroke="none" stroke-width="1"/><text x="86" y="363.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="132" y="341.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">切成短帧</text><text x="132" y="385.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">每段短到可以当作没怎么变</text><rect x="40.0" y="423.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="86.0" cy="479.9" r="26" fill="#0878b9" stroke="none" stroke-width="1"/><text x="86" y="491.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="132" y="469.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">每帧算一个数</text><text x="132" y="513.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">一段声音换成一个可比较的量</text><rect x="40.0" y="551.9" width="832.0" height="112.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="86.0" cy="607.9" r="26" fill="#0878b9" stroke="none" stroke-width="1"/><text x="86" y="619.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="132" y="597.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">保留或汇总</text><text x="132" y="641.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">留顺序看变化，汇总看整体</text><text x="40" y="719.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">切多长、怎么汇总，决定程序看得见什么。</text>
</svg>
