<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 735.88" width="912" height="735.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="振幅包络、RMS 与过零率对四类任务的能力对照">
<rect width="912" height="735.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">三种特征，</tspan><tspan x="40" dy="58">各自能回答哪种问题</tspan></text><text x="482" y="155.88" font-size="32" font-weight="700" fill="#0878b9" text-anchor="middle">包络</text><text x="632" y="155.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="middle">RMS</text><text x="782" y="155.88" font-size="32" font-weight="700" fill="#3b8f68" text-anchor="middle">过零率</text><rect x="40.0" y="175.9" width="832.0" height="104.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="62" y="239.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">声音什么时候开始</text><text x="482" y="243.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="middle">✓</text><text x="632" y="243.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="middle">✓</text><text x="782" y="243.88" font-size="38" font-weight="700" fill="#b6c0ca" text-anchor="middle">—</text><rect x="40.0" y="293.9" width="832.0" height="104.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="62" y="357.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">整体有多响</text><text x="482" y="361.88" font-size="38" font-weight="700" fill="#b6c0ca" text-anchor="middle">—</text><text x="632" y="361.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="middle">✓</text><text x="782" y="361.88" font-size="38" font-weight="700" fill="#b6c0ca" text-anchor="middle">—</text><rect x="40.0" y="411.9" width="832.0" height="104.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="62" y="475.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">是语音还是噪声</text><text x="482" y="479.88" font-size="38" font-weight="700" fill="#b6c0ca" text-anchor="middle">—</text><text x="632" y="479.88" font-size="38" font-weight="700" fill="#b6c0ca" text-anchor="middle">—</text><text x="782" y="479.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="middle">✓</text><rect x="40.0" y="529.9" width="832.0" height="104.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="62" y="593.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">是不是同一件乐器</text><text x="482" y="597.88" font-size="38" font-weight="700" fill="#b6c0ca" text-anchor="middle">—</text><text x="632" y="597.88" font-size="38" font-weight="700" fill="#b6c0ca" text-anchor="middle">—</text><text x="782" y="597.88" font-size="38" font-weight="700" fill="#b6c0ca" text-anchor="middle">—</text><text x="40" y="695.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">最后一行三个都答不了，所以下一步要拆频率。</text>
</svg>
