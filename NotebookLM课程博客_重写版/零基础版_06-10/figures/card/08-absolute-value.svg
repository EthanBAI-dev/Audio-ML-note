ext x="332" y="531.88" font-size="32" font-weight="700" fill="#3b8f68" text-anchor="middle">0.9</text><rect x="432.0" y="481.9" width="168.0" height="76.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="516" y="531.88" font-size="32" font-weight="400" fill="#1f2933" text-anchor="middle">0.5</text><rect x="616.0" y="481.9" width="168.0" height="76.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="700" y="531.88" font-size="32" font-weight="400" fill="#1f2933" text-anchor="middle">0.2</text><text x="64" y="591.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">选出 0.9，才是真正的峰</text><text x="40" y="675.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">振幅问的是离零线多远，方向不算数。</text>
