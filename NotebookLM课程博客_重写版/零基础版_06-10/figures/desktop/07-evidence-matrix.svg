<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="振幅包络、RMS 和过零率各自能回答与不能回答的问题">
<rect width="880" height="356" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">三条曲线都只是证据，没有一条能独自认出声音</text><text x="38" y="82" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">要判断什么</text><text x="268" y="82" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">AE</text><text x="464.66666666666663" y="82" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">RMS</text><text x="661.3333333333333" y="82" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">ZCR</text><line x1="30.0" y1="94.0" x2="850.0" y2="94.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><rect x="30" y="100" width="820" height="56" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1"/><text x="38" y="122" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start"><tspan x="38" dy="0">突然的点击或削波</tspan></text><text x="268" y="122" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="268" dy="0">AE 最敏感</tspan></text><text x="464.66666666666663" y="122" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="464.66666666666663" dy="0">RMS 会被平均</tspan></text><text x="661.3333333333333" y="122" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="661.3333333333333" dy="0">ZCR 不一定高</tspan></text><text x="38" y="178" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start"><tspan x="38" dy="0">持续的强弱变化</tspan></text><text x="268" y="178" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="268" dy="0">AE 看峰值</tspan></text><text x="464.66666666666663" y="178" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="464.66666666666663" dy="0">RMS 更稳定</tspan></text><text x="661.3333333333333" y="178" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="661.3333333333333" dy="0">ZCR 说明不了强弱</tspan></text><rect x="30" y="212" width="820" height="56" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1"/><text x="38" y="234" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start"><tspan x="38" dy="0">清音或噪声样片段</tspan></text><text x="268" y="234" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="268" dy="0">强弱可能很低</tspan></text><text x="464.66666666666663" y="234" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="464.66666666666663" dy="0">RMS 可能很低</tspan></text><text x="661.3333333333333" y="234" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="661.3333333333333" dy="0">ZCR 往往升高</tspan></text><text x="38" y="290" font-size="14" font-weight="400" fill="#0b0b0b" text-anchor="start"><tspan x="38" dy="0">音色或具体音高</tspan></text><text x="268" y="290" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="268" dy="0">信息不足</tspan></text><text x="464.66666666666663" y="290" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="464.66666666666663" dy="0">信息不足</tspan></text><text x="661.3333333333333" y="290" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="661.3333333333333" dy="0">只能给粗线索</tspan></text>
</svg>
