<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 482" width="880" height="482" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="整段平均、逐个样本、分帧三种做法的对比">
<rect width="880" height="482" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">十几万个数字，整段算和逐个算都不行</text><rect x="30.0" y="64.0" width="820.0" height="118.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="46.0" y="90.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">整段压成一个数</text><rect x="46.0" y="104.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="170.0" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">十几万个数字</text><line x1="298.0" y1="121.0" x2="312.0" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="312.0,121.0 305.9,124.4 305.9,117.6" fill="#c65a3d"/><rect x="316.0" y="104.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="440.0" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">求一个平均值</text><line x1="568.0" y1="121.0" x2="582.0" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="582.0,121.0 575.9,124.4 575.9,117.6" fill="#c65a3d"/><rect x="586.0" y="104.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="710.0" y="125.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">第几秒响的，没了</text><text x="46.0" y="162.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">有数值可以比，但时间位置被抹掉了</text><rect x="30.0" y="200.0" width="820.0" height="118.0" rx="10" fill="#fdf6e6" stroke="#a5761a" stroke-width="1.6"/><text x="46.0" y="226.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="start">逐个数字看</text><rect x="46.0" y="240.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="170.0" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">十几万个数字</text><line x1="298.0" y1="257.0" x2="312.0" y2="257.0" stroke="#a5761a" stroke-width="1.8" stroke-linecap="round"/><polygon points="312.0,257.0 305.9,260.4 305.9,253.6" fill="#a5761a"/><rect x="316.0" y="240.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="440.0" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">十几万个判断</text><line x1="568.0" y1="257.0" x2="582.0" y2="257.0" stroke="#a5761a" stroke-width="1.8" stroke-linecap="round"/><polygon points="582.0,257.0 575.9,260.4 575.9,253.6" fill="#a5761a"/><rect x="586.0" y="240.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#a5761a" stroke-width="2"/><text x="710.0" y="261.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="middle">每个数都没有上下文</text><text x="46.0" y="298.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">时间位置全在，但一个瞬间说明不了任何事</text><rect x="30.0" y="336.0" width="820.0" height="118.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="46.0" y="362.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">分帧</text><rect x="46.0" y="376.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="170.0" y="397.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">切成几百个小段</text><line x1="298.0" y1="393.0" x2="312.0" y2="393.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="312.0,393.0 305.9,396.4 305.9,389.6" fill="#3b8f68"/><rect x="316.0" y="376.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="440.0" y="397.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">每段算一个数</text><line x1="568.0" y1="393.0" x2="582.0" y2="393.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="582.0,393.0 575.9,396.4 575.9,389.6" fill="#3b8f68"/><rect x="586.0" y="376.0" width="248.0" height="34.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="710.0" y="397.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">一条带时间的曲线</text><text x="46.0" y="434.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">既有能比较的数值，又保住了「第几秒」</text>
</svg>
