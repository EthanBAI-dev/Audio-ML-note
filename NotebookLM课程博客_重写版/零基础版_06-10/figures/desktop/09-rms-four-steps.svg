<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216" width="880" height="216" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="均方根的四步计算，从四个数得到 0.7906">
<rect width="880" height="216" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">四个数直接求平均等于 0，平方之后才不会互相抵消</text><rect x="30.0" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#5b6673" stroke-width="1.6"/><text x="121.3" y="96.0" font-size="17" font-weight="700" fill="#5b6673" text-anchor="middle">原始四个数</text><text x="121.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="121.3" dy="0">1  -1  0.5  -0.5</tspan><tspan x="121.3" dy="19">直接求平均 = 0</tspan></text><line x1="217.5" y1="112.0" x2="237.5" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="237.5,112.0 231.4,115.4 231.4,108.6" fill="#5b6673"/><rect x="242.5" y="66.0" width="182.5" height="92.0" rx="9" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.6"/><text x="333.8" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">每个数平方</text><text x="333.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="333.8" dy="0">1  1  0.25  0.25</tspan><tspan x="333.8" dy="19">负号没有了</tspan></text><line x1="430.0" y1="112.0" x2="450.0" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="450.0,112.0 443.9,115.4 443.9,108.6" fill="#5b6673"/><rect x="455.0" y="66.0" width="182.5" height="92.0" rx="9" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="546.3" y="96.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="middle">求平均</text><text x="546.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="546.3" dy="0">0.625</tspan><tspan x="546.3" dy="19">这一步叫「均方」</tspan></text><line x1="642.5" y1="112.0" x2="662.5" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="662.5,112.0 656.4,115.4 656.4,108.6" fill="#5b6673"/><rect x="667.5" y="66.0" width="182.5" height="92.0" rx="9" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="758.8" y="96.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="middle">再开平方</text><text x="758.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="758.8" dy="0">0.7906</tspan><tspan x="758.8" dy="19">量级回到和原数一样</tspan></text><text x="30.0" y="194.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">名字就是倒着念这三步：根 · 均 · 方</text>
</svg>
