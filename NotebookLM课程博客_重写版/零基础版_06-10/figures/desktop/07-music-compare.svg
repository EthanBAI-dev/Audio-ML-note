="850.0" y="244.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="end">摇滚 / 古典 2.18×</text><text x="30.0" y="376.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">统一电平这一步只是把整段乘一个数。AE 和 RMS 跟着一起变，摇滚对古典的倍数从 1.78 和 1.49</tspan><tspan x="30.0" dy="21">掉到 1.18 和 0.99——原来那点差别几乎全是「谁录得响」。ZCR 数的是穿过中线的次数，</tspan><tspan x="30.0" dy="21">整段乘一个正数一次也不会多、不会少，所以 2.18 倍纹丝不动。这一条才是风格本身的差别。</tspan></text>
