<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="880" height="274" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="三段音乐在振幅包络、均方根和过零率上的对比">
<rect width="880" height="274" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">三段音乐各 10 秒，三种特征只有一种真的分得开</text><text x="30.0" y="72.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">AE 平均</text><line x1="30.0" y1="176.0" x2="292.7" y2="176.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="53.8" y="133.0" width="40.0" height="43.0" rx="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="73.8" y="127.0" font-size="13.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.1631</text><text x="73.8" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="141.3" y="117.1" width="40.0" height="58.9" rx="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="161.3" y="111.1" font-size="13.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.2234</text><text x="161.3" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="228.9" y="99.2" width="40.0" height="76.8" rx="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="248.9" y="93.2" font-size="13.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.2911</text><text x="248.9" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="308.7" y="72.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">RMS 平均</text><line x1="308.7" y1="176.0" x2="571.3" y2="176.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="332.4" y="124.5" width="40.0" height="51.5" rx="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="352.4" y="118.5" font-size="13.5" font-weight="700" fill="#3b8f68" text-anchor="middle">0.0587</text><text x="352.4" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="420.0" y="109.0" width="40.0" height="67.0" rx="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="440.0" y="103.0" font-size="13.5" font-weight="700" fill="#3b8f68" text-anchor="middle">0.0764</text><text x="440.0" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="507.6" y="99.2" width="40.0" height="76.8" rx="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="527.6" y="93.2" font-size="13.5" font-weight="700" fill="#3b8f68" text-anchor="middle">0.0876</text><text x="527.6" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="587.3" y="72.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="start">ZCR 平均</text><line x1="587.3" y1="176.0" x2="850.0" y2="176.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="611.1" y="140.7" width="40.0" height="35.3" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="631.1" y="134.7" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.0612</text><text x="631.1" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="698.7" y="139.5" width="40.0" height="36.5" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="718.7" y="133.5" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.0633</text><text x="718.7" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="786.2" y="99.2" width="40.0" height="76.8" rx="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="806.2" y="93.2" font-size="13.5" font-weight="700" fill="#a5761a" text-anchor="middle">0.1332</text><text x="806.2" y="194.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="30.0" y="226.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">AE 和 RMS 上三段挨得很近——它们量的是「录得多响」，而三段录音本来就被统一过电平。</tspan><tspan x="30.0" dy="21">ZCR 上摇滚是古典的 2.2 倍：失真吉他和镲片让波形穿过中线的次数明显更多。这一条才有用。</tspan></text>
</svg>
