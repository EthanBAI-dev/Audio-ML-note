<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 383" width="880" height="383" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="一个采样点远短于人耳的时间分辨率，常用帧长落在 256 到 8192">
<rect width="880" height="383" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">一个采样点太短了，短到人耳根本分不出</text><rect x="30.0" y="80.0" width="534.5" height="26.0" rx="4" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.2"/><text x="38.0" y="98.0" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="start">人耳分不出这么短</text><line x1="564.5" y1="72.0" x2="564.5" y2="230.0" stroke="#c65a3d" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round"/><text x="570.5" y="68.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">人耳约 10 ms</text><circle cx="93.4" cy="122.0" r="4" fill="#5b6673" stroke="none" stroke-width="1"/><text x="103.4" y="126.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">1 个采样点 = 0.0227 ms</text><circle cx="522.4" cy="148.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="532.4" y="152.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">256 个样本 = 5.8 ms</text><circle cx="576.0" cy="170.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="586.0" y="174.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">512 个样本 = 11.6 ms</text><circle cx="629.7" cy="192.0" r="5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="639.7" y="196.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">1024 个样本 = 23.2 ms</text><circle cx="683.3" cy="214.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="693.3" y="218.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">2048 个样本 = 46.4 ms</text><circle cx="737.0" cy="236.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="747.0" y="240.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">4096 个样本 = 92.9 ms</text><circle cx="790.7" cy="258.0" r="3.5" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="800.7" y="262.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">8192 个样本 = 185.8 ms</text><line x1="30.0" y1="280.0" x2="30.0" y2="285.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="30.0" y="299.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">0.01 ms</text><line x1="208.2" y1="280.0" x2="208.2" y2="285.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="208.2" y="299.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">0.1 ms</text><line x1="386.4" y1="280.0" x2="386.4" y2="285.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="386.4" y="299.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">1 ms</text><line x1="564.5" y1="280.0" x2="564.5" y2="285.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="564.5" y="299.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">10 ms</text><line x1="742.7" y1="280.0" x2="742.7" y2="285.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="742.7" y="299.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">100 ms</text><text x="30.0" y="312.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">横轴每格是十倍。一个采样点 0.0227 ms，比人耳能分辨的 10 ms 短了四百多倍——</tspan><tspan x="30.0" dy="21">所以一帧必须包含成百上千个采样点，才对应一段「听得出名堂」的声音。</tspan><tspan x="30.0" dy="21">帧长取 2 的幂是因为快速傅里叶变换在这种长度下最快；常用范围 256 到 8192。</tspan></text>
</svg>
