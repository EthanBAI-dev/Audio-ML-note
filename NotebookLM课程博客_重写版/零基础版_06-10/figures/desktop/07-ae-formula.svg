<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 375" width="880" height="375" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="振幅包络公式逐项拆解，以及取不取绝对值的差别">
<rect width="880" height="375" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">公式里每个符号是什么，以及为什么必须补上绝对值</text><rect x="30.0" y="76.0" width="820.0" height="118.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="68.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">这一帧的 8 个数</text><line x1="30.0" y1="135.0" x2="850.0" y2="135.0" stroke="#d7dfe6" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="56.0" y1="135.0" x2="56.0" y2="118.1" stroke="#9fc4dd" stroke-width="2" stroke-linecap="round"/><circle cx="56.0" cy="118.1" r="3.4" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="56.0" y="108.1" font-size="12.5" font-weight="400" fill="#9fc4dd" text-anchor="middle">0.3</text><line x1="165.7" y1="135.0" x2="165.7" y2="95.7" stroke="#0878b9" stroke-width="3.2" stroke-linecap="round"/><circle cx="165.7" cy="95.7" r="5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="165.7" y="85.7" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.7</text><line x1="275.4" y1="135.0" x2="275.4" y2="146.2" stroke="#c9a9a0" stroke-width="2" stroke-linecap="round"/><circle cx="275.4" cy="146.2" r="3.4" fill="#c9a9a0" stroke="none" stroke-width="1"/><text x="275.4" y="163.2" font-size="12.5" font-weight="400" fill="#c9a9a0" text-anchor="middle">-0.2</text><line x1="385.1" y1="135.0" x2="385.1" y2="185.6" stroke="#c65a3d" stroke-width="3.2" stroke-linecap="round"/><circle cx="385.1" cy="185.6" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="385.1" y="202.6" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">-0.9</text><line x1="494.9" y1="135.0" x2="494.9" y2="112.5" stroke="#9fc4dd" stroke-width="2" stroke-linecap="round"/><circle cx="494.9" cy="112.5" r="3.4" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="494.9" y="102.5" font-size="12.5" font-weight="400" fill="#9fc4dd" text-anchor="middle">0.4</text><line x1="604.6" y1="135.0" x2="604.6" y2="129.4" stroke="#9fc4dd" stroke-width="2" stroke-linecap="round"/><circle cx="604.6" cy="129.4" r="3.4" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="604.6" y="119.4" font-size="12.5" font-weight="400" fill="#9fc4dd" text-anchor="middle">0.1</text><line x1="714.3" y1="135.0" x2="714.3" y2="163.1" stroke="#c9a9a0" stroke-width="2" stroke-linecap="round"/><circle cx="714.3" cy="163.1" r="3.4" fill="#c9a9a0" stroke="none" stroke-width="1"/><text x="714.3" y="180.1" font-size="12.5" font-weight="400" fill="#c9a9a0" text-anchor="middle">-0.5</text><line x1="824.0" y1="135.0" x2="824.0" y2="101.3" stroke="#9fc4dd" stroke-width="2" stroke-linecap="round"/><circle cx="824.0" cy="101.3" r="3.4" fill="#9fc4dd" stroke="none" stroke-width="1"/><text x="824.0" y="91.3" font-size="12.5" font-weight="400" fill="#9fc4dd" text-anchor="middle">0.6</text><rect x="30.0" y="216.0" width="402.0" height="66.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="42.0" y="240.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">照公式直接取最大</text><text x="420.0" y="243.0" font-size="22" font-weight="700" fill="#0878b9" text-anchor="end">0.7</text><text x="42.0" y="264.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">漏掉 −0.9，它在负方向上离中线更远</text><rect x="448.0" y="216.0" width="402.0" height="66.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="460.0" y="240.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">先取绝对值再取最大</text><text x="838.0" y="243.0" font-size="22" font-weight="700" fill="#c65a3d" text-anchor="end">0.9</text><text x="460.0" y="264.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">离中线的距离才是这一帧真正的峰</text><text x="30.0" y="304.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">两个答案差 0.2，占真正峰高的 22%——而且程序不会报错。</tspan><tspan x="30.0" dy="21">「振幅」指的是离零有多远，所以取最大振幅时不能保留正负号。</tspan><tspan x="30.0" dy="21">所以公式的意思没错，只是写成代码时必须补上 abs，否则一帧里最深的谷永远看不见。</tspan></text>
</svg>
