<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216" width="880" height="216" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="分帧、加窗、逐帧计算、聚合四步流程">
<rect width="880" height="216" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">分帧之后，还要走三步</text><rect x="30.0" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="121.3" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">① 分帧</text><text x="121.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="121.3" dy="0">切成 N 个小段</tspan><tspan x="121.3" dy="19">可以重叠</tspan></text><line x1="217.5" y1="112.0" x2="237.5" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="237.5,112.0 231.4,115.4 231.4,108.6" fill="#5b6673"/><rect x="242.5" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.6"/><text x="333.8" y="96.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="middle">② 加窗</text><text x="333.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="333.8" dy="0">把每段两端压低</tspan><tspan x="333.8" dy="19">（只在算频率时要）</tspan></text><line x1="430.0" y1="112.0" x2="450.0" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="450.0,112.0 443.9,115.4 443.9,108.6" fill="#5b6673"/><rect x="455.0" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="546.3" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">③ 逐帧计算</text><text x="546.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="546.3" dy="0">每段算出</tspan><tspan x="546.3" dy="19">一个数或一列数</tspan></text><line x1="642.5" y1="112.0" x2="662.5" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="662.5,112.0 656.4,115.4 656.4,108.6" fill="#5b6673"/><rect x="667.5" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="758.8" y="96.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="middle">④ 聚合</text><text x="758.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="758.8" dy="0">压成几个统计量</tspan><tspan x="758.8" dy="19">（要不要扔掉时间）</tspan></text><text x="30.0" y="194.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">②和④都是可选的；④一旦做了，「第几秒」就再也找不回来。</text>
</svg>
