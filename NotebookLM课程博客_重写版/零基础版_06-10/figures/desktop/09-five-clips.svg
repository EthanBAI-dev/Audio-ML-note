<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 309" width="880" height="309" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="五段素材的均方根与过零率对比">
<rect width="880" height="309" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">五段素材各两个数，语音和噪声那一对分不开</text><text x="30.0" y="74.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="start">RMS 平均</text><line x1="30.0" y1="190.0" x2="430.0" y2="190.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="59.0" y="100.0" width="22.0" height="90.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="70.0" y="95.0" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">0.2400</text><text x="70.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="139.0" y="139.3" width="22.0" height="50.7" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="150.0" y="134.3" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">0.1353</text><text x="150.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="219.0" y="142.5" width="22.0" height="47.5" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="230.0" y="137.5" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">0.1266</text><text x="230.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><rect x="299.0" y="134.4" width="22.0" height="55.6" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="310.0" y="129.4" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">0.1483</text><text x="310.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">语音</text><rect x="379.0" y="129.8" width="22.0" height="60.2" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="390.0" y="124.8" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">0.1605</text><text x="390.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">噪声</text><text x="450.0" y="74.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="start">ZCR 平均</text><line x1="450.0" y1="190.0" x2="850.0" y2="190.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="479.0" y="143.2" width="22.0" height="46.8" rx="2" fill="#a5761a" stroke="none" stroke-width="1"/><text x="490.0" y="138.2" font-size="12.5" font-weight="400" fill="#a5761a" text-anchor="middle">0.0655</text><text x="490.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="559.0" y="164.6" width="22.0" height="25.4" rx="2" fill="#a5761a" stroke="none" stroke-width="1"/><text x="570.0" y="159.6" font-size="12.5" font-weight="400" fill="#a5761a" text-anchor="middle">0.0356</text><text x="570.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="639.0" y="100.0" width="22.0" height="90.0" rx="2" fill="#a5761a" stroke="none" stroke-width="1"/><text x="650.0" y="95.0" font-size="12.5" font-weight="400" fill="#a5761a" text-anchor="middle">0.1260</text><text x="650.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><rect x="719.0" y="124.2" width="22.0" height="65.8" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="730.0" y="119.2" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">0.0922</text><text x="730.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">语音</text><rect x="799.0" y="108.5" width="22.0" height="81.5" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="810.0" y="103.5" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">0.1141</text><text x="810.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">噪声</text><text x="30.0" y="238.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">橙色那两根是语音和噪声。只比较整段平均过零率时，它们其实分不开：</tspan><tspan x="30.0" dy="21">语音 0.0922、噪声 0.1141，只差两成。倒是古典 0.0655 和摇滚 0.1260 差了近一倍。</tspan><tspan x="30.0" dy="21">真正的清浊音判断是在一句话内部逐帧比元音和摩擦音，不是拿两整段比平均值。</tspan></text>
</svg>
