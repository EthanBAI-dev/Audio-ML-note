<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 244" width="880" height="244" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="尾帧不足时丢弃、保留和补零三种策略">
<rect width="880" height="244" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">录音结尾不够一整帧时，必须明确采用哪一种规则</text><text x="30" y="79" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">丢弃尾帧</text><rect x="40" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="92.17391304347827" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="144.34782608695653" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="196.5217391304348" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><path d="M248.69565217391306 100 l28.695652173913047 42 M277.3913043478261 100 l-28.695652173913047 42" fill="none" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="174" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">长度整齐</text><text x="40" y="203" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">最后一点声音可能消失</text><text x="310" y="79" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">保留短尾帧</text><rect x="320" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="372.17391304347825" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="424.3478260869565" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="476.5217391304348" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="528.695652173913" y="100" width="28.695652173913047" height="42" rx="2" fill="#edf7f2" stroke="#1baf7a" stroke-width="1.4"/><text x="320" y="174" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">不丢声音</text><text x="320" y="203" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">最后一帧样本数不同</text><text x="590" y="79" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">补零到整帧</text><rect x="600" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="652.1739130434783" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="704.3478260869565" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="756.5217391304348" y="100" width="48.173913043478265" height="42" rx="2" fill="#d9ecf8" stroke="#2a78d6" stroke-width="1"/><rect x="808.695652173913" y="100" width="28.695652173913047" height="42" rx="2" fill="#edf7f2" stroke="#1baf7a" stroke-width="1.4"/><rect x="837.3913043478261" y="100" width="23.47826086956522" height="42" rx="2" fill="#fff" stroke="#6f7b89" stroke-width="1"/><text x="600" y="174" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="start">形状整齐</text><text x="600" y="203" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start">补入的零会改变统计量</text>
</svg>
