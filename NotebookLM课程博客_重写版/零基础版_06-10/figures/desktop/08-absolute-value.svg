"28" rx="2" fill="#2a78d6" stroke="none" stroke-width="1"/><text x="760.5" y="195" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="middle">0.4</text><line x1="462.0" y1="171.0" x2="838.0" y2="171.0" stroke="#0b0b0b" stroke-width="1.2" stroke-linecap="round"/><text x="462" y="239" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start">结果：0.9（正确）</text>
