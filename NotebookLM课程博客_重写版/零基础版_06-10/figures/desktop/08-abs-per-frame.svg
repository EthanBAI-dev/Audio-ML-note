<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 301" width="880" height="301" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="整段最大值看不出取绝对值的差别，逐帧才看得见">
<rect width="880" height="301" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">整段最大值几乎没差别，逐帧却有两三成的帧被低估</text><text x="30.0" y="74.0" font-size="17" font-weight="700" fill="#5b6673" text-anchor="start">整段的最大值</text><line x1="30.0" y1="190.0" x2="430.0" y2="190.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="40.0" y="115.8" width="18.0" height="74.2" rx="2" fill="#9fc4dd" stroke="none" stroke-width="1"/><rect x="62.0" y="115.2" width="18.0" height="74.8" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="96.7" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="173.3" y="122.6" width="18.0" height="67.4" rx="2" fill="#9fc4dd" stroke="none" stroke-width="1"/><rect x="195.3" y="122.6" width="18.0" height="67.4" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="230.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="306.7" y="98.5" width="18.0" height="91.5" rx="2" fill="#9fc4dd" stroke="none" stroke-width="1"/><rect x="328.7" y="98.5" width="18.0" height="91.5" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="363.3" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="450.0" y="74.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">逐帧：有多少帧被低估</text><line x1="450.0" y1="190.0" x2="850.0" y2="190.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="500.7" y="NaN" width="32.0" height="NaN" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="516.7" y="NaN" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">NaN%</text><text x="516.7" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">古典</text><rect x="634.0" y="NaN" width="32.0" height="NaN" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="650.0" y="NaN" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">NaN%</text><text x="650.0" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">爵士</text><rect x="767.3" y="NaN" width="32.0" height="NaN" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="783.3" y="NaN" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">NaN%</text><text x="783.3" y="207.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">摇滚</text><text x="30.0" y="230.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">左边两根柱几乎一样高——一首 30 秒的曲子里最高的正峰和最深的负谷本来就差不多深，</tspan><tspan x="30.0" dy="21">整段最大值把问题掩盖了。右边是逐帧看：18% 到 36% 的帧被低估，最多一帧少算 0.2952。</tspan><tspan x="30.0" dy="21">而包络用的正是逐帧的结果，所以 abs 不能省。</tspan></text>
</svg>
