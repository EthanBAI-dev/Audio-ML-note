<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 256" width="880" height="256" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="录音结尾不足一帧时的三种处理规则">
<rect width="880" height="256" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">最后不够一帧的那一小截，你打算怎么办</text><rect x="30.0" y="72.0" width="818.7" height="26.0" rx="4" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.4"/><rect x="848.7" y="72.0" width="1.3" height="26.0" rx="4" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.4"/><text x="40.0" y="90.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">128 个完整帧，用掉 66048 个样本</text><text x="842.0" y="116.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">剩 102 个 = 4.63 ms</text><rect x="30.0" y="132.0" width="264.0" height="82.0" rx="8" fill="#f5f8fa" stroke="#5b6673" stroke-width="1.4"/><text x="42.0" y="154.0" font-size="17" font-weight="700" fill="#5b6673" text-anchor="start">丢掉</text><text x="42.0" y="176.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="42.0" dy="0">每段输出形状整齐；最末</tspan><tspan x="42.0" dy="17">尾那点声音消失</tspan></text><rect x="308.0" y="132.0" width="264.0" height="82.0" rx="8" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.4"/><text x="320.0" y="154.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="start">保留短帧</text><text x="320.0" y="176.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="320.0" dy="0">不丢声音；最后一个数用</tspan><tspan x="320.0" dy="17">的样本数和别的不同</tspan></text><rect x="586.0" y="132.0" width="264.0" height="82.0" rx="8" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.4"/><text x="598.0" y="154.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">补零到整帧</text><text x="598.0" y="176.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="598.0" dy="0">长度一致；峰值不受影响</tspan><tspan x="598.0" dy="17">，但 RMS 会被零拉低</tspan></text><text x="30.0" y="240.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">三种都对。错的是训练时用一种、上线时用另一种。</text>
</svg>
