<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 298" width="880" height="298" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="直接取最大值会漏掉负方向上的峰">
<rect width="880" height="298" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">先取绝对值，还是直接取最大值</text><rect x="30.0" y="72.0" width="820.0" height="96.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="30.0" y1="120.0" x2="850.0" y2="120.0" stroke="#d7dfe6" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="132.5" y1="120.0" x2="132.5" y2="129.1" stroke="#c65a3d" stroke-width="3" stroke-linecap="round"/><circle cx="132.5" cy="129.1" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="132.5" y="147.1" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">-0.2</text><line x1="337.5" y1="120.0" x2="337.5" y2="88.0" stroke="#0878b9" stroke-width="3" stroke-linecap="round"/><circle cx="337.5" cy="88.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="337.5" y="78.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.7</text><line x1="542.5" y1="120.0" x2="542.5" y2="161.1" stroke="#c65a3d" stroke-width="3" stroke-linecap="round"/><circle cx="542.5" cy="161.1" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="542.5" y="179.1" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">-0.9</text><line x1="747.5" y1="120.0" x2="747.5" y2="101.7" stroke="#0878b9" stroke-width="3" stroke-linecap="round"/><circle cx="747.5" cy="101.7" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="747.5" y="91.7" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">0.4</text><rect x="30.0" y="184.0" width="400.0" height="72.0" rx="9" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="44.0" y="208.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">直接 max(frame)</text><text x="416.0" y="210.0" font-size="20" font-weight="700" fill="#c65a3d" text-anchor="end">0.7</text><text x="44.0" y="234.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">漏掉 −0.9，它在负方向上更远</text><rect x="450.0" y="184.0" width="400.0" height="72.0" rx="9" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="464.0" y="208.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">先 abs 再 max</text><text x="836.0" y="210.0" font-size="20" font-weight="700" fill="#3b8f68" text-anchor="end">0.9</text><text x="464.0" y="234.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">离中线多远才是真正的峰高</text><text x="30.0" y="282.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">两个答案差 0.2，占真实峰高的 22%——而且程序不会报错。</text>
</svg>
