<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 597" width="420" height="597" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="melspectrogram 等于 stft、取模平方、乘滤波器组这三步">
<rect width="420" height="597" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">melspectrogram 不是黑盒，</tspan><tspan x="20.0" dy="25">它就是三步串起来</tspan></text><rect x="20.0" y="99.0" width="380.0" height="80.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="32.0" y="123.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">① stft</text><text x="32.0" y="149.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">复数矩阵</text><text x="32.0" y="169.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">第 16 课</text><line x1="210.0" y1="183.0" x2="210.0" y2="200.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="210.0,200.0 206.6,193.9 213.4,193.9" fill="#5b6673"/><rect x="20.0" y="203.0" width="380.0" height="80.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="32.0" y="227.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">② abs() ** 2</text><text x="32.0" y="253.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">1025 × 342</text><text x="32.0" y="273.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">功率矩阵</text><line x1="210.0" y1="287.0" x2="210.0" y2="304.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="210.0,304.0 206.6,297.9 213.4,297.9" fill="#5b6673"/><rect x="20.0" y="307.0" width="380.0" height="80.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="32.0" y="331.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">③ 滤波器组 @ 它</text><text x="32.0" y="357.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">10 × 342</text><text x="32.0" y="377.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">梅尔声谱图</text><rect x="20.0" y="409.0" width="380.0" height="82.0" rx="10" fill="#eef7f1" stroke="#3b8f68" stroke-width="1.5"/><text x="34.0" y="433.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">自己走这三步，和一行调用的结果对比</text><text x="34.0" y="459.0" font-size="18" font-weight="700" fill="#3b8f68" text-anchor="start">最大差 0e+0</text><text x="386.0" y="459.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">一个数都不差</text><text x="20.0" y="505.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">所以那个函数同时要 STFT 的参数（n_fft、</tspan><tspan x="20.0" dy="21">hop_length）和梅尔的参数（n_mels）：它内部</tspan><tspan x="20.0" dy="21">做的正是这三步。出了问题能自己拆开查，</tspan><tspan x="20.0" dy="21">不用换个参数碰运气。</tspan></text>
</svg>
