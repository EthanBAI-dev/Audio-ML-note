<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 311" width="420" height="311" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="真实语音的十三维 MFCC">
