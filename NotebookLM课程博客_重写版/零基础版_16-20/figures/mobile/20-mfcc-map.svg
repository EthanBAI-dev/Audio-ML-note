<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">MFCC 是一张“系数 × 时间”的表，</tspan><tspan x="22" dy="25">每一列描述一个短时间片段</tspan></text><rect x="22" y="81" width="376" height="210" rx="8" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><image href="data:image/png;base64," x="26" y="85" width="368" height="180" preserveAspectRatio="none"/><text x="30" y="284" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">纵向 13 个系数；横向按时间排列</text>
