<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="逐个改默认值时，自己算的 MFCC 与库的最大差">
<rect width="420" height="414" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">要改对四个默认值，</tspan><tspan x="20.0" dy="25">才能自己复现那一行</tspan></text><text x="20.0" y="124.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">起点：40 带 + 第 18 课那三个</text><line x1="168.0" y1="102.0" x2="168.0" y2="138.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="168.0" y="113.0" width="149.1" height="14.0" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="325.1" y="124.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">344.2</text><text x="20.0" y="166.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">htk → False</text><line x1="168.0" y1="144.0" x2="168.0" y2="180.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="168.0" y="155.0" width="148.4" height="14.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="324.4" y="166.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">342.7</text><text x="20.0" y="208.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">norm → 'slaney'</text><line x1="168.0" y1="186.0" x2="168.0" y2="222.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="168.0" y="197.0" width="88.9" height="14.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="264.9" y="208.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">205.2</text><text x="20.0" y="250.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">fmax → 默认</text><line x1="168.0" y1="228.0" x2="168.0" y2="264.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="168.0" y="239.0" width="83.5" height="14.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="259.5" y="250.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">192.8</text><text x="20.0" y="292.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">梅尔带 40 → 128</text><line x1="168.0" y1="270.0" x2="168.0" y2="306.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="168.0" y="281.0" width="0.0" height="14.0" rx="2" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="176.0" y="292.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">0.0000　逐位相同</text><line x1="20.0" y1="319.0" x2="400.0" y2="319.0" stroke="#d7dfe6" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><text x="20.0" y="339.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">只改梅尔带、别的不动，最大差还有 226.2。</tspan><tspan x="20.0" dy="21">四个缺一不可。梅尔带数最要命——</tspan><tspan x="20.0" dy="21">它决定喂给 DCT 的原料有几根。</tspan></text>
</svg>
