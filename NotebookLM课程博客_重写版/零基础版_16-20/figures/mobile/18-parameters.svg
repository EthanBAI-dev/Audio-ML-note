<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 935" width="420" height="935" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="对数梅尔频谱的关键参数">
<rect width="420" height="935" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">一次函数调用背后，</tspan><tspan x="22" dy="25">至少有六组会改变结果的设置</tspan></text><line x1="22.0" y1="206.0" x2="398.0" y2="206.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="22" y="108" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">采样率</text><text x="22" y="143" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="22" dy="0">可见频率上限</tspan></text><line x1="22.0" y1="349.0" x2="398.0" y2="349.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="22" y="251" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">n_fft</text><text x="22" y="286" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="22" dy="0">每帧频率格</tspan></text><line x1="22.0" y1="492.0" x2="398.0" y2="492.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="22" y="394" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">hop</text><text x="22" y="429" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="22" dy="0">时间列间隔</tspan></text><line x1="22.0" y1="635.0" x2="398.0" y2="635.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="22" y="537" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">n_mels</text><text x="22" y="572" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="22" dy="0">输出频带数</tspan></text><line x1="22.0" y1="778.0" x2="398.0" y2="778.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="22" y="680" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">fmin / fmax</text><text x="22" y="715" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="22" dy="0">实际保留范围</tspan></text><line x1="22.0" y1="921.0" x2="398.0" y2="921.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="22" y="823" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">ref / top_db</text><text x="22" y="858" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="22" dy="0">颜色与数值基准</tspan></text>
</svg>
