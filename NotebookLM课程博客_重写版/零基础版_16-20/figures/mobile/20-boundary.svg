<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 553" width="420" height="553" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="居中差分与实时因果差分的时间边界">
