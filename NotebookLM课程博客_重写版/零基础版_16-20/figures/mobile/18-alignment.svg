<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 691" width="420" height="691" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="手写滤波器组与库的结果逐步对齐，三个默认值各差在哪里">
<rect width="420" height="691" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">形状一样，数字全不一样：</tspan><tspan x="20.0" dy="25">三个默认值逐个改过来</tspan></text><rect x="20.0" y="97.0" width="380.0" height="24.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="114.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">这一步</text><text x="390.0" y="114.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="end">顶点 / 最高权重 / 最大差</text><rect x="20.0" y="125.0" width="380.0" height="62.0" rx="6" fill="#eef7f1" stroke="#3b8f68" stroke-width="1.4"/><text x="30.0" y="144.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">手写那版（第 17 课）</text><text x="30.0" y="162.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">对照基准</text><text x="390.0" y="144.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="end">17、38、64、98、139 …</text><text x="390.0" y="162.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="end">1.0000　差 —</text><rect x="20.0" y="192.0" width="380.0" height="62.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="211.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">① 库的默认值</text><text x="30.0" y="229.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">什么都没改</text><text x="390.0" y="211.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="end">28、56、84、115、158 …</text><text x="390.0" y="229.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">0.0033　差 0.9999</text><rect x="20.0" y="259.0" width="380.0" height="62.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="278.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">② 加上 fmax=8000</text><text x="30.0" y="296.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">库默认 fmax = sr/2 = 11025</text><text x="390.0" y="278.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="end">25、51、76、103、136 …</text><text x="390.0" y="296.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">0.0036　差 0.9995</text><rect x="20.0" y="326.0" width="380.0" height="62.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="345.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">③ 再加上 norm=None</text><text x="30.0" y="363.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">库默认 norm='slaney'，三角形面积归一</text><text x="390.0" y="345.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="end">25、51、76、103、136 …</text><text x="390.0" y="363.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">0.9999　差 0.5080</text><rect x="20.0" y="393.0" width="380.0" height="62.0" rx="6" fill="#eef7f1" stroke="#3b8f68" stroke-width="1.4"/><text x="30.0" y="412.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">④ 再加上 htk=True</text><text x="30.0" y="430.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">库默认 htk=False，另一条梅尔公式</text><text x="390.0" y="412.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="end">17、38、64、98、139 …</text><text x="390.0" y="430.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="end">0.9998　差 0.0147</text><text x="20.0" y="470.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="start">为什么顶点会错位：两条梅尔公式根本不是一条</text><rect x="20.0" y="482.0" width="380.0" height="22.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="498.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">频率</text><text x="217.6" y="498.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="end">HTK（第 17 课那条）</text><text x="390.0" y="498.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">Slaney（库的默认）</text><text x="30.0" y="523.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">100 Hz</text><text x="217.6" y="523.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="end">150.49 Mel</text><text x="390.0" y="523.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">1.50 Mel</text><line x1="20.0" y1="529.0" x2="400.0" y2="529.0" stroke="#d7dfe6" stroke-width="0.8" stroke-linecap="round"/><text x="30.0" y="549.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">1000 Hz</text><text x="217.6" y="549.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="end">999.99 Mel</text><text x="390.0" y="549.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">15.00 Mel</text><line x1="20.0" y1="555.0" x2="400.0" y2="555.0" stroke="#d7dfe6" stroke-width="0.8" stroke-linecap="round"/><text x="30.0" y="575.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">4000 Hz</text><text x="217.6" y="575.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="end">2146.06 Mel</text><text x="390.0" y="575.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">35.16 Mel</text><line x1="20.0" y1="581.0" x2="400.0" y2="581.0" stroke="#d7dfe6" stroke-width="0.8" stroke-linecap="round"/><text x="30.0" y="601.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">8000 Hz</text><text x="217.6" y="601.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="end">2840.02 Mel</text><text x="390.0" y="601.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">45.25 Mel</text><line x1="20.0" y1="607.0" x2="400.0" y2="607.0" stroke="#d7dfe6" stroke-width="0.8" stroke-linecap="round"/><text x="20.0" y="620.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">三处都改过来之后顶点完全一致，最大差只剩 0.0147。</tspan><tspan x="20.0" dy="21">这点残差来自第 17 课的第 ④ 步：那里把三角形的</tspan><tspan x="20.0" dy="21">角四舍五入到了最近的频率格，库用的是精确频率。</tspan></text>
</svg>
