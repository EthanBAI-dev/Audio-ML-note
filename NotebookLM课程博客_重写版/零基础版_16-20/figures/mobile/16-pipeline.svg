<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 917" width="420" height="917" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="从录音到可信声谱图的显示流程">
<rect width="420" height="917" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">声谱图不是直接“画数组”：</tspan><tspan x="22" dy="25">每一步都决定颜色代表什么</tspan></text><rect x="22" y="81" width="376" height="150" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="44" cy="105" r="12" fill="#2a78d6"/><text x="65" y="111" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">录音</text><text x="36" y="153" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="36" dy="0">随时间变化的数字</tspan></text><line x1="210.0" y1="234.0" x2="210.0" y2="246.0" stroke="#6f7b89" stroke-width="1.6" stroke-linecap="round"/><polygon points="210,246 206.76754577120963,239.791035540545 213.23245422879037,239.791035540545" fill="#6f7b89"/><rect x="22" y="249" width="376" height="150" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="44" cy="273" r="12" fill="#eb6834"/><text x="65" y="279" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">STFT</text><text x="36" y="321" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="36" dy="0">每帧的复数结果</tspan></text><line x1="210.0" y1="402.0" x2="210.0" y2="414.0" stroke="#6f7b89" stroke-width="1.6" stroke-linecap="round"/><polygon points="210,414 206.76754577120963,407.791035540545 213.23245422879037,407.791035540545" fill="#6f7b89"/><rect x="22" y="417" width="376" height="150" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="44" cy="441" r="12" fill="#1baf7a"/><text x="65" y="447" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">功率</text><text x="36" y="489" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="36" dy="0">取模后平方</tspan></text><line x1="210.0" y1="570.0" x2="210.0" y2="582.0" stroke="#6f7b89" stroke-width="1.6" stroke-linecap="round"/><polygon points="210,582 206.76754577120963,575.791035540545 213.23245422879037,575.791035540545" fill="#6f7b89"/><rect x="22" y="585" width="376" height="150" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="44" cy="609" r="12" fill="#eda100"/><text x="65" y="615" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">相对 dB</text><text x="36" y="657" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="36" dy="0">把最强处设为 0</tspan></text><line x1="210.0" y1="738.0" x2="210.0" y2="750.0" stroke="#6f7b89" stroke-width="1.6" stroke-linecap="round"/><polygon points="210,750 206.76754577120963,743.791035540545 213.23245422879037,743.791035540545" fill="#6f7b89"/><rect x="22" y="753" width="376" height="150" rx="8" fill="#fff8e5" stroke="#e3e7ea" stroke-width="1"/><circle cx="44" cy="777" r="12" fill="#2a78d6"/><text x="65" y="783" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">坐标与色标</text><text x="36" y="825" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="36" dy="0">时间、Hz、弱—强</tspan></text>
</svg>
