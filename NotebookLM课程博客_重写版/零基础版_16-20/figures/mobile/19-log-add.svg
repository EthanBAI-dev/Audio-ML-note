<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 611" width="420" height="611" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="频谱乘法取对数后变成加法">
<rect width="420" height="611" fill="#ffffff"/>
<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">取对数把乘法改写成加法，</tspan><tspan x="22" dy="25">让两类变化更容易分开描述</tspan></text><rect x="22" y="81" width="376" height="160" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="36" y="112" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">声带</text><text x="36" y="159" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">|E| = 2</text><text x="36" y="201" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start">ln 2</text><rect x="22" y="259" width="376" height="160" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="36" y="290" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">声道</text><text x="36" y="337" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">|H| = 5</text><text x="36" y="379" font-size="15" font-weight="700" fill="#eb6834" text-anchor="start">ln 5</text><rect x="22" y="437" width="376" height="160" rx="8" fill="#eef9f5" stroke="#e3e7ea" stroke-width="1"/><text x="36" y="468" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">结果</text><text x="36" y="515" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">|X| = 10</text><text x="36" y="557" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start">ln 10 = ln 2 + ln 5</text>
</svg>
