<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 854" width="420" height="854" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="梅尔带之间与 DCT 系数之间的相关系数矩阵对比">
<rect width="420" height="854" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">梅尔带互相重复，</tspan><tspan x="20.0" dy="25">DCT 把重复的部分去掉</tspan></text><text x="126.0" y="97.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">DCT 之前：40 条梅尔带</text><image href="data:image/png;base64," x="126" y="105" width="168" height="168" preserveAspectRatio="none"/><rect x="126.0" y="105.0" width="168.0" height="168.0" rx="0" fill="none" stroke="#d7dfe6" stroke-width="1"/><text x="126.0" y="293.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">任意两条的平均 |相关| 0.5549</text><text x="126.0" y="311.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">相邻两条 0.9504</text><text x="126.0" y="343.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">DCT 之后：40 个系数</text><image href="data:image/png;base64," x="126" y="351" width="168" height="168" preserveAspectRatio="none"/><rect x="126.0" y="351.0" width="168.0" height="168.0" rx="0" fill="none" stroke="#d7dfe6" stroke-width="1"/><text x="126.0" y="539.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">任意两条的平均 |相关| 0.1030</text><text x="126.0" y="557.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">相邻两条 0.1524</text><text x="20.0" y="583.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">颜色越深表示越相关；对角线永远是 1</text><rect x="20.0" y="607.0" width="380.0" height="158.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.4"/><text x="34.0" y="631.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">那么留几个系数够用</text><text x="34.0" y="655.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">前 K 个</text><text x="130.0" y="655.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">重建的均方根差</text><text x="290.0" y="655.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">解释掉原谱多少变化</text><text x="34.0" y="677.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">5</text><text x="130.0" y="677.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">3.978 dB</text><text x="290.0" y="677.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">94.2%</text><text x="34.0" y="697.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">13</text><text x="130.0" y="697.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">2.251 dB</text><text x="290.0" y="697.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">98.2%</text><text x="34.0" y="717.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">20</text><text x="130.0" y="717.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">1.421 dB</text><text x="290.0" y="717.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">99.3%</text><text x="20.0" y="779.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">相邻梅尔带 0.95 的相关不是巧合：</tspan><tspan x="20.0" dy="21">三角形本来就重叠，泛音会同时点亮好几条带。</tspan><tspan x="20.0" dy="21">去掉重复，四十个数才是四十条信息。</tspan></text>
</svg>
