<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 432" width="420" height="432" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="两对音在赫兹上间隔几乎相同，在音程和梅尔刻度上却相差很多">
<rect width="420" height="432" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">同样差两百赫兹，</tspan><tspan x="20.0" dy="25">听起来根本不是一回事</tspan></text><line x1="30.0" y1="157.0" x2="390.0" y2="157.0" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><line x1="30.0" y1="157.0" x2="30.0" y2="163.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="30.0" y="179.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0</text><line x1="120.0" y1="157.0" x2="120.0" y2="163.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="120.0" y="179.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">500</text><line x1="210.0" y1="157.0" x2="210.0" y2="163.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="210.0" y="179.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1000</text><line x1="300.0" y1="157.0" x2="300.0" y2="163.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="300.0" y="179.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1500</text><line x1="390.0" y1="157.0" x2="390.0" y2="163.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="390.0" y="179.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">2000 Hz</text><line x1="41.8" y1="127.0" x2="77.1" y2="127.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><line x1="41.8" y1="127.0" x2="41.8" y2="157.0" stroke="#0878b9" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="77.1" y1="127.0" x2="77.1" y2="157.0" stroke="#0878b9" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><text x="59.4" y="120.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">C2→C4　196 Hz</text><line x1="312.2" y1="143.0" x2="346.8" y2="143.0" stroke="#c65a3d" stroke-width="2.4" stroke-linecap="round"/><line x1="312.2" y1="143.0" x2="312.2" y2="157.0" stroke="#c65a3d" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="346.8" y1="143.0" x2="346.8" y2="157.0" stroke="#c65a3d" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><text x="329.5" y="136.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">G6→A6　192 Hz</text><rect x="20.0" y="197.0" width="380.0" height="46.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="216.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">在赫兹上差</text><text x="30.0" y="235.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">196 Hz</text><text x="146.0" y="235.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">192 Hz</text><text x="390.0" y="216.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">两对几乎一样（差 1.02 倍）</text><rect x="20.0" y="249.0" width="380.0" height="46.0" rx="6" fill="#fff7ed" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="268.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">在音程上差</text><text x="30.0" y="287.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">24 个半音</text><text x="146.0" y="287.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">2 个半音</text><text x="390.0" y="268.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">差 12 倍</text><rect x="20.0" y="301.0" width="380.0" height="46.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="320.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">在梅尔上差</text><text x="30.0" y="339.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">257 Mel</text><text x="146.0" y="339.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">92 Mel</text><text x="390.0" y="320.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">差 2.8 倍</text><text x="20.0" y="361.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">C2 到 C4 跨两个八度，G6 到 A6 只跨一个全音，</tspan><tspan x="20.0" dy="21">可它们在赫兹上几乎一样宽。赫兹量的是振动快了</tspan><tspan x="20.0" dy="21">多少，不是听起来差多远。</tspan></text>
</svg>
