<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 555" width="420" height="555" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="相同赫兹差在低频与高频的相对跨度">
