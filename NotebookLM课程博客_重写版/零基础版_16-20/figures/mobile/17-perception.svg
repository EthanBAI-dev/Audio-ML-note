<text x="22" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="22" dy="0">同样相差约 200 Hz，</tspan><tspan x="22" dy="25">低音区与高音区的相对跨度完全不同</tspan></text><text x="22" y="102" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">65 → 262 Hz</text><rect x="22" y="117" width="376" height="122" rx="8" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="50.0" y1="179.0" x2="370.0" y2="179.0" stroke="#e3e7ea" stroke-width="3" stroke-linecap="round"/><line x1="72.8" y1="161.0" x2="72.8" y2="197.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="193.7" y1="161.0" x2="193.7" y2="197.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="72.8" y1="179.0" x2="193.7" y2="179.0" stroke="#2a78d6" stroke-width="5" stroke-linecap="round"/><text x="27" y="275" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">约跨 2 个八度</text><text x="22" y="340" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">1568 → 1760 Hz</text><rect x="22" y="355" width="376" height="122" rx="8" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="50.0" y1="417.0" x2="370.0" y2="417.0" stroke="#e3e7ea" stroke-width="3" stroke-linecap="round"/><line x1="348.9" y1="399.0" x2="348.9" y2="435.0" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="358.9" y1="399.0" x2="358.9" y2="435.0" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="348.9" y1="417.0" x2="358.9" y2="417.0" stroke="#eb6834" stroke-width="5" stroke-linecap="round"/><text x="27" y="513" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">只跨约 2 个半音</text>
</svg>
