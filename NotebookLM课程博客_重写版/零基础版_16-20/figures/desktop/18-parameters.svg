<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="对数梅尔频谱的关键参数">
<rect width="880" height="340" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">一次函数调用背后，至少有六组会改变结果的设置</text><line x1="30.0" y1="181.0" x2="290.0" y2="181.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="30" y="83" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">采样率</text><text x="30" y="118" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="30" dy="0">可见频率上限</tspan></text><line x1="310.0" y1="181.0" x2="570.0" y2="181.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="310" y="83" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">n_fft</text><text x="310" y="118" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="310" dy="0">每帧频率格</tspan></text><line x1="590.0" y1="181.0" x2="850.0" y2="181.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="590" y="83" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">hop</text><text x="590" y="118" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="590" dy="0">时间列间隔</tspan></text><line x1="30.0" y1="326.0" x2="290.0" y2="326.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="30" y="228" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">n_mels</text><text x="30" y="263" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="30" dy="0">输出频带数</tspan></text><line x1="310.0" y1="326.0" x2="570.0" y2="326.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="310" y="228" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">fmin / fmax</text><text x="310" y="263" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="310" dy="0">实际保留范围</tspan></text><line x1="590.0" y1="326.0" x2="850.0" y2="326.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="590" y="228" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">ref / top_db</text><text x="590" y="263" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="590" dy="0">颜色与数值基准</tspan></text>
</svg>
