<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="两对音在赫兹上间隔几乎相同，在音程和梅尔刻度上却相差很多">
<rect width="880" height="336" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">同样差两百赫兹，听起来根本不是一回事</text><line x1="40.0" y1="130.0" x2="840.0" y2="130.0" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><line x1="40.0" y1="130.0" x2="40.0" y2="136.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="40.0" y="152.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">0</text><line x1="240.0" y1="130.0" x2="240.0" y2="136.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="240.0" y="152.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">500</text><line x1="440.0" y1="130.0" x2="440.0" y2="136.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="440.0" y="152.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">1000</text><line x1="640.0" y1="130.0" x2="640.0" y2="136.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="640.0" y="152.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">1500</text><line x1="840.0" y1="130.0" x2="840.0" y2="136.0" stroke="#5b6673" stroke-width="1" stroke-linecap="round"/><text x="840.0" y="152.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">2000 Hz</text><line x1="66.2" y1="100.0" x2="144.7" y2="100.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><line x1="66.2" y1="100.0" x2="66.2" y2="130.0" stroke="#0878b9" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="144.7" y1="100.0" x2="144.7" y2="130.0" stroke="#0878b9" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><text x="105.4" y="93.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">C2→C4　196 Hz</text><line x1="667.2" y1="116.0" x2="744.0" y2="116.0" stroke="#c65a3d" stroke-width="2.4" stroke-linecap="round"/><line x1="667.2" y1="116.0" x2="667.2" y2="130.0" stroke="#c65a3d" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="744.0" y1="116.0" x2="744.0" y2="130.0" stroke="#c65a3d" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><text x="705.6" y="109.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">G6→A6　192 Hz</text><rect x="30.0" y="170.0" width="820.0" height="30.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="190.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="start">在赫兹上差</text><text x="276.0" y="190.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">196 Hz</text><text x="415.4" y="190.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">192 Hz</text><text x="840.0" y="190.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">两对几乎一样（差 1.02 倍）</text><rect x="30.0" y="206.0" width="820.0" height="30.0" rx="6" fill="#fff7ed" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="226.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="start">在音程上差</text><text x="276.0" y="226.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">24 个半音</text><text x="415.4" y="226.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">2 个半音</text><text x="840.0" y="226.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">差 12 倍</text><rect x="30.0" y="242.0" width="820.0" height="30.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="262.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="start">在梅尔上差</text><text x="276.0" y="262.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">257 Mel</text><text x="415.4" y="262.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">92 Mel</text><text x="840.0" y="262.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">差 2.8 倍</text><text x="30.0" y="286.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">C2 到 C4 跨了两个八度，G6 到 A6 只跨一个全音，可它们在赫兹上几乎一样宽。</tspan><tspan x="30.0" dy="21">赫兹这把尺子量的是「振动快了多少」，不是「听起来差多远」。</tspan></text>
</svg>
