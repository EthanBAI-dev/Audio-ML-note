<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="频谱乘法取对数后变成加法">
<rect width="880" height="230" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">取对数把乘法改写成加法，让两类变化更容易分开描述</text><rect x="30" y="56" width="260" height="160" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="44" y="87" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">声带</text><text x="44" y="134" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">|E| = 2</text><text x="44" y="176" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="start">ln 2</text><rect x="310" y="56" width="260" height="160" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><text x="324" y="87" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">声道</text><text x="324" y="134" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">|H| = 5</text><text x="324" y="176" font-size="15" font-weight="700" fill="#eb6834" text-anchor="start">ln 5</text><rect x="590" y="56" width="260" height="160" rx="8" fill="#eef9f5" stroke="#e3e7ea" stroke-width="1"/><text x="604" y="87" font-size="17" font-weight="700" fill="#1baf7a" text-anchor="start">结果</text><text x="604" y="134" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="start">|X| = 10</text><text x="604" y="176" font-size="15" font-weight="700" fill="#1baf7a" text-anchor="start">ln 10 = ln 2 + ln 5</text>
</svg>
