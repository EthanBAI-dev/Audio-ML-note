<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="相同赫兹差在低频与高频的相对跨度">
<rect width="880" height="292" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">同样相差约 200 Hz，低音区与高音区的相对跨度完全不同</text><text x="30" y="77" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="start">65 → 262 Hz</text><rect x="30" y="92" width="400" height="122" rx="8" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="58.0" y1="154.0" x2="402.0" y2="154.0" stroke="#e3e7ea" stroke-width="3" stroke-linecap="round"/><line x1="82.5" y1="136.0" x2="82.5" y2="172.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="212.5" y1="136.0" x2="212.5" y2="172.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round"/><line x1="82.5" y1="154.0" x2="212.5" y2="154.0" stroke="#2a78d6" stroke-width="5" stroke-linecap="round"/><text x="35" y="250" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">约跨 2 个八度</text><text x="450" y="77" font-size="17" font-weight="700" fill="#eb6834" text-anchor="start">1568 → 1760 Hz</text><rect x="450" y="92" width="400" height="122" rx="8" fill="#fff" stroke="#e3e7ea" stroke-width="1"/><line x1="478.0" y1="154.0" x2="822.0" y2="154.0" stroke="#e3e7ea" stroke-width="3" stroke-linecap="round"/><line x1="799.3" y1="136.0" x2="799.3" y2="172.0" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="810.1" y1="136.0" x2="810.1" y2="172.0" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="799.3" y1="154.0" x2="810.1" y2="154.0" stroke="#eb6834" stroke-width="5" stroke-linecap="round"/><text x="455" y="250" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start">只跨约 2 个半音</text>
</svg>
