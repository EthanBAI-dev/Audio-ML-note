<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 331" width="880" height="331" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="melspectrogram 等于 stft、取模平方、乘滤波器组这三步">
<rect width="880" height="331" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">melspectrogram 不是黑盒，它就是三步串起来</text><rect x="30.0" y="78.0" width="254.7" height="80.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="42.0" y="102.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">① stft</text><text x="42.0" y="128.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">复数矩阵</text><text x="42.0" y="148.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">第 16 课</text><line x1="290.7" y1="118.0" x2="308.7" y2="118.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="308.7,118.0 302.5,121.4 302.5,114.6" fill="#5b6673"/><rect x="312.7" y="78.0" width="254.7" height="80.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="324.7" y="102.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">② abs() ** 2</text><text x="324.7" y="128.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">1025 × 342</text><text x="324.7" y="148.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">功率矩阵</text><line x1="573.3" y1="118.0" x2="591.3" y2="118.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="591.3,118.0 585.2,121.4 585.2,114.6" fill="#5b6673"/><rect x="595.3" y="78.0" width="254.7" height="80.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="607.3" y="102.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="start">③ 滤波器组 @ 它</text><text x="607.3" y="128.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">10 × 342</text><text x="607.3" y="148.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">梅尔声谱图</text><rect x="30.0" y="184.0" width="820.0" height="62.0" rx="10" fill="#eef7f1" stroke="#3b8f68" stroke-width="1.5"/><text x="44.0" y="208.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="start">自己走这三步，和一行调用的结果对比</text><text x="44.0" y="232.0" font-size="18" font-weight="700" fill="#3b8f68" text-anchor="start">最大差 0e+0</text><text x="836.0" y="232.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">一个数都不差</text><text x="30.0" y="260.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">所以那个函数同时要 STFT 的参数（n_fft、hop_length）和梅尔的参数（n_mels）——</tspan><tspan x="30.0" dy="21">它内部要做的正是这三步，缺一样都算不下去。</tspan><tspan x="30.0" dy="21">知道这一点的好处：出了问题能自己拆开一步步查，而不是换个参数碰运气。</tspan></text>
</svg>
