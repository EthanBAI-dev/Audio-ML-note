<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="从录音到可信声谱图的显示流程">
<rect width="880" height="220" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">声谱图不是直接“画数组”：每一步都决定颜色代表什么</text><rect x="30" y="56" width="148" height="150" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="52" cy="80" r="12" fill="#2a78d6"/><text x="73" y="86" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">录音</text><text x="44" y="128" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="44" dy="0">随时间变化的数字</tspan></text><line x1="181.0" y1="131.0" x2="195.0" y2="131.0" stroke="#6f7b89" stroke-width="1.6" stroke-linecap="round"/><polygon points="195,131 188.791035540545,134.23245422879037 188.791035540545,127.76754577120963" fill="#6f7b89"/><rect x="198" y="56" width="148" height="150" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="220" cy="80" r="12" fill="#eb6834"/><text x="241" y="86" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">STFT</text><text x="212" y="128" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="212" dy="0">每帧的复数结果</tspan></text><line x1="349.0" y1="131.0" x2="363.0" y2="131.0" stroke="#6f7b89" stroke-width="1.6" stroke-linecap="round"/><polygon points="363,131 356.791035540545,134.23245422879037 356.791035540545,127.76754577120963" fill="#6f7b89"/><rect x="366" y="56" width="148" height="150" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="388" cy="80" r="12" fill="#1baf7a"/><text x="409" y="86" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">功率</text><text x="380" y="128" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="380" dy="0">取模后平方</tspan></text><line x1="517.0" y1="131.0" x2="531.0" y2="131.0" stroke="#6f7b89" stroke-width="1.6" stroke-linecap="round"/><polygon points="531,131 524.791035540545,134.23245422879037 524.791035540545,127.76754577120963" fill="#6f7b89"/><rect x="534" y="56" width="148" height="150" rx="8" fill="#f7f9fb" stroke="#e3e7ea" stroke-width="1"/><circle cx="556" cy="80" r="12" fill="#eda100"/><text x="577" y="86" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">相对 dB</text><text x="548" y="128" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="548" dy="0">把最强处设为 0</tspan></text><line x1="685.0" y1="131.0" x2="699.0" y2="131.0" stroke="#6f7b89" stroke-width="1.6" stroke-linecap="round"/><polygon points="699,131 692.791035540545,134.23245422879037 692.791035540545,127.76754577120963" fill="#6f7b89"/><rect x="702" y="56" width="148" height="150" rx="8" fill="#fff8e5" stroke="#e3e7ea" stroke-width="1"/><circle cx="724" cy="80" r="12" fill="#2a78d6"/><text x="745" y="86" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">坐标与色标</text><text x="716" y="128" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="716" dy="0">时间、Hz、弱—强</tspan></text>
</svg>
