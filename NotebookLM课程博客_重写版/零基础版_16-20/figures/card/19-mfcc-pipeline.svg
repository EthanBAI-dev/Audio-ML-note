<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 777.88" width="912" height="777.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="功率谱经梅尔汇总、对数与 DCT 后保留前十三项">
<rect width="912" height="777.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">MFCC 的三步，</tspan><tspan x="40" dy="58">各自解决一件事</tspan></text><rect x="40.0" y="167.9" width="832.0" height="116.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="221.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="start">梅尔汇总</text><text x="64" y="263.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">把 513 行压成 64 行</text><rect x="40.0" y="299.9" width="832.0" height="116.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="353.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">取对数</text><text x="64" y="395.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">把相乘的关系改写成相加</text><rect x="40.0" y="431.9" width="832.0" height="116.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="485.88" font-size="38" font-weight="700" fill="#c65a3d" text-anchor="start">DCT 换坐标</text><text x="64" y="527.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">把轮廓集中到前几项</text><rect x="40.0" y="563.9" width="832.0" height="116.0" rx="14" fill="#fdf6e6" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="617.88" font-size="38" font-weight="700" fill="#a5761a" text-anchor="start">只留前 13 项</text><text x="64" y="659.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">这一步才真的丢信息</text><text x="40" y="737.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">13 是惯例，不是定理；换个任务就该重新想。</text>
</svg>
