cap="round" stroke-linejoin="round"/><path d="M511.0 457.88 L606.2 199.88 L718.8 457.88" fill="none" stroke="#0878b9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M606.2 457.88 L718.8 199.88 L852.0 457.88" fill="none" stroke="#c65a3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="60.0" y1="457.9" x2="852.0" y2="457.9" stroke="#d7dfe6" stroke-width="1.5" stroke-linecap="round"/><line x1="60.0" y1="457.9" x2="60.0" y2="466.9" stroke="#5b6673" stroke-width="1.5" stroke-linecap="round"/><text x="60" y="503.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">0</text><line x1="456.0" y1="457.9" x2="456.0" y2="466.9" stroke="#5b6673" stroke-width="1.5" stroke-linecap="round"/><text x="456" y="503.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">4000</text><line x1="852.0" y1="457.9" x2="852.0" y2="466.9" stroke="#5b6673" stroke-width="1.5" stroke-linecap="round"/><text x="852" y="503.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="middle">8000 Hz</text><text x="40" y="539.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">相邻三角互相重叠，相近的频率不会被生硬切断</text><text x="40" y="599.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">高频那几个盖得宽，所以细节留得少——这是有意的。</text>
