<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 639.88" width="912" height="639.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="低频较窄、高频较宽的梅尔三角滤波器组">
