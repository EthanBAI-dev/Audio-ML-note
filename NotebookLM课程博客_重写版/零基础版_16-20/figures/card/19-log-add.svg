<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 769.88" width="912" height="769.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="数值相乘取对数后变成相加">
<rect width="912" height="769.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">取对数，</tspan><tspan x="40" dy="58">把相乘变成相加</tspan></text><rect x="40.0" y="167.9" width="832.0" height="176.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="223.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">相乘</text><text x="64" y="295.88" font-size="46" font-weight="700" fill="#5b6673" text-anchor="start">2 × 5 = 10</text><rect x="40.0" y="367.9" width="832.0" height="176.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="423.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">取对数以后</text><text x="64" y="495.88" font-size="46" font-weight="700" fill="#0878b9" text-anchor="start">ln 10 = ln 2 + ln 5</text><text x="40" y="611.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">声带和声道本来是相乘的关系</text><text x="40" y="663.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">变成相加以后，才好把它们分开</text><text x="40" y="729.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">对数没有改变声音，改变的是这层关系的写法。</text>
</svg>
