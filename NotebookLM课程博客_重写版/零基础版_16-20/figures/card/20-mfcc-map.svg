<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 735.88" width="912" height="735.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="十三行 MFCC 系数随时间排列的矩阵">
<rect width="912" height="735.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">13 行 MFCC，</tspan><tspan x="40" dy="58">一列就是一帧</tspan></text><image href="data:image/png;base64," x="40" y="177.88" width="832" height="300" preserveAspectRatio="none"/><rect x="40.0" y="177.9" width="832.0" height="300.0" rx="0" fill="none" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="36" y="163.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">第 13 项</text><text x="36" y="519.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">第 1 项　　　　时间 →</text><text x="40" y="577.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">单独一列只说明“现在在哪里”</text><text x="40" y="629.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">连着好几列放一起，才看得出往哪儿变</text><text x="40" y="695.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">所以下一步要算的是列与列之间的差。</text>
</svg>
