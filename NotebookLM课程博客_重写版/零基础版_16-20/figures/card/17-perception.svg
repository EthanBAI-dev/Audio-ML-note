<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 709.88" width="912" height="709.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="低频与高频中相同赫兹差对应的不同相对跨度">
<rect width="912" height="709.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">同样差 100 Hz，</tspan><tspan x="40" dy="58">听起来差得可不一样</tspan></text><rect x="40.0" y="167.9" width="832.0" height="210.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="223.88" font-size="38" font-weight="700" fill="#c65a3d" text-anchor="start">100 Hz → 200 Hz</text><rect x="64.0" y="249.9" width="784.0" height="42.0" rx="8" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="64.0" y="249.9" width="784.0" height="42.0" rx="8" fill="#c65a3d" stroke="none" stroke-width="1" opacity="1"/><text x="64" y="339.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">翻了一倍，像跳了一个八度</text><rect x="40.0" y="401.9" width="832.0" height="210.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="457.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">3000 Hz → 3100 Hz</text><rect x="64.0" y="483.9" width="784.0" height="42.0" rx="8" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="64.0" y="483.9" width="47.0" height="42.0" rx="8" fill="#0878b9" stroke="none" stroke-width="1" opacity="1"/><text x="64" y="573.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">只多了三十分之一，几乎听不出</text><text x="40" y="669.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">耳朵听的是“变了几倍”，不是“差了多少赫兹”。</text>
</svg>
