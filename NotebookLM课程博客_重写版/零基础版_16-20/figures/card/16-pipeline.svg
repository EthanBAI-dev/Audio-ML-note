<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 801.88" width="912" height="801.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="从录音到可解释声谱图的五个步骤">
<rect width="912" height="801.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">画一张能读的声谱图，</tspan><tspan x="40" dy="58">中间还有四步</tspan></text><rect x="40.0" y="167.9" width="832.0" height="98.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="213.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="82" y="224.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="122" y="223.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">录音</text><text x="340" y="223.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">一串随时间变化的数字</text><rect x="40.0" y="277.9" width="832.0" height="98.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="323.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="82" y="334.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="122" y="333.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">STFT</text><text x="340" y="333.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">得到每一小段的频率结果</text><rect x="40.0" y="387.9" width="832.0" height="98.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="433.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="82" y="444.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="122" y="443.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">取功率</text><text x="340" y="443.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">把复数换成“有多强”</text><rect x="40.0" y="497.9" width="832.0" height="98.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="543.9" r="24" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="82" y="554.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="122" y="553.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">选基准</text><text x="340" y="553.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">相对分贝，最响的记作 0</text><rect x="40.0" y="607.9" width="832.0" height="98.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="653.9" r="24" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="82" y="664.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="122" y="663.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">标坐标</text><text x="340" y="663.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">不写单位，颜色就没有含义</text><text x="40" y="761.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">STFT 只是中间结果，不是可以直接看的图。</text>
</svg>
