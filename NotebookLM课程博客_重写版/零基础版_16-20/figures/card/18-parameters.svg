<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 841.88" width="912" height="841.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="会改变对数梅尔频谱结果的六组参数">
<rect width="912" height="841.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">这六项不写下来，</tspan><tspan x="40" dy="58">别人复现不出同一张图</tspan></text><rect x="40.0" y="167.9" width="832.0" height="88.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="223.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">采样率</text><text x="340" y="223.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">决定看得见的最高频率</text><rect x="40.0" y="265.9" width="832.0" height="88.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="321.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">FFT 长度</text><text x="340" y="321.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">决定频率格有多细</text><rect x="40.0" y="363.9" width="832.0" height="88.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="419.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">帧移</text><text x="340" y="419.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">决定时间列有多密</text><rect x="40.0" y="461.9" width="832.0" height="88.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="517.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">梅尔频带数</text><text x="340" y="517.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">决定输出多少行</text><rect x="40.0" y="559.9" width="832.0" height="88.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="615.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">频率上下限</text><text x="340" y="615.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">决定保留哪一段</text><rect x="40.0" y="657.9" width="832.0" height="88.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="713.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">分贝基准</text><text x="340" y="713.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">决定颜色对应什么数值</text><text x="40" y="801.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">差一项，两次提取的特征就不能放在一起用。</text>
</svg>
