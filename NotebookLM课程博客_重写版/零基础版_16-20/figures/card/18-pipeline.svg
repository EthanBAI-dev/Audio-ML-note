<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 849.88" width="912" height="849.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="录音经 STFT、梅尔汇总与相对分贝得到对数梅尔谱">
<rect width="912" height="849.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">对数梅尔谱：</tspan><tspan x="40" dy="58">四步，形状各不同</tspan></text><rect x="40.0" y="167.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="233.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">录音</text><text x="848" y="233.88" font-size="32" font-weight="700" fill="#5b6673" text-anchor="end">一列数字</text><rect x="40.0" y="295.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="361.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">STFT 取功率</text><text x="848" y="361.88" font-size="32" font-weight="700" fill="#0878b9" text-anchor="end">513 行 × T 列</text><rect x="40.0" y="423.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="489.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">梅尔汇总</text><text x="848" y="489.88" font-size="32" font-weight="700" fill="#3b8f68" text-anchor="end">64 行 × T 列</text><rect x="40.0" y="551.9" width="832.0" height="112.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="617.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">取对数</text><text x="848" y="617.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="end">还是 64 行 × T 列</text><text x="40" y="743.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">最后一步只改数值大小，不再改形状</text><text x="40" y="809.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">形状什么时候变、变成多少，自己要能随口说出来。</text>
</svg>
