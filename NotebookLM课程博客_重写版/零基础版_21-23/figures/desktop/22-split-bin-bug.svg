<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="两千赫兹分界的正确与错误频率格位置">
<rect width="880" height="352" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">2000 Hz 的正确分界是第 186 格，不是第 185 或第 234 格</text><rect x="30.0" y="82.0" width="820.0" height="246.0" rx="9" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><line x1="44.0" y1="154.0" x2="836.0" y2="154.0" stroke="#d7dfe6" stroke-width="3" stroke-linecap="round"/><line x1="147.9" y1="124.0" x2="147.9" y2="184.0" stroke="#0878b9" stroke-width="2.5" stroke-linecap="round"/><line x1="160.1" y1="124.0" x2="160.1" y2="184.0" stroke="#3b8f68" stroke-width="2.5" stroke-linecap="round"/><line x1="744.8" y1="124.0" x2="744.8" y2="184.0" stroke="#c65a3d" stroke-width="2.5" stroke-linecap="round"/><line x1="157.1" y1="127.0" x2="157.1" y2="181.0" stroke="#a5761a" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><text x="157.1" y="116.0" font-size="14" font-weight="400" fill="#a5761a" text-anchor="middle">2000 Hz</text><circle cx="48.0" cy="200.0" r="4" fill="#0878b9" stroke="none" stroke-width="1"/><text x="60.0" y="204.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">近似：第 185 格 = 1991.82 Hz</text><text x="60.0" y="223.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">还低于 2000 Hz</text><circle cx="48.0" cy="248.0" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="60.0" y="252.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">正确：第 186 格 = 2002.59 Hz</text><text x="60.0" y="271.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">第一个不低于 2000 Hz 的格</text><circle cx="48.0" cy="296.0" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="60.0" y="300.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">把时间列当频率格：第 234 格 = 2519.38 Hz</text><text x="60.0" y="319.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">分界被推高了 519.38 Hz</text>
</svg>
