<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 231" width="880" height="231" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="三种频域特征对声音变化的不同响应">
<rect width="880" height="231" fill="#ffffff"/>
<text x="30" y="31" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="30" dy="0">声音发生变化时，三个数字不会以同一种方式响应</tspan></text><line x1="30.0" y1="86.0" x2="288.7" y2="86.0" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/><text x="30" y="71" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">补入高频成分</text><text x="30" y="127" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="30" dy="0">BER ↓　质心 ↑　带宽常 ↑</tspan></text><line x1="310.7" y1="86.0" x2="569.3" y2="86.0" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/><text x="310.6666666666667" y="71" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">整体移向高频</text><text x="310.6666666666667" y="127" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="310.6666666666667" dy="0">BER ↓　质心 ↑　带宽可不变</tspan></text><line x1="591.3" y1="86.0" x2="850.0" y2="86.0" stroke="#1baf7a" stroke-width="4" stroke-linecap="round"/><text x="591.3333333333334" y="71" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">围绕中心铺得更开</text><text x="591.3333333333334" y="127" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="591.3333333333334" dy="0">BER 未必变　质心可不变　带宽 ↑</tspan></text>
</svg>
