<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216" width="880" height="216" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="从波形到逐帧频域特征的计算流程">
<rect width="880" height="216" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">一帧频谱有上千格，最后压成三个数</text><rect x="30.0" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="121.3" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">波形</text><text x="121.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="121.3" dy="0">一串样本</tspan></text><line x1="217.5" y1="112.0" x2="237.5" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="237.5,112.0 231.4,115.4 231.4,108.6" fill="#5b6673"/><rect x="242.5" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="333.8" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">分帧加窗</text><text x="333.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="333.8" dy="0">只看几十毫秒</tspan></text><line x1="430.0" y1="112.0" x2="450.0" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="450.0,112.0 443.9,115.4 443.9,108.6" fill="#5b6673"/><rect x="455.0" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="546.3" y="96.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="middle">傅里叶变换</text><text x="546.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="546.3" dy="0">得到一列频谱</tspan></text><line x1="642.5" y1="112.0" x2="662.5" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="662.5,112.0 656.4,115.4 656.4,108.6" fill="#5b6673"/><rect x="667.5" y="66.0" width="182.5" height="92.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.6"/><text x="758.8" y="96.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="middle">逐帧统计</text><text x="758.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="758.8" dy="0">BER、质心、带宽</tspan></text><text x="30.0" y="194.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">每一帧得到三个数；沿时间排起来，就是三条特征轨迹。</text>
</svg>
