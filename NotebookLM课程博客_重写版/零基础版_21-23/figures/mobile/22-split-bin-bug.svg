<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 373" width="420" height="373" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="两千赫兹分界的正确与错误频率格位置">
<rect width="420" height="373" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">2000 Hz 的正确分界是第 186 格，</tspan><tspan x="20.0" dy="25">不是第 185 或第 234 格</tspan></text><rect x="20.0" y="103.0" width="380.0" height="246.0" rx="9" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><line x1="34.0" y1="175.0" x2="386.0" y2="175.0" stroke="#d7dfe6" stroke-width="3" stroke-linecap="round"/><line x1="80.2" y1="145.0" x2="80.2" y2="205.0" stroke="#0878b9" stroke-width="2.5" stroke-linecap="round"/><line x1="85.6" y1="145.0" x2="85.6" y2="205.0" stroke="#3b8f68" stroke-width="2.5" stroke-linecap="round"/><line x1="345.5" y1="145.0" x2="345.5" y2="205.0" stroke="#c65a3d" stroke-width="2.5" stroke-linecap="round"/><line x1="84.3" y1="148.0" x2="84.3" y2="202.0" stroke="#a5761a" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><text x="84.3" y="137.0" font-size="14" font-weight="400" fill="#a5761a" text-anchor="middle">2000 Hz</text><circle cx="38.0" cy="221.0" r="4" fill="#0878b9" stroke="none" stroke-width="1"/><text x="50.0" y="225.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">近似：第 185 格 = 1991.82 Hz</text><text x="50.0" y="244.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">还低于 2000 Hz</text><circle cx="38.0" cy="269.0" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="50.0" y="273.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">正确：第 186 格 = 2002.59 Hz</text><text x="50.0" y="292.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">第一个不低于 2000 Hz 的格</text><circle cx="38.0" cy="317.0" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="50.0" y="321.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">把时间列当频率格：第 234 格 = 2519.38 Hz</text><text x="50.0" y="340.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">分界被推高了 519.38 Hz</text>
</svg>
