<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 632" width="420" height="632" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="三种频域特征对声音变化的不同响应">
<rect width="420" height="632" fill="#ffffff"/>
<text x="20" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="20" dy="0">声音发生变化时，</tspan><tspan x="20" dy="27">三个数字不会以同一种方式响应</tspan></text><line x1="20.0" y1="113.0" x2="400.0" y2="113.0" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/><text x="20" y="98" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">补入高频成分</text><text x="20" y="154" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="20" dy="0">BER ↓</tspan><tspan x="20" dy="25">质心 ↑</tspan><tspan x="20" dy="25">带宽常 ↑</tspan></text><line x1="20.0" y1="296.0" x2="400.0" y2="296.0" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/><text x="20" y="281" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">整体移向高频</text><text x="20" y="337" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="20" dy="0">BER ↓</tspan><tspan x="20" dy="25">质心 ↑</tspan><tspan x="20" dy="25">带宽可不变</tspan></text><line x1="20.0" y1="479.0" x2="400.0" y2="479.0" stroke="#1baf7a" stroke-width="4" stroke-linecap="round"/><text x="20" y="464" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">围绕中心铺得更开</text><text x="20" y="520" font-size="15" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="20" dy="0">BER 未必变</tspan><tspan x="20" dy="25">质心可不变</tspan><tspan x="20" dy="25">带宽 ↑</tspan></text>
</svg>
