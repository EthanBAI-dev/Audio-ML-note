<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 527" width="420" height="527" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="平均绝对距离与均方根距离两种频谱带宽定义">
<rect width="420" height="527" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">同一个频谱有两种常见“宽度”：</tspan><tspan x="20.0" dy="25">平均绝对距离与均方根距离</tspan></text><rect x="54.0" y="101.0" width="336.0" height="164.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><polyline points="54.0,265.0 110.0,227.7 166.0,115.9 222.0,227.7 278.0,265.0 334.0,265.0 390.0,265.0" fill="none" stroke="#0878b9" stroke-width="2.2" stroke-linejoin="round"/><circle cx="54.0" cy="265.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="110.0" cy="227.7" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="166.0" cy="115.9" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="222.0" cy="227.7" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="278.0" cy="265.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="334.0" cy="265.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="390.0" cy="265.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="166.0" y1="105.0" x2="166.0" y2="261.0" stroke="#a5761a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="166.0" y="121.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="middle">质心 1000 Hz</text><text x="54.0" y="285.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0</text><text x="222.0" y="285.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1.5k</text><text x="390.0" y="285.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">3k Hz</text><rect x="20.0" y="309.0" width="380.0" height="76.0" rx="9" fill="#fff" stroke="#c65a3d" stroke-width="1.4"/><text x="32.0" y="333.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">p = 1　平均绝对距离</text><text x="32.0" y="363.0" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">166.7 Hz</text><rect x="20.0" y="401.0" width="380.0" height="76.0" rx="9" fill="#fff" stroke="#3b8f68" stroke-width="1.4"/><text x="32.0" y="425.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">p = 2　均方根距离（库默认）</text><text x="32.0" y="455.0" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">288.7 Hz</text><text x="20.0" y="505.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">两把尺都合理，但结果不能混用；本课用 p=2 对齐库函数。</text>
</svg>
