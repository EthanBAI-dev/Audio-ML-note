<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#0b0b0b" role="img" aria-label="任务问题与频域特征的对应关系">
<rect width="420" height="620" fill="#ffffff"/>
<text x="20" y="31" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start"><tspan x="20" dy="0">先问任务需要什么证据，再挑特征</tspan></text><text x="20" y="65" font-size="16.5" font-weight="700" fill="#2a78d6" text-anchor="start">比较低频与高频</text><line x1="20.0" y1="84.0" x2="400.0" y2="84.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="20" y="119" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">带能量比</text><text x="20" y="155" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="20" dy="0">鼓点、敲击与持续声的差异</tspan><tspan x="20" dy="21"></tspan></text><text x="20" y="253" font-size="16.5" font-weight="700" fill="#eb6834" text-anchor="start">追踪频率整体位置</text><line x1="20.0" y1="272.0" x2="400.0" y2="272.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="20" y="307" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">频谱质心</text><text x="20" y="343" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="20" dy="0">声音成分整体向高处还是低处</tspan><tspan x="20" dy="21">移动</tspan></text><text x="20" y="441" font-size="16.5" font-weight="700" fill="#1baf7a" text-anchor="start">判断频率是否铺开</text><line x1="20.0" y1="460.0" x2="400.0" y2="460.0" stroke="#e3e7ea" stroke-width="1" stroke-linecap="round"/><text x="20" y="495" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">频谱带宽</text><text x="20" y="531" font-size="14" font-weight="400" fill="#6f7b89" text-anchor="start"><tspan x="20" dy="0">集中在窄带还是散布到更宽范</tspan><tspan x="20" dy="21">围</tspan></text>
</svg>
