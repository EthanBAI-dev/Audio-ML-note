<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 715.88" width="912" height="715.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="三类任务问题分别对应哪一个频域特征">
<rect width="912" height="715.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">先想清楚要什么证据，</tspan><tspan x="40" dy="58">再挑特征</tspan></text><rect x="40.0" y="167.9" width="832.0" height="138.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="225.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">低音占了多大比例？</text><text x="64" y="275.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">用</text><text x="110" y="275.88" font-size="32" font-weight="700" fill="#3b8f68" text-anchor="start">带能量比</text><rect x="40.0" y="323.9" width="832.0" height="138.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="381.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">整体偏高还是偏低？</text><text x="64" y="431.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">用</text><text x="110" y="431.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="start">频谱质心</text><rect x="40.0" y="479.9" width="832.0" height="138.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="537.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">成分集中还是散？</text><text x="64" y="587.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">用</text><text x="110" y="587.88" font-size="32" font-weight="700" fill="#a5761a" text-anchor="start">频谱带宽</text><text x="40" y="617.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">反过来先堆一堆数字再找用途，通常更不可靠</text><text x="40" y="675.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">特征是用来回答问题的，不是用来凑数量的。</text>
</svg>
