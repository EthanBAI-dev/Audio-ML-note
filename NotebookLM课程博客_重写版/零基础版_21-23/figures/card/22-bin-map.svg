<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 793.88" width="912" height="793.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="用真实 FFT 频率轴查找 2000 Hz 的切分行">
<rect width="912" height="793.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">分界频率对应第几行，</tspan><tspan x="40" dy="58">要算，不能猜</tspan></text><rect x="40.0" y="167.9" width="832.0" height="104.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="229.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">每一行相隔多少赫兹</text><text x="848" y="229.88" font-size="32" font-weight="700" fill="#0878b9" text-anchor="end">16000 ÷ 1024 = 15.625 Hz</text><rect x="40.0" y="285.9" width="832.0" height="104.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="347.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">2000 Hz 落在第几行</text><text x="848" y="347.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="end">2000 ÷ 15.625 = 128</text><rect x="40.0" y="403.9" width="832.0" height="104.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="465.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">取第一个不小于它的行</text><text x="848" y="465.88" font-size="32" font-weight="700" fill="#3b8f68" text-anchor="end">第 128 行</text><rect x="53.0" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="115.5" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="177.9" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="240.4" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="302.8" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="365.3" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="427.8" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="490.2" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="552.7" y="557.9" width="56.5" height="76.0" rx="6" fill="#c65a3d" stroke="#c65a3d" stroke-width="3" opacity="1"/><rect x="615.2" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="677.6" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="740.1" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><rect x="802.5" y="557.9" width="56.5" height="76.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1.5" opacity="1"/><text x="580.9230769230769" y="687.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="middle">第 128 行</text><text x="40" y="753.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">先生成真实的赫兹轴，再去找位置——顺序不能反。</text>
</svg>
