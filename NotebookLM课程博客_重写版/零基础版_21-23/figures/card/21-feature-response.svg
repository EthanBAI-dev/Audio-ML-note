<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 637.88" width="912" height="637.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="三种频谱变化对带能量比、质心与带宽的影响">
<rect width="912" height="637.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">频谱一变，</tspan><tspan x="40" dy="58">三个数字怎么动</tspan></text><text x="482" y="155.88" font-size="32" font-weight="700" fill="#3b8f68" text-anchor="middle">带能量比</text><text x="638" y="155.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="middle">质心</text><text x="794" y="155.88" font-size="32" font-weight="700" fill="#a5761a" text-anchor="middle">带宽</text><rect x="40.0" y="175.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="243.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">整体一起变响</text><text x="482" y="247.88" font-size="46" font-weight="700" fill="#9aa5b0" text-anchor="middle">—</text><text x="638" y="247.88" font-size="46" font-weight="700" fill="#9aa5b0" text-anchor="middle">—</text><text x="794" y="247.88" font-size="46" font-weight="700" fill="#9aa5b0" text-anchor="middle">—</text><rect x="40.0" y="301.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="369.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">高频成分变多</text><text x="482" y="373.88" font-size="46" font-weight="700" fill="#3b8f68" text-anchor="middle">↓</text><text x="638" y="373.88" font-size="46" font-weight="700" fill="#c65a3d" text-anchor="middle">↑</text><text x="794" y="373.88" font-size="46" font-weight="700" fill="#a5761a" text-anchor="middle">↑</text><rect x="40.0" y="427.9" width="832.0" height="112.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="495.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">成分变得更散</text><text x="482" y="499.88" font-size="32" font-weight="700" fill="#9aa5b0" text-anchor="middle">看情况</text><text x="638" y="499.88" font-size="46" font-weight="700" fill="#9aa5b0" text-anchor="middle">—</text><text x="794" y="499.88" font-size="46" font-weight="700" fill="#a5761a" text-anchor="middle">↑</text><text x="40" y="539.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">这是常见方向，不是对所有声音都成立的规则</text><text x="40" y="597.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">第一行三个都不动——所以它们都不管整体音量。</text>
</svg>
