<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" width="420" height="650" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="声功率声强声压的区别">
<rect width="420" height="650" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">三个“声音大小”</tspan><tspan x="22" dy="25">描述的不是同一件事</tspan></text><rect x="28" y="82" width="364" height="148" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="60" cy="118" r="18" fill="#0878b9" stroke="none" stroke-width="1"/><text x="60" y="124" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="88" y="123" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">声功率：声源放出多少</text><text x="48" y="164" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="48" dy="0">像灯泡标着多少瓦</tspan><tspan x="48" dy="23">描述声源本身</tspan></text><rect x="294" y="146" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="330" cy="174" r="14" fill="#fff4ca" stroke="#d6a72e" stroke-width="1.7"/><rect x="322" y="188" width="16" height="9" rx="2" fill="#d9e1e8" stroke="#647382" stroke-width="1" opacity="1"/><line x1="351" y1="174" x2="357" y2="174" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="344.8492424049175" y1="188.8492424049175" x2="349.09188309203677" y2="193.09188309203677" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="330" y1="195" x2="330" y2="201" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="315.1507575950825" y1="188.8492424049175" x2="310.90811690796323" y2="193.0918830920368" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="309" y1="174" x2="303" y2="174" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="315.1507575950825" y1="159.1507575950825" x2="310.90811690796323" y2="154.90811690796323" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="330" y1="153" x2="330" y2="147" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="344.8492424049175" y1="159.1507575950825" x2="349.09188309203677" y2="154.9081169079632" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><rect x="28" y="260" width="364" height="148" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="60" cy="296" r="18" fill="#0878b9" stroke="none" stroke-width="1"/><text x="60" y="302" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="88" y="301" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">声强：每平方米收到多少</text><text x="48" y="342" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="48" dy="0">像桌面每块区域有多亮</tspan><tspan x="48" dy="23">会随距离改变</tspan></text><rect x="294" y="324" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="310" cy="357" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><path d="M321.7 347.1 A18 18 0 0 1 321.7 366.9" fill="none" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M329.5 340.5 A30 30 0 0 1 329.5 373.5" fill="none" stroke="#aab8c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M337.3 333.9 A42 42 0 0 1 337.3 380.1" fill="none" stroke="#aab8c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="28" y="438" width="364" height="148" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="60" cy="474" r="18" fill="#0878b9" stroke="none" stroke-width="1"/><text x="60" y="480" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="88" y="479" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">声压：麦克风在一点量到什么</text><text x="48" y="520" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="48" dy="0">空气压力怎样变化</tspan><tspan x="48" dy="23">是麦克风首先响应的量</tspan></text><rect x="294" y="502" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="304" y="514" width="52" height="42" rx="5" fill="#edf6fc" stroke="#647382" stroke-width="1" opacity="1"/><path d="M312 541 Q330 518 348 541" fill="none" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="330" y1="541" x2="344" y2="525" stroke="#c65a3d" stroke-width="2" stroke-linecap="round"/><circle cx="330" cy="541" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="28" y="632" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">放出、传到、测到，必须分开讨论。</text>
</svg>
