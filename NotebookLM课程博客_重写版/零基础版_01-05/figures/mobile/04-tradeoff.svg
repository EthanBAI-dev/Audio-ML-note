<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 559" width="420" height="559" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="提高采样率与位深的收益和代价">
<rect width="420" height="559" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">采样率和位深</tspan><tspan x="22" dy="25">各自换来什么、付出什么</tspan></text><rect x="24" y="77" width="372" height="196" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="44" y="113" font-size="17.5" font-weight="700" fill="#0878b9" text-anchor="start">采样率更高</text><text x="44" y="149" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="44" dy="0">换来：能记录更高的频率成分</tspan><tspan x="44" dy="28">代价：文件更大，计算更多</tspan></text><rect x="308" y="95" width="70" height="62" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="321" y="135" width="10" height="14" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="338" y="119" width="10" height="30" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="355" y="103" width="10" height="46" rx="2" fill="#0878b9" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="42" y="217" width="336" height="38" rx="7" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="210" y="242" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">任务需要高频信息时才值得</text><rect x="24" y="291" width="372" height="196" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="44" y="327" font-size="17.5" font-weight="700" fill="#0878b9" text-anchor="start">位深更高</text><text x="44" y="363" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="44" dy="0">换来：档位更密，量化误差更小</tspan><tspan x="44" dy="28">代价：文件同样会变大</tspan></text><rect x="308" y="309" width="70" height="62" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><line x1="318.0" y1="317.0" x2="368.0" y2="317.0" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="318.0" y1="324.0" x2="368.0" y2="324.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="318.0" y1="331.0" x2="368.0" y2="331.0" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="318.0" y1="338.0" x2="368.0" y2="338.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="318.0" y1="345.0" x2="368.0" y2="345.0" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="318.0" y1="352.0" x2="368.0" y2="352.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="318.0" y1="359.0" x2="368.0" y2="359.0" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><circle cx="353" cy="333" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="42" y="431" width="336" height="38" rx="7" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="210" y="456" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">录音环境足够安静时才值得</text><text x="24" y="515" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">参数不是越大越专业，</tspan><tspan x="24" dy="23">而是要刚好覆盖任务需要的信息。</tspan></text>
</svg>
