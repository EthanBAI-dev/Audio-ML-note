<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 601" width="420" height="601" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="照单全算与按任务倒推两条路线的对比">
<rect width="420" height="601" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">挑音频特征：</tspan><tspan x="20.0" dy="25">照单全算，还是按任务倒推</tspan></text><rect x="20.0" y="85.0" width="380.0" height="230.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="36.0" y="111.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">照单全算</text><rect x="36.0" y="123.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="141.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">算 20 种特征</text><line x1="50.0" y1="150.0" x2="50.0" y2="159.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,159.0 47.6,154.6 52.4,154.6" fill="#c65a3d"/><rect x="36.0" y="161.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="179.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">拼成一个大向量</text><line x1="50.0" y1="188.0" x2="50.0" y2="197.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,197.0 47.6,192.6 52.4,192.6" fill="#c65a3d"/><rect x="36.0" y="199.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="217.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">训练</text><line x1="50.0" y1="226.0" x2="50.0" y2="235.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,235.0 47.6,230.6 52.4,230.6" fill="#c65a3d"/><rect x="36.0" y="237.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="255.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">准确率 62%</text><line x1="50.0" y1="264.0" x2="50.0" y2="273.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,273.0 47.6,268.6 52.4,268.6" fill="#c65a3d"/><rect x="36.0" y="275.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="46.0" y="293.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">然后呢？</text><rect x="20.0" y="329.0" width="380.0" height="192.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="36.0" y="355.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">按任务倒推</text><rect x="36.0" y="367.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="385.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">先问要什么证据</text><line x1="50.0" y1="394.0" x2="50.0" y2="403.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,403.0 47.6,398.6 52.4,398.6" fill="#3b8f68"/><rect x="36.0" y="405.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="423.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">只算能提供它的</text><line x1="50.0" y1="432.0" x2="50.0" y2="441.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,441.0 47.6,436.6 52.4,436.6" fill="#3b8f68"/><rect x="36.0" y="443.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="461.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">准确率 62%</text><line x1="50.0" y1="470.0" x2="50.0" y2="479.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,479.0 47.6,474.6 52.4,474.6" fill="#3b8f68"/><rect x="36.0" y="481.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="46.0" y="499.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">检查证据在不在数据里</text><text x="20.0" y="539.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">照单全算：不知道哪一维有用、哪一维在添乱，只能换个更大的模型再试</tspan><tspan x="20.0" dy="21">按任务倒推：效果一样，但下一步该做什么是明确的</tspan></text>
</svg>
