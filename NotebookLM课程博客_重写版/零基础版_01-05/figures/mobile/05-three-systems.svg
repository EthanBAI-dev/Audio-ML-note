<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 585" width="420" height="585" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="DSP 规则系统、传统机器学习与深度学习三类系统">
<rect width="420" height="585" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">按「特征从哪儿来」，</tspan><tspan x="20.0" dy="25">能听懂声音的系统分三类</tspan></text><rect x="20.0" y="99.0" width="380.0" height="128.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="32.0" y="124.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">DSP / 规则系统</text><text x="32.0" y="144.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">人写死判断规则</text><text x="32.0" y="171.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">特征</text><text x="388.0" y="171.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">不需要</text><text x="32.0" y="193.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">数据</text><text x="388.0" y="193.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">不需要</text><text x="32.0" y="215.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">可解释</text><text x="388.0" y="215.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">完全</text><rect x="20.0" y="239.0" width="380.0" height="128.0" rx="9" fill="#eef4f8" stroke="#0878b9" stroke-width="2.2"/><text x="32.0" y="264.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">传统机器学习</text><text x="32.0" y="284.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">人做特征工程</text><text x="32.0" y="311.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">特征</text><text x="388.0" y="311.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">人手工算</text><text x="32.0" y="333.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">数据</text><text x="388.0" y="333.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">较少</text><text x="32.0" y="355.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">可解释</text><text x="388.0" y="355.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">高</text><text x="210.0" y="355.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">← 这门课在这里</text><rect x="20.0" y="379.0" width="380.0" height="128.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.5"/><text x="32.0" y="404.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">深度学习</text><text x="32.0" y="424.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">程序自动提特征</text><text x="32.0" y="451.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">特征</text><text x="388.0" y="451.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">程序自己学</text><text x="32.0" y="473.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">数据</text><text x="388.0" y="473.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">较多</text><text x="32.0" y="495.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">可解释</text><text x="388.0" y="495.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">低</text><line x1="20.0" y1="529.0" x2="400.0" y2="529.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><line x1="20.0" y1="529.0" x2="400.0" y2="529.0" stroke="#5b6673" stroke-width="1.4" stroke-linecap="round"/><polygon points="400.0,529.0 393.9,532.4 393.9,525.6" fill="#5b6673"/><text x="20.0" y="547.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">人写的越来越少</text><text x="400.0" y="547.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">要的数据越来越多，越难解释</text><text x="20.0" y="567.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">这门课手工算特征，把它整理成一张可信的表；表交给哪种算法，不在这 23 课范围内。</text>
</svg>
