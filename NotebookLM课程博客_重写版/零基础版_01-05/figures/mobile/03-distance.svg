<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 583" width="420" height="583" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="距离翻倍声强降到四分之一">
<rect width="420" height="583" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">平方反比：距离翻倍</tspan><tspan x="22" dy="25">同样能量摊到四倍面积</tspan></text><rect x="24" y="77" width="372" height="212" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="98" cy="183" r="10" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="98" y="213" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">声源</text><path d="M148 125 A82 82 0 0 1 148 241" fill="none" stroke="#0878b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 95 A150 150 0 0 1 206 271" fill="none" stroke="#647382" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="156" y="120" font-size="15" font-weight="700" fill="#0878b9" text-anchor="start">1 米</text><text x="216" y="98" font-size="15" font-weight="700" fill="#647382" text-anchor="start">2 米</text><rect x="24" y="309" width="372" height="98" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="52" y="333" width="48" height="48" rx="4" fill="rgba(8,120,185,.65)" stroke="#0878b9" stroke-width="1" opacity="1"/><text x="120" y="347" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="120" dy="0">1 米：一格面积</tspan><tspan x="120" dy="24">每格得到 1 份能量</tspan></text><rect x="24" y="427" width="372" height="114" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="48" y="455" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="48" y="489" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="82" y="455" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="82" y="489" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><text x="134" y="457" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start"><tspan x="134" dy="0">2 米：四格面积</tspan><tspan x="134" dy="23">每格只剩 1/4 份</tspan><tspan x="134" dy="23">不是一半</tspan></text><text x="24" y="567" font-size="14" font-weight="400" fill="#647382" text-anchor="start">前提：空旷、无反射、声源向各方向均匀发声。</text>
</svg>
