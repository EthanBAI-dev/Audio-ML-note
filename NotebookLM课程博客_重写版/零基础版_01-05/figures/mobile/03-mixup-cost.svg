<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 563" width="420" height="563" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="混用仪器读数与分清之后两条路线的对比">
<rect width="420" height="563" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">把仪器读数当听感，</tspan><tspan x="20.0" dy="25">错在哪一步</tspan></text><rect x="20.0" y="85.0" width="380.0" height="192.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="36.0" y="111.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">混着用</text><rect x="36.0" y="123.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="141.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">测出 RMS 相同</text><line x1="50.0" y1="150.0" x2="50.0" y2="159.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,159.0 47.6,154.6 52.4,154.6" fill="#c65a3d"/><rect x="36.0" y="161.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="179.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">说“一样响”</text><line x1="50.0" y1="188.0" x2="50.0" y2="197.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,197.0 47.6,192.6 52.4,192.6" fill="#c65a3d"/><rect x="36.0" y="199.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="217.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">用户反馈一个更吵</text><line x1="50.0" y1="226.0" x2="50.0" y2="235.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,235.0 47.6,230.6 52.4,230.6" fill="#c65a3d"/><rect x="36.0" y="237.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="46.0" y="255.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">查不出原因</text><rect x="20.0" y="291.0" width="380.0" height="192.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="36.0" y="317.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">分清之后</text><rect x="36.0" y="329.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="347.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">RMS 相同</text><line x1="50.0" y1="356.0" x2="50.0" y2="365.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,365.0 47.6,360.6 52.4,360.6" fill="#3b8f68"/><rect x="36.0" y="367.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="385.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">但频率分布不同</text><line x1="50.0" y1="394.0" x2="50.0" y2="403.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,403.0 47.6,398.6 52.4,398.6" fill="#3b8f68"/><rect x="36.0" y="405.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="423.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">中高频多的更响</text><line x1="50.0" y1="432.0" x2="50.0" y2="441.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,441.0 47.6,436.6 52.4,436.6" fill="#3b8f68"/><rect x="36.0" y="443.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="46.0" y="461.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">换听感相关的指标</text><text x="20.0" y="501.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">混着用：RMS 看不见频率分布，所以你手上没有能解释这件事的数</tspan><tspan x="20.0" dy="21">分清之后：知道该换 LUFS，也知道为什么要换</tspan></text>
</svg>
