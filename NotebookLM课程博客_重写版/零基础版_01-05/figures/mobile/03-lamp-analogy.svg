<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 599" width="420" height="599" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="声功率声强声压的区别">
<rect width="420" height="599" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">三个“声音大小”</tspan><tspan x="22" dy="25">描述的不是同一件事</tspan></text><rect x="24" y="77" width="372" height="148" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="56" cy="113" r="18" fill="#0878b9" stroke="none" stroke-width="1"/><text x="56" y="119" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="84" y="118" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">声功率：声源放出多少</text><text x="44" y="159" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="44" dy="0">像灯泡标着多少瓦</tspan><tspan x="44" dy="23">描述声源本身</tspan></text><rect x="306" y="141" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="342" cy="169" r="14" fill="#fff4ca" stroke="#d6a72e" stroke-width="1.7"/><rect x="334" y="183" width="16" height="9" rx="2" fill="#d9e1e8" stroke="#647382" stroke-width="1" opacity="1"/><line x1="363.0" y1="169.0" x2="369.0" y2="169.0" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="356.8" y1="183.8" x2="361.1" y2="188.1" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="342.0" y1="190.0" x2="342.0" y2="196.0" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="327.2" y1="183.8" x2="322.9" y2="188.1" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="321.0" y1="169.0" x2="315.0" y2="169.0" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="327.2" y1="154.2" x2="322.9" y2="149.9" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="342.0" y1="148.0" x2="342.0" y2="142.0" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><line x1="356.8" y1="154.2" x2="361.1" y2="149.9" stroke="#d6a72e" stroke-width="1.5" stroke-linecap="round"/><rect x="24" y="243" width="372" height="148" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="56" cy="279" r="18" fill="#0878b9" stroke="none" stroke-width="1"/><text x="56" y="285" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="84" y="284" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">声强：每平方米收到多少</text><text x="44" y="325" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="44" dy="0">像桌面每块区域有多亮</tspan><tspan x="44" dy="23">会随距离改变</tspan></text><rect x="306" y="307" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="322" cy="340" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><path d="M333.7 330.1 A18 18 0 0 1 333.7 349.9" fill="none" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M341.5 323.5 A30 30 0 0 1 341.5 356.5" fill="none" stroke="#aab8c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M349.3 316.9 A42 42 0 0 1 349.3 363.1" fill="none" stroke="#aab8c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="24" y="409" width="372" height="148" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="56" cy="445" r="18" fill="#0878b9" stroke="none" stroke-width="1"/><text x="56" y="451" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="84" y="450" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">声压：麦克风在一点量到什么</text><text x="44" y="491" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="44" dy="0">空气压力怎样变化</tspan><tspan x="44" dy="23">是麦克风首先响应的量</tspan></text><rect x="306" y="473" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="316" y="485" width="52" height="42" rx="5" fill="#edf6fc" stroke="#647382" stroke-width="1" opacity="1"/><path d="M324 512 Q342 489 360 512" fill="none" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="342.0" y1="512.0" x2="356.0" y2="496.0" stroke="#c65a3d" stroke-width="2" stroke-linecap="round"/><circle cx="342" cy="512" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="24" y="583" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">放出、传到、测到，必须分开讨论。</text>
</svg>
