<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 441" width="420" height="441" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="从听阈到痛阈的声强阶梯与对应的分贝值">
<rect width="420" height="441" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">声强从听阈到痛阈差 13 个数量级，</tspan><tspan x="20.0" dy="25">写成分贝只有 0 到 130</tspan></text><rect x="20.0" y="97.0" width="380.0" height="35.0" rx="6" fill="#eef4f8" stroke="#0878b9" stroke-width="1.5"/><text x="32.0" y="118.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">刚能听见</text><text x="182.0" y="118.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">10^-12 W/m²</text><text x="388.0" y="118.0" font-size="15.5" font-weight="700" fill="#0878b9" text-anchor="end">0 dB</text><rect x="20.0" y="137.0" width="380.0" height="35.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="32.0" y="158.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">安静的房间</text><text x="182.0" y="158.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">10^-10 W/m²</text><text x="388.0" y="158.0" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="end">20 dB</text><rect x="20.0" y="177.0" width="380.0" height="35.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="32.0" y="198.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">正常交谈</text><text x="182.0" y="198.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">10^-6 W/m²</text><text x="388.0" y="198.0" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="end">60 dB</text><rect x="20.0" y="217.0" width="380.0" height="35.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="32.0" y="238.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">繁忙街道</text><text x="182.0" y="238.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">10^-4 W/m²</text><text x="388.0" y="238.0" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="end">80 dB</text><rect x="20.0" y="257.0" width="380.0" height="35.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="32.0" y="278.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">摇滚现场</text><text x="182.0" y="278.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">10^-1 W/m²</text><text x="388.0" y="278.0" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="end">110 dB</text><rect x="20.0" y="297.0" width="380.0" height="35.0" rx="6" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.5"/><text x="32.0" y="318.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">开始感到疼</text><text x="182.0" y="318.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">10^1 W/m²</text><text x="388.0" y="318.0" font-size="15.5" font-weight="700" fill="#c65a3d" text-anchor="end">130 dB</text><text x="20.0" y="349.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">左边每往下一格是十倍，乘了 13 次；</tspan><tspan x="20.0" dy="21">右边只从 0 走到 130。声强变十倍多 10 dB，</tspan><tspan x="20.0" dy="21">翻一倍多约 3 dB（10·log₁₀2 = 3.01）。</tspan><tspan x="20.0" dy="21">听阈是 0 dB——不是没声音，是等于参考值。</tspan></text>
</svg>
