<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 393" width="420" height="393" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="不同频率要听起来一样响所需的额外分贝">
<rect width="420" height="393" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">要听起来一样响，</tspan><tspan x="20.0" dy="25">低频得比 1 kHz 多给几十分贝</tspan></text><rect x="20.0" y="101.0" width="380.0" height="170.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="20.0" y1="266.8" x2="400.0" y2="266.8" stroke="#d7dfe6" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><text x="26.0" y="260.8" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">1 kHz 记作 0</text><polyline points="20.0,101.0 24.4,107.3 28.4,113.5 32.9,119.5 37.1,125.3 41.3,131.0 45.6,136.5 49.8,141.8 54.2,147.0 58.4,152.0 62.7,156.9 67.0,161.7 71.3,166.3 75.5,170.8 79.7,175.1 84.0,179.4 88.3,183.5 92.6,187.5 96.9,191.4 101.1,195.1 105.4,198.8 109.6,202.3 113.9,205.8 118.2,209.1 122.5,212.3 126.8,215.4 131.0,218.4 135.3,221.3 139.5,224.1 143.8,226.8 148.1,229.4 152.4,232.0 156.6,234.4 160.9,236.8 165.2,239.1 169.4,241.4 173.7,243.5 178.0,245.6 182.3,247.6 186.5,249.5 190.8,251.3 195.1,253.1 199.3,254.7 203.6,256.4 207.9,257.9 212.1,259.3 216.4,260.6 220.7,261.9 224.9,263.0 229.2,264.1 233.5,265.1 237.8,266.0 242.0,266.8 246.3,267.5 250.6,268.1 254.8,268.7 259.1,269.2 263.4,269.6 267.6,270.0 271.9,270.3 276.2,270.5 280.4,270.7 284.7,270.9 289.0,271.0 293.3,271.0 297.5,271.0 301.8,270.9 306.1,270.8 310.3,270.7 314.6,270.4 318.9,270.2 323.1,269.8 327.4,269.4 331.7,268.9 336.0,268.4 340.2,267.7 344.5,267.0 348.8,266.1 353.0,265.1 357.3,264.0 361.6,262.7 365.8,261.4 370.1,259.8 374.4,258.2 378.7,256.3 382.9,254.3 387.2,252.2 391.5,249.9 395.7,247.4 400.0,244.7" fill="none" stroke="#0878b9" stroke-width="2.2" stroke-linejoin="round"/><line x1="20.0" y1="271.0" x2="20.0" y2="276.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="20.0" y="290.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">20</text><line x1="111.5" y1="271.0" x2="111.5" y2="276.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="111.5" y="290.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">100</text><line x1="242.4" y1="271.0" x2="242.4" y2="276.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="242.4" y="290.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1k</text><line x1="373.3" y1="271.0" x2="373.3" y2="276.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="373.3" y="290.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">10k</text><line x1="293.3" y1="107.0" x2="293.3" y2="271.0" stroke="#c65a3d" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><text x="299.3" y="119.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">最敏感 2447 Hz</text><circle cx="88.3" cy="183.5" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="96.3" y="187.5" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">67 Hz 要多给 25.3 dB</text><text x="20.0" y="301.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">曲线越高＝这个频率越不敏感，要一样响就</tspan><tspan x="20.0" dy="21">得多给越多分贝。线不是平的，这就是</tspan><tspan x="20.0" dy="21">「同样声强、不同频率不一样响」的意思。</tspan><tspan x="20.0" dy="21">（由 A 计权公式取负算出，形状同等响曲线。）</tspan></text>
</svg>
