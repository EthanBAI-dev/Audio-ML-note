<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 524" width="420" height="524" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="分贝将一万亿倍能量范围转换为零到一百二十分贝">
<rect width="420" height="524" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">分贝：把巨大倍数</tspan><tspan x="22" dy="25">压成容易比较的数字</tspan></text><rect x="24" y="77" width="372" height="370" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><line x1="78.0" y1="103.0" x2="78.0" y2="397.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="78" y="419" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">1</text><line x1="150.0" y1="103.0" x2="150.0" y2="397.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="150" y="419" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">10^3</text><line x1="222.0" y1="103.0" x2="222.0" y2="397.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="222" y="419" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">10^6</text><line x1="294.0" y1="103.0" x2="294.0" y2="397.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="294" y="419" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">10^9</text><line x1="366.0" y1="103.0" x2="366.0" y2="397.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="366" y="419" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">10^12</text><line x1="78.0" y1="397.0" x2="366.0" y2="397.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="68" y="402" font-size="14" font-weight="400" fill="#647382" text-anchor="end">0</text><line x1="78.0" y1="323.5" x2="366.0" y2="323.5" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="68" y="328.5" font-size="14" font-weight="400" fill="#647382" text-anchor="end">30</text><line x1="78.0" y1="250.0" x2="366.0" y2="250.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="68" y="255" font-size="14" font-weight="400" fill="#647382" text-anchor="end">60</text><line x1="78.0" y1="176.5" x2="366.0" y2="176.5" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="68" y="181.5" font-size="14" font-weight="400" fill="#647382" text-anchor="end">90</text><line x1="78.0" y1="103.0" x2="366.0" y2="103.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="68" y="108" font-size="14" font-weight="400" fill="#647382" text-anchor="end">120</text><polyline points="78.0,397.0 366.0,103.0" fill="none" stroke="#0878b9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78" cy="397" r="5" fill="#fff" stroke="#0878b9" stroke-width="2"/><text x="86" y="385" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">刚能听见</text><circle cx="222" cy="250" r="5" fill="#fff" stroke="#0878b9" stroke-width="2"/><text x="230" y="238" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">正常说话</text><circle cx="366" cy="103" r="5" fill="#fff" stroke="#0878b9" stroke-width="2"/><text x="358" y="91" font-size="14" font-weight="700" fill="#0878b9" text-anchor="end">接近疼痛</text><text x="36" y="435" font-size="14" font-weight="400" fill="#647382" text-anchor="start">横轴：能量是参考值的多少倍</text><text x="24" y="477" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start"><tspan x="24" dy="0">分贝永远是“相对于参考值”的比值。</tspan><tspan x="24" dy="23">参考值不同，分贝数就不能直接比较。</tspan></text>
</svg>
