<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 402" width="420" height="402" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="人耳听觉范围 20 Hz 到 20 kHz，以及常见声音落在哪里">
<rect width="420" height="402" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">人耳能听到的，</tspan><tspan x="20.0" dy="25">是每秒 20 次到 20000 次之间的振动</tspan></text><rect x="20.0" y="105.0" width="56.1" height="30.0" rx="5" fill="#f0f2f4" stroke="#d7dfe6" stroke-width="1"/><rect x="355.6" y="105.0" width="44.4" height="30.0" rx="5" fill="#f0f2f4" stroke="#d7dfe6" stroke-width="1"/><rect x="76.1" y="105.0" width="279.5" height="30.0" rx="5" fill="#e8f3ea" stroke="#3b8f68" stroke-width="1.8"/><text x="215.8" y="125.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="middle">听得见</text><text x="28.0" y="125.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">次声</text><text x="392.0" y="125.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">超声</text><line x1="76.1" y1="95.0" x2="76.1" y2="145.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><text x="76.1" y="89.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">20 Hz</text><line x1="355.6" y1="95.0" x2="355.6" y2="145.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><text x="355.6" y="89.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">20 kHz</text><line x1="48.0" y1="157.0" x2="48.0" y2="163.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="48.0" y="177.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">10</text><line x1="141.2" y1="157.0" x2="141.2" y2="163.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="141.2" y="177.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">100</text><line x1="234.4" y1="157.0" x2="234.4" y2="163.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="234.4" y="177.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1k</text><line x1="327.5" y1="157.0" x2="327.5" y2="163.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="327.5" y="177.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">10k</text><text x="20.0" y="177.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">每格 ×10</text><circle cx="25.0" cy="187.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="36.0" y="191.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">最低的钢琴音　约 27.5 Hz</text><circle cx="25.0" cy="208.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="36.0" y="212.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">男声基频　约 110 Hz</text><circle cx="25.0" cy="229.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="36.0" y="233.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">女声基频　约 220 Hz</text><circle cx="25.0" cy="250.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="36.0" y="254.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">A4 标准音　约 440 Hz</text><circle cx="25.0" cy="271.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="36.0" y="275.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">最高的钢琴音　约 4186 Hz</text><circle cx="25.0" cy="292.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="36.0" y="296.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">镲片的亮部　约 12 kHz</text><text x="20.0" y="331.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">上限随年龄下降：年轻人能到 18 kHz 以上，</tspan><tspan x="20.0" dy="21">中年后常降到 15 kHz 左右。第 04 课决定</tspan><tspan x="20.0" dy="21">「每秒记录多少次」，靠的就是这条上限。</tspan></text>
</svg>
