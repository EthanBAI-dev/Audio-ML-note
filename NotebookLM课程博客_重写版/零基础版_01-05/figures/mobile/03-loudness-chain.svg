<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 557" width="420" height="557" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="声功率、声强、声压、分贝、响度、音色六个量组成的链条">
<rect width="420" height="557" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">从声源到耳朵，</tspan><tspan x="20.0" dy="25">中间隔着六个不同的量</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">声功率</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">声源每秒放出多少</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><text x="60.0" y="156.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">摊在越来越大的球面上</text><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">声强</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">这里每平方米通过多少</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><text x="60.0" y="230.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">麦克风感受的是压力</text><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">声压</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">麦克风真正量到的</text><line x1="46.0" y1="291.0" x2="46.0" y2="305.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,305.0 43.1,299.7 48.9,299.7" fill="#5b6673"/><text x="60.0" y="304.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">范围太大，改写成对数</text><rect x="20.0" y="309.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.6"/><text x="34.0" y="333.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">分贝</text><text x="34.0" y="353.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">两个量的比值写成对数</text><line x1="46.0" y1="365.0" x2="46.0" y2="379.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,379.0 43.1,373.7 48.9,373.7" fill="#5b6673"/><text x="60.0" y="378.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">耳朵对各频率不一样敏感</text><rect x="20.0" y="383.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="407.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">响度</text><text x="34.0" y="427.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">听觉给出的判断</text><line x1="46.0" y1="439.0" x2="46.0" y2="453.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,453.0 43.1,447.7 48.9,447.7" fill="#5b6673"/><text x="60.0" y="452.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">减掉高低和响度之后</text><rect x="20.0" y="457.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="481.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">音色</text><text x="34.0" y="501.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">还剩下的那点差别</text><text x="20.0" y="535.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">前三个是物理量，第四个只是记法，后两个是感觉——混用就会出错。</text>
</svg>
