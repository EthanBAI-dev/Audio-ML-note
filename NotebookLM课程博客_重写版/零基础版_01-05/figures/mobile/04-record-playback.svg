<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 684" width="420" height="684" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="录音经过麦克风与 ADC，放音经过 DAC 与音箱">
<rect width="420" height="684" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">录音这条链走 ADC，</tspan><tspan x="20.0" dy="25">放音那条链走 DAC</tspan></text><rect x="20.0" y="95.0" width="380.0" height="220.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="36.0" y="120.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">录音</text><rect x="36.0" y="131.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="149.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">空气振动</text><line x1="50.0" y1="158.0" x2="50.0" y2="165.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,165.0 47.6,160.6 52.4,160.6" fill="#c65a3d"/><rect x="36.0" y="167.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="185.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">麦克风</text><line x1="50.0" y1="194.0" x2="50.0" y2="201.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,201.0 47.6,196.6 52.4,196.6" fill="#c65a3d"/><rect x="36.0" y="203.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="221.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">抗混叠滤波</text><line x1="50.0" y1="230.0" x2="50.0" y2="237.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,237.0 47.6,232.6 52.4,232.6" fill="#c65a3d"/><rect x="36.0" y="239.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="257.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">ADC 采样＋量化</text><line x1="50.0" y1="266.0" x2="50.0" y2="273.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,273.0 47.6,268.6 52.4,268.6" fill="#c65a3d"/><rect x="36.0" y="275.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="46.0" y="293.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">一串数字</text><rect x="20.0" y="331.0" width="380.0" height="220.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="36.0" y="356.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">放音</text><rect x="36.0" y="367.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="385.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">一串数字</text><line x1="50.0" y1="394.0" x2="50.0" y2="401.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,401.0 47.6,396.6 52.4,396.6" fill="#3b8f68"/><rect x="36.0" y="403.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="421.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">DAC 还原电压</text><line x1="50.0" y1="430.0" x2="50.0" y2="437.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,437.0 47.6,432.6 52.4,432.6" fill="#3b8f68"/><rect x="36.0" y="439.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="457.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">平滑滤波</text><line x1="50.0" y1="466.0" x2="50.0" y2="473.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,473.0 47.6,468.6 52.4,468.6" fill="#3b8f68"/><rect x="36.0" y="475.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="493.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">功放推音箱</text><line x1="50.0" y1="502.0" x2="50.0" y2="509.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,509.0 47.6,504.6 52.4,504.6" fill="#3b8f68"/><rect x="36.0" y="511.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="46.0" y="529.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">空气振动</text><text x="20.0" y="569.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">录音：滤波那一步砍掉了超过一半采样率的成分</tspan><tspan x="20.0" dy="20">放音：砍掉的东西补不回来，听到的是拼起来的版本</tspan></text><text x="20.0" y="617.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">两条链读着对称，信息上不对称：录音砍掉的</tspan><tspan x="20.0" dy="21">两样东西——超过一半采样率的成分、档位之间</tspan><tspan x="20.0" dy="21">那点差值——放音都补不回来。</tspan></text>
</svg>
