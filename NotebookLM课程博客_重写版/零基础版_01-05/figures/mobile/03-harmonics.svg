<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">同一个音，</tspan><tspan x="20.0" dy="25">三件乐器的泛音强度完全不同</tspan></text><rect x="20.0" y="101.0" width="380.0" height="84.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="20.0" y="93.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">小提琴　基频 260.3 Hz</text><line x1="49.0" y1="185.0" x2="49.0" y2="158.5" stroke="#0878b9" stroke-width="2" stroke-linecap="round"/><circle cx="49.0" cy="158.5" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="49.0" y="151.5" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">1.00</text><line x1="78.0" y1="185.0" x2="78.0" y2="112.6" stroke="#0878b9" stroke-width="2" stroke-linecap="round"/><circle cx="78.0" cy="112.6" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="78.0" y="105.6" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">2.73</text><line x1="107.1" y1="185.0" x2="107.1" y2="177.2" stroke="#0878b9" stroke-width="2" stroke-linecap="round"/><circle cx="107.1" cy="177.2" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="107.1" y="170.2" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">0.29</text><line x1="136.1" y1="185.0" x2="136.1" y2="182.2" stroke="#0878b9" stroke-width="2" stroke-linecap="round"/><circle cx="136.1" cy="182.2" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="136.1" y="175.2" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">0.11</text><line x1="165.1" y1="185.0" x2="165.1" y2="178.9" stroke="#0878b9" stroke-width="2" stroke-linecap="round"/><circle cx="165.1" cy="178.9" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="165.1" y="171.9" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">0.23</text><line x1="194.1" y1="185.0" x2="194.1" y2="178.0" stroke="#0878b9" stroke-width="2" stroke-linecap="round"/><circle cx="19