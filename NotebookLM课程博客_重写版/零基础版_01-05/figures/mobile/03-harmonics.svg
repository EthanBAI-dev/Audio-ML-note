 cy="291.4" r="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="195.1" y="284.4" font-size="14" font-weight="400" fill="#a5761a" text-anchor="middle">0.14</text><rect x="20.0" y="321.0" width="380.0" height="84.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="20.0" y="313.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">钢琴　基频 528.4 Hz</text><line x1="78.9" y1="405.0" x2="78.9" y2="378.5" stroke="#3b8f68" stroke-width="2" stroke-linecap="round"/><circle cx="78.9" cy="378.5" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="78.9" y="371.5" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">1.00</text><line x1="137.8" y1="405.0" x2="137.8" y2="393.6" stroke="#3b8f68" stroke-width="2" stroke-linecap="round"/><circle cx="137.8" cy="393.6" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="137.8" y="386.6" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">0.43</text><line x1="196.7" y1="405.0" x2="196.7" y2="402.8" stroke="#3b8f68" stroke-width="2" stroke-linecap="round"/><circle cx="196.7" cy="402.8" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="196.7" y="395.8" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">0.08</text><line x1="255.7" y1="405.0" x2="255.7" y2="403.0" stroke="#3b8f68" stroke-width="2" stroke-linecap="round"/><circle cx="255.7" cy="403.0" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="255.7" y="396.0" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">0.08</text><line x1="314.6" y1="405.0" x2="314.6" y2="404.7" stroke="#3b8f68" stroke-width="2" stroke-linecap="round"/><circle cx="314.6" cy="404.7" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="314.6" y="397.7" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">0.01</text><line x1="373.5" y1="405.0" x2="373.5" y2="404.9" stroke="#3b8f68" stroke-width="2" stroke-linecap="round"/><circle cx="373.5" 