<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 610" width="420" height="610" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="距离翻倍声强降到四分之一">
<rect width="420" height="610" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">平方反比：距离翻倍</tspan><tspan x="22" dy="25">同样能量摊到四倍面积</tspan></text><rect x="26" y="78" width="368" height="212" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="100" cy="184" r="10" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="100" y="214" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">声源</text><path d="M150 126 A82 82 0 0 1 150 242" fill="none" stroke="#0878b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M208 96 A150 150 0 0 1 208 272" fill="none" stroke="#647382" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="158" y="121" font-size="15" font-weight="700" fill="#0878b9" text-anchor="start">1 米</text><text x="218" y="99" font-size="15" font-weight="700" fill="#647382" text-anchor="start">2 米</text><rect x="34" y="320" width="352" height="98" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="62" y="344" width="48" height="48" rx="4" fill="rgba(8,120,185,.65)" stroke="#0878b9" stroke-width="1" opacity="1"/><text x="130" y="358" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="130" dy="0">1 米：一格面积</tspan><tspan x="130" dy="24">每格得到 1 份能量</tspan></text><rect x="34" y="438" width="352" height="114" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="58" y="466" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="58" y="500" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="92" y="466" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="92" y="500" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><text x="144" y="468" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start"><tspan x="144" dy="0">2 米：四格面积</tspan><tspan x="144" dy="23">每格只剩 1/4 份</tspan><tspan x="144" dy="23">不是一半</tspan></text><text x="28" y="590" font-size="14" font-weight="400" fill="#647382" text-anchor="start">前提：空旷、无反射、声源向各方向均匀发声。</text>
</svg>
