<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="人工音频特征与模型学习特征的组合">
<rect width="420" height="620" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">音频特征的两种来源</tspan><tspan x="22" dy="25">可以组合，不必二选一</tspan></text><rect x="28" y="84" width="364" height="158" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="48" y="120" font-size="18" font-weight="700" fill="#0878b9" text-anchor="start">人工规则计算</text><text x="48" y="156" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="48" dy="0">含义清楚、容易排查</tspan><tspan x="48" dy="24">样本少也能使用</tspan><tspan x="48" dy="24">风险：规则可能漏掉关键线索</tspan></text><rect x="294" y="108" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="307" y="152" width="10" height="14" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="324" y="136" width="10" height="30" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="341" y="120" width="10" height="46" rx="2" fill="#0878b9" stroke="#0878b9" stroke-width="1" opacity="1"/><line x1="210" y1="250" x2="210" y2="284" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="210,284 206.8,277.8 213.2,277.8" fill="#c65a3d"/><rect x="28" y="292" width="364" height="158" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="48" y="328" font-size="18" font-weight="700" fill="#0878b9" text-anchor="start">模型从数据中学习</text><text x="48" y="364" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="48" dy="0">能学习复杂关系</tspan><tspan x="48" dy="24">但更依赖数据和算力</tspan><tspan x="48" dy="24">风险：可能学到无关差异</tspan></text><rect x="294" y="316" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><line x1="307" y1="335" x2="330" y2="331" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="307" y1="335" x2="330" y2="349" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="307" y1="335" x2="330" y2="367" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="307" y1="363" x2="330" y2="331" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="307" y1="363" x2="330" y2="349" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="307" y1="363" x2="330" y2="367" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="330" y1="331" x2="353" y2="349" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="330" y1="349" x2="353" y2="349" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="330" y1="367" x2="353" y2="349" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><circle cx="307" cy="335" r="4" fill="#d9ecf8" stroke="#0878b9" stroke-width="1"/><circle cx="307" cy="363" r="4" fill="#d9ecf8" stroke="#0878b9" stroke-width="1"/><circle cx="330" cy="331" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="330" cy="349" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="330" cy="367" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="353" cy="349" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><rect x="38" y="486" width="344" height="82" rx="10" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="210" y="518" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="middle"><tspan x="210" dy="0">常见组合</tspan><tspan x="210" dy="25">前面用稳定规则，后面交给模型学习</tspan></text><text x="28" y="600" font-size="15" font-weight="400" fill="#647382" text-anchor="start">选择依据是任务证据和数据条件。</text>
</svg>
