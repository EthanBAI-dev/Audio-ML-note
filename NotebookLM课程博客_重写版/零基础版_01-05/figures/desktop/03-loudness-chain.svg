<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216" width="880" height="216" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="声功率、声强、声压、分贝、响度、音色六个量组成的链条">
<rect width="880" height="216" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">从声源到耳朵，中间隔着六个不同的量</text><rect x="30.0" y="66.0" width="111.7" height="92.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="85.8" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">声功率</text><text x="85.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="85.8" dy="0">声源每秒</tspan><tspan x="85.8" dy="19">放出多少</tspan></text><line x1="146.7" y1="112.0" x2="166.7" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="166.7,112.0 160.5,115.4 160.5,108.6" fill="#5b6673"/><rect x="171.7" y="66.0" width="111.7" height="92.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="227.5" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">声强</text><text x="227.5" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="227.5" dy="0">这里每平方米</tspan><tspan x="227.5" dy="19">通过多少</tspan></text><line x1="288.3" y1="112.0" x2="308.3" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="308.3,112.0 302.2,115.4 302.2,108.6" fill="#5b6673"/><rect x="313.3" y="66.0" width="111.7" height="92.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="369.2" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">声压</text><text x="369.2" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="369.2" dy="0">麦克风</tspan><tspan x="369.2" dy="19">真正量到的</tspan></text><line x1="430.0" y1="112.0" x2="450.0" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="450.0,112.0 443.9,115.4 443.9,108.6" fill="#5b6673"/><rect x="455.0" y="66.0" width="111.7" height="92.0" rx="9" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.6"/><text x="510.8" y="96.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="middle">分贝</text><text x="510.8" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="510.8" dy="0">两个量的比值</tspan><tspan x="510.8" dy="19">写成对数</tspan></text><line x1="571.7" y1="112.0" x2="591.7" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="591.7,112.0 585.5,115.4 585.5,108.6" fill="#5b6673"/><rect x="596.7" y="66.0" width="111.7" height="92.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="652.5" y="96.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="middle">响度</text><text x="652.5" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="652.5" dy="0">听觉给出的</tspan><tspan x="652.5" dy="19">判断</tspan></text><line x1="713.3" y1="112.0" x2="733.3" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="733.3,112.0 727.2,115.4 727.2,108.6" fill="#5b6673"/><rect x="738.3" y="66.0" width="111.7" height="92.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="794.2" y="96.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="middle">音色</text><text x="794.2" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="794.2" dy="0">还剩下的</tspan><tspan x="794.2" dy="19">那点差别</tspan></text><text x="30.0" y="194.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">前三个是物理量，第四个只是记法，后两个是感觉——混用就会出错。</text>
</svg>
