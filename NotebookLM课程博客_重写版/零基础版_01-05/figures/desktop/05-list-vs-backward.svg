<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 346" width="880" height="346" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="照单全算与按任务倒推两条路线的对比">
<rect width="880" height="346" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">挑音频特征：照单全算，还是按任务倒推</text><rect x="30.0" y="64.0" width="820.0" height="118.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="46.0" y="90.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">照单全算</text><rect x="46.0" y="104.0" width="140.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="116.0" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">算 20 种特征</text><line x1="190.0" y1="121.0" x2="204.0" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="204.0,121.0 197.9,124.4 197.9,117.6" fill="#c65a3d"/><rect x="208.0" y="104.0" width="140.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="278.0" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">拼成一个大向量</text><line x1="352.0" y1="121.0" x2="366.0" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="366.0,121.0 359.9,124.4 359.9,117.6" fill="#c65a3d"/><rect x="370.0" y="104.0" width="140.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="440.0" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">训练</text><line x1="514.0" y1="121.0" x2="528.0" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="528.0,121.0 521.9,124.4 521.9,117.6" fill="#c65a3d"/><rect x="532.0" y="104.0" width="140.0" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="602.0" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">准确率 62%</text><line x1="676.0" y1="121.0" x2="690.0" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="690.0,121.0 683.9,124.4 683.9,117.6" fill="#c65a3d"/><rect x="694.0" y="104.0" width="140.0" height="34.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="764.0" y="125.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">然后呢？</text><text x="46.0" y="162.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">不知道哪一维有用、哪一维在添乱，只能换个更大的模型再试</text><rect x="30.0" y="200.0" width="820.0" height="118.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="46.0" y="226.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">按任务倒推</text><rect x="46.0" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="136.3" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">先问要什么证据</text><line x1="230.5" y1="257.0" x2="244.5" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="244.5,257.0 238.4,260.4 238.4,253.6" fill="#3b8f68"/><rect x="248.5" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="338.8" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">只算能提供它的</text><line x1="433.0" y1="257.0" x2="447.0" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="447.0,257.0 440.9,260.4 440.9,253.6" fill="#3b8f68"/><rect x="451.0" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="541.3" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">准确率 62%</text><line x1="635.5" y1="257.0" x2="649.5" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="649.5,257.0 643.4,260.4 643.4,253.6" fill="#3b8f68"/><rect x="653.5" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="743.8" y="261.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">检查证据在不在数据里</text><text x="46.0" y="298.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">效果一样，但下一步该做什么是明确的</text>
