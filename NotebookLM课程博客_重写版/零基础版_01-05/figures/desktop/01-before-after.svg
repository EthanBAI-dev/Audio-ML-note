 x="642.5" y="125" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">换更大的程序</text><line x1="703.0" y1="121.0" x2="717.0" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="717.0,121.0 710.9,124.4 710.9,117.6" fill="#c65a3d"/><rect x="721.0" y="104.0" width="113.0" height="34.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="777.5" y="125" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">还是不准</text><text x="46" y="162" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">不知道是程序不行，还是材料里根本没线索</text><rect x="30.0" y="200.0" width="820.0" height="118.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="46" y="226" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">按任务倒推</text><rect x="46.0" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="136.25" y="261" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">录音</text><line x1="230.5" y1="257.0" x2="244.5" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="244.5,257.0 238.4,260.4 238.4,253.6" fill="#3b8f68"/><rect x="248.5" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="338.75" y="261" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">先问要哪条证据</text><line x1="433.0" y1="257.0" x2="447.0" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="447.0,257.0 440.9,260.4 440.9,253.6" fill="#3b8f68"/><rect x="451.0" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="541.25" y="261" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">挑留住证据的读法</text><line x1="635.5" y1="257.0" x2="649.5" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="649.5,257.0 643.4,260.4 643.4,253.6" fill="#3b8f68"/><rect x="653.5" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="743.75" y="261" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">再谈程序</text><text x="46" y="298" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">效果不好时，知道该回头查哪一步</text>
