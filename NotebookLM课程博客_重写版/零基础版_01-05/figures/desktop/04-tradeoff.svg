<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="提高采样率与位深的收益和代价">
<rect width="880" height="310" fill="#ffffff"/>
<text x="34" y="34" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">采样率和位深各自换来什么、付出什么</text><rect x="34" y="54" width="395" height="208" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="54" y="90" font-size="18" font-weight="700" fill="#0878b9" text-anchor="start">采样率更高</text><text x="54" y="126" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="54" dy="0">换来：能记录更高的频率成分</tspan><tspan x="54" dy="28">代价：文件更大，计算更多</tspan></text><rect x="341" y="72" width="70" height="62" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="354" y="112" width="10" height="14" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="371" y="96" width="10" height="30" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="388" y="80" width="10" height="46" rx="2" fill="#0878b9" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="52" y="206" width="359" height="38" rx="7" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="231.5" y="231" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">任务需要高频信息时才值得</text><rect x="451" y="54" width="395" height="208" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="471" y="90" font-size="18" font-weight="700" fill="#0878b9" text-anchor="start">位深更高</text><text x="471" y="126" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="471" dy="0">换来：档位更密，量化误差更小</tspan><tspan x="471" dy="28">代价：文件同样会变大</tspan></text><rect x="758" y="72" width="70" height="62" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><line x1="768.0" y1="80.0" x2="818.0" y2="80.0" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="768.0" y1="87.0" x2="818.0" y2="87.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="768.0" y1="94.0" x2="818.0" y2="94.0" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="768.0" y1="101.0" x2="818.0" y2="101.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="768.0" y1="108.0" x2="818.0" y2="108.0" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="768.0" y1="115.0" x2="818.0" y2="115.0" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="768.0" y1="122.0" x2="818.0" y2="122.0" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><circle cx="803" cy="96" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="469" y="206" width="359" height="38" rx="7" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="648.5" y="231" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">录音环境足够安静时才值得</text><text x="34" y="290" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="34" dy="0">参数不是越大越专业，而是要刚好覆盖任务需要的信息。</tspan></text>
</svg>
