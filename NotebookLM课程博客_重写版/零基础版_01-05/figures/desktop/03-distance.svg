<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 328" width="880" height="328" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="距离翻倍声强降到四分之一">
<rect width="880" height="328" fill="#ffffff"/>
<text x="34" y="34" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">平方反比：距离翻倍同样能量摊到四倍面积</text><rect x="34" y="54" width="373.52000000000004" height="212" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><circle cx="108" cy="160" r="10" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="108" y="190" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">声源</text><path d="M158 102 A82 82 0 0 1 158 218" fill="none" stroke="#0878b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M216 72 A150 150 0 0 1 216 248" fill="none" stroke="#647382" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="166" y="97" font-size="15" font-weight="700" fill="#0878b9" text-anchor="start">1 米</text><text x="226" y="75" font-size="15" font-weight="700" fill="#647382" text-anchor="start">2 米</text><rect x="433.52000000000004" y="54" width="412.47999999999996" height="98" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="461.52000000000004" y="78" width="48" height="48" rx="4" fill="rgba(8,120,185,.65)" stroke="#0878b9" stroke-width="1" opacity="1"/><text x="529.52" y="92" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="529.52" dy="0">1 米：一格面积</tspan><tspan x="529.52" dy="24">每格得到 1 份能量</tspan></text><rect x="433.52000000000004" y="172" width="412.47999999999996" height="114" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="457.52000000000004" y="200" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="457.52000000000004" y="234" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="491.52000000000004" y="200" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="491.52000000000004" y="234" width="30" height="30" rx="3" fill="rgba(8,120,185,.18)" stroke="#0878b9" stroke-width="1" opacity="1"/><text x="543.52" y="202" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start"><tspan x="543.52" dy="0">2 米：四格面积</tspan><tspan x="543.52" dy="23">每格只剩 1/4 份</tspan><tspan x="543.52" dy="23">不是一半</tspan></text><text x="34" y="312" font-size="14" font-weight="400" fill="#647382" text-anchor="start">前提：空旷、无反射、声源向各方向均匀发声。</text>
</svg>
