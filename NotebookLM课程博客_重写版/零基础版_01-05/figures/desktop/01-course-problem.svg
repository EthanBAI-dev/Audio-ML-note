<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" role="img" aria-label="照片和录音进入判断程序前的数据形状不同，录音需要先整理成可比较的数字证据">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="28" y="40" font-size="24" font-weight="700" fill="#0b0b0b">同样是让程序判断，照片和录音的入口并不一样</text>
  <text x="28" y="68" font-size="14" fill="#6f7b89">这张图只说明课程问题；后面的课才逐步解释声音怎样被记录和整理</text>

  <rect x="28" y="96" width="824" height="124" rx="10" fill="#f7f9fb" stroke="#dfe5ea"/>
  <text x="48" y="124" font-size="15" font-weight="700" fill="#2a78d6">照片</text>
  <rect x="48" y="140" width="92" height="62" rx="5" fill="#eef5fd" stroke="#2a78d6"/>
  <rect x="59" y="151" width="18" height="18" fill="#8fc2ee"/><rect x="80" y="151" width="18" height="18" fill="#bddaf4"/><rect x="101" y="151" width="18" height="18" fill="#6baee6"/>
  <rect x="59" y="172" width="18" height="18" fill="#bddaf4"/><rect x="80" y="172" width="18" height="18" fill="#2a78d6"/><rect x="101" y="172" width="18" height="18" fill="#8fc2ee"/>
  <text x="157" y="166" font-size="16" font-weight="700" fill="#0b0b0b">固定的颜色网格</text>
  <text x="157" y="191" font-size="13.5" fill="#6f7b89">每个位置都有一个颜色数值</text>
  <line x1="346" y1="171" x2="405" y2="171" stroke="#6f7b89" stroke-width="2"/>
  <polygon points="405,171 394,165 394,177" fill="#6f7b89"/>
  <rect x="418" y="135" width="176" height="72" rx="8" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="506" y="166" font-size="17" font-weight="700" text-anchor="middle" fill="#0b0b0b">负责判断的程序</text>
  <text x="506" y="190" font-size="13.5" text-anchor="middle" fill="#6f7b89">从示例中学会区别</text>
  <line x1="594" y1="171" x2="653" y2="171" stroke="#6f7b89" stroke-width="2"/>
  <polygon points="653,171 642,165 642,177" fill="#6f7b89"/>
  <rect x="666" y="143" width="158" height="56" rx="28" fill="#eaf7f1" stroke="#1b9b6c"/>
  <text x="745" y="178" font-size="18" font-weight="700" text-anchor="middle" fill="#167b57">猫</text>

  <rect x="28" y="238" width="824" height="154" rx="10" fill="#fff8f4" stroke="#f0d6ca"/>
  <text x="48" y="268" font-size="15" font-weight="700" fill="#c65a3d">录音</text>
  <rect x="48" y="284" width="188" height="82" rx="5" fill="#ffffff" stroke="#c65a3d"/>
  <polyline points="58,328 68,319 78,339 88,308 98,349 108,316 118,333 128,322 138,344 148,305 158,351 168,316 178,334 188,326 198,340 208,313 226,330" fill="none" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="142" y="382" font-size="13.5" text-anchor="middle" fill="#6f7b89">一长串随时间排列的数</text>
  <line x1="248" y1="325" x2="293" y2="325" stroke="#6f7b89" stroke-width="2"/>
  <polygon points="293,325 282,319 282,331" fill="#6f7b89"/>
  <rect x="306" y="278" width="170" height="94" rx="8" fill="#fff0e9" stroke="#c65a3d" stroke-width="1.5"/>
  <text x="391" y="310" font-size="17" font-weight="700" text-anchor="middle" fill="#0b0b0b">整理声音证据</text>
  <text x="391" y="337" font-size="13.5" text-anchor="middle" fill="#6f7b89">统一读法、切分、计算</text>
  <text x="391" y="359" font-size="13.5" text-anchor="middle" fill="#6f7b89">本课程逐步完成</text>
  <line x1="476" y1="325" x2="510" y2="325" stroke="#6f7b89" stroke-width="2"/>
  <polygon points="510,325 499,319 499,331" fill="#6f7b89"/>
  <rect x="523" y="289" width="148" height="72" rx="8" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="597" y="320" font-size="17" font-weight="700" text-anchor="middle" fill="#0b0b0b">判断程序</text>
  <text x="597" y="344" font-size="13.5" text-anchor="middle" fill="#6f7b89">比较整理后的数字</text>
  <line x1="671" y1="325" x2="700" y2="325" stroke="#6f7b89" stroke-width="2"/>
  <polygon points="700,325 689,319 689,331" fill="#6f7b89"/>
  <rect x="713" y="297" width="111" height="56" rx="28" fill="#eaf7f1" stroke="#1b9b6c"/>
  <text x="768.5" y="332" font-size="18" font-weight="700" text-anchor="middle" fill="#167b57">摇滚</text>
</svg>
