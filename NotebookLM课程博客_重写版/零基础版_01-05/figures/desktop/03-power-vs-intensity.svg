<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="声功率描述声源，声强描述某一个位置">
<rect width="880" height="320" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">声功率只有一个数，声强每个位置一个数</text><rect x="30.0" y="74.0" width="820.0" height="176.0" rx="8" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><circle cx="126.0" cy="162.0" r="9" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="126.0" y="142.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">声源</text><text x="126.0" y="238.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">声功率 1 个数</text><circle cx="126.0" cy="162.0" r="265.2" fill="none" stroke="#d7dfe6" stroke-width="1.2"/><circle cx="391.2" cy="162.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="391.2" y="150.0" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">位置 1</text><text x="391.2" y="184.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">100%</text><circle cx="126.0" cy="162.0" r="460.7" fill="none" stroke="#d7dfe6" stroke-width="1.2"/><circle cx="586.7" cy="162.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="586.7" y="150.0" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">位置 2</text><text x="586.7" y="184.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">33%</text><circle cx="126.0" cy="162.0" r="663.1" fill="none" stroke="#d7dfe6" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="789.1" cy="162.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="789.1" y="150.0" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">位置 3</text><text x="789.1" y="184.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">16%</text><text x="30.0" y="270.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">三个蓝点是三个不同的位置，百分比是它们每平方米分到的能量（以位置 1 为 100%）。</tspan><tspan x="30.0" dy="21">声源没变，声功率那一个数也没变；变的是「传到这儿还剩多少」——这才是麦克风量到的东西。</tspan></text>
</svg>
