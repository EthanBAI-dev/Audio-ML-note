<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="抗混叠滤波、采样、量化三步的先后顺序，以及顺序颠倒的后果">
<rect width="880" height="250" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">连续电压变成数字：三步，顺序不能换</text><rect x="30.0" y="64.0" width="250.7" height="80.0" rx="9" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.8"/><text x="155.3" y="96.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="middle">① 抗混叠滤波</text><text x="155.3" y="122.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">先砍掉记不清楚的高频</text><line x1="286.7" y1="104.0" x2="308.7" y2="104.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="308.7,104.0 302.5,107.4 302.5,100.6" fill="#5b6673"/><rect x="314.7" y="64.0" width="250.7" height="80.0" rx="9" fill="#edf6fc" stroke="#0878b9" stroke-width="1.8"/><text x="440.0" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">② 采样</text><text x="440.0" y="122.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">每 1/fs 秒量一次</text><line x1="571.3" y1="104.0" x2="593.3" y2="104.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="593.3,104.0 587.2,107.4 587.2,100.6" fill="#5b6673"/><rect x="599.3" y="64.0" width="250.7" height="80.0" rx="9" fill="#edf6fc" stroke="#0878b9" stroke-width="1.8"/><text x="724.7" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">③ 量化</text><text x="724.7" y="122.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">靠到最近的档位</text><rect x="30.0" y="174.0" width="820.0" height="62.0" rx="9" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="46.0" y="200.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">× 先采样，再滤波</text><text x="46.0" y="222.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="46.0" dy="0">假的低频这时候已经和真的长得一模一样了，再滤也分不开。</tspan></text>
</svg>
