<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 346" width="880" height="346" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="只靠耳朵与录成波形两条路线的对比">
<rect width="880" height="346" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">听得见的声音，怎么变成算得动的数字</text><rect x="30.0" y="64.0" width="820.0" height="118.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="46.0" y="90.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">只靠耳朵</text><rect x="46.0" y="104.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="136.3" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">空气振动</text><line x1="230.5" y1="121.0" x2="244.5" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="244.5,121.0 238.4,124.4 238.4,117.6" fill="#c65a3d"/><rect x="248.5" y="104.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="338.8" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">耳朵</text><line x1="433.0" y1="121.0" x2="447.0" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="447.0,121.0 440.9,124.4 440.9,117.6" fill="#c65a3d"/><rect x="451.0" y="104.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="541.3" y="125.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">“这是钢琴”</text><line x1="635.5" y1="121.0" x2="649.5" y2="121.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="649.5,121.0 643.4,124.4 643.4,117.6" fill="#c65a3d"/><rect x="653.5" y="104.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="743.8" y="125.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">没有中间量</text><text x="46.0" y="162.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">结论是对的，但中间没有任何东西可以加减乘除</text><rect x="30.0" y="200.0" width="820.0" height="118.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="46.0" y="226.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">录成波形</text><rect x="46.0" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="136.3" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">空气振动</text><line x1="230.5" y1="257.0" x2="244.5" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="244.5,257.0 238.4,260.4 238.4,253.6" fill="#3b8f68"/><rect x="248.5" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="338.8" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">麦克风</text><line x1="433.0" y1="257.0" x2="447.0" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="447.0,257.0 440.9,260.4 440.9,253.6" fill="#3b8f68"/><rect x="451.0" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="541.3" y="261.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">每秒两万多个数字</text><line x1="635.5" y1="257.0" x2="649.5" y2="257.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="649.5,257.0 643.4,260.4 643.4,253.6" fill="#3b8f68"/><rect x="653.5" y="240.0" width="180.5" height="34.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="743.8" y="261.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">可以画、可以算、可以比</text><text x="46.0" y="298.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">把听觉换成一串带时间顺序的数，后面所有计算才有落脚点</text>
</svg>
