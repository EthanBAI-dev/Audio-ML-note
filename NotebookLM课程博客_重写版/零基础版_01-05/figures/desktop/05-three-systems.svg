<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="DSP 规则系统、传统机器学习与深度学习三类系统">
<rect width="880" height="312" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">按「特征从哪儿来」，能听懂声音的系统分三类</text><rect x="30.0" y="78.0" width="265.3" height="156.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="42.0" y="103.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">DSP / 规则系统</text><text x="42.0" y="123.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">人写死判断规则</text><text x="42.0" y="150.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">特征</text><text x="283.3" y="150.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">不需要</text><text x="42.0" y="172.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">数据</text><text x="283.3" y="172.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">不需要</text><text x="42.0" y="194.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">可解释</text><text x="283.3" y="194.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">完全</text><rect x="307.3" y="78.0" width="265.3" height="156.0" rx="9" fill="#eef4f8" stroke="#0878b9" stroke-width="2.2"/><text x="319.3" y="103.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="start">传统机器学习</text><text x="319.3" y="123.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">人做特征工程</text><text x="319.3" y="150.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">特征</text><text x="560.7" y="150.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">人手工算</text><text x="319.3" y="172.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">数据</text><text x="560.7" y="172.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">较少</text><text x="319.3" y="194.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">可解释</text><text x="560.7" y="194.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">高</text><text x="440.0" y="222.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="middle">← 这门课在这里</text><rect x="584.7" y="78.0" width="265.3" height="156.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.5"/><text x="596.7" y="103.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">深度学习</text><text x="596.7" y="123.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">程序自动提特征</text><text x="596.7" y="150.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">特征</text><text x="838.0" y="150.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">程序自己学</text><text x="596.7" y="172.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">数据</text><text x="838.0" y="172.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">较多</text><text x="596.7" y="194.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">可解释</text><text x="838.0" y="194.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="end">低</text><line x1="30.0" y1="256.0" x2="850.0" y2="256.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><line x1="30.0" y1="256.0" x2="850.0" y2="256.0" stroke="#5b6673" stroke-width="1.4" stroke-linecap="round"/><polygon points="850.0,256.0 843.9,259.4 843.9,252.6" fill="#5b6673"/><text x="30.0" y="274.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">人写的越来越少</text><text x="850.0" y="274.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">要的数据越来越多，越难解释</text><text x="30.0" y="294.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">这门课手工算特征，把它整理成一张可信的表；表交给哪种算法，不在这 23 课范围内。</text>
</svg>
