<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 374" width="880" height="374" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="录音经过麦克风与 ADC，放音经过 DAC 与音箱">
<rect width="880" height="374" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">录音这条链走 ADC，放音那条链走 DAC</text><rect x="30.0" y="74.0" width="820.0" height="108.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="46.0" y="99.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">录音</text><rect x="46.0" y="112.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="116.8" y="132.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">空气振动</text><line x1="190.6" y1="128.0" x2="203.6" y2="128.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="203.6,128.0 197.5,131.4 197.5,124.6" fill="#c65a3d"/><rect x="207.6" y="112.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="278.4" y="132.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">麦克风</text><line x1="352.2" y1="128.0" x2="365.2" y2="128.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="365.2,128.0 359.1,131.4 359.1,124.6" fill="#c65a3d"/><rect x="369.2" y="112.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="440.0" y="132.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">抗混叠滤波</text><line x1="513.8" y1="128.0" x2="526.8" y2="128.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="526.8,128.0 520.7,131.4 520.7,124.6" fill="#c65a3d"/><rect x="530.8" y="112.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="601.6" y="132.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">ADC 采样＋量化</text><line x1="675.4" y1="128.0" x2="688.4" y2="128.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="688.4,128.0 682.3,131.4 682.3,124.6" fill="#c65a3d"/><rect x="692.4" y="112.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="763.2" y="132.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">一串数字</text><text x="46.0" y="166.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">滤波那一步砍掉了超过一半采样率的成分</text><rect x="30.0" y="198.0" width="820.0" height="108.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="46.0" y="223.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">放音</text><rect x="46.0" y="236.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="116.8" y="256.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">一串数字</text><line x1="190.6" y1="252.0" x2="203.6" y2="252.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="203.6,252.0 197.5,255.4 197.5,248.6" fill="#3b8f68"/><rect x="207.6" y="236.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="278.4" y="256.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">DAC 还原电压</text><line x1="352.2" y1="252.0" x2="365.2" y2="252.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="365.2,252.0 359.1,255.4 359.1,248.6" fill="#3b8f68"/><rect x="369.2" y="236.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="440.0" y="256.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">平滑滤波</text><line x1="513.8" y1="252.0" x2="526.8" y2="252.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="526.8,252.0 520.7,255.4 520.7,248.6" fill="#3b8f68"/><rect x="530.8" y="236.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="601.6" y="256.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">功放推音箱</text><line x1="675.4" y1="252.0" x2="688.4" y2="252.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="688.4,252.0 682.3,255.4 682.3,248.6" fill="#3b8f68"/><rect x="692.4" y="236.0" width="141.6" height="32.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="763.2" y="256.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="middle">空气振动</text><text x="46.0" y="290.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">砍掉的东西补不回来，听到的是拼起来的版本</text><text x="30.0" y="328.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">两条链读起来对称，信息上并不对称：录音那一侧砍掉的两样东西——超过一半采样率的成分、</tspan><tspan x="30.0" dy="21">档位之间的那点差值——放音时都补不回来。所以你听到的永远是「砍完再拼起来」的版本。</tspan></text>
</svg>
