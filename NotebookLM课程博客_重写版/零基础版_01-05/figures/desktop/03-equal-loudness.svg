<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 371" width="880" height="371" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="不同频率要听起来一样响所需的额外分贝">
<rect width="880" height="371" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">要听起来一样响，低频得比 1 kHz 多给几十分贝</text><rect x="30.0" y="80.0" width="820.0" height="190.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="30.0" y1="265.3" x2="850.0" y2="265.3" stroke="#d7dfe6" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><text x="36.0" y="259.3" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">1 kHz 记作 0</text><polyline points="30.0,80.0 39.4,87.1 48.2,94.0 57.9,100.7 66.8,107.2 76.0,113.5 85.3,119.6 94.4,125.6 103.8,131.4 112.9,137.0 122.2,142.5 131.4,147.8 140.7,153.0 149.8,158.0 158.9,162.9 168.2,167.6 177.4,172.2 186.6,176.7 195.8,181.0 205.0,185.2 214.2,189.3 223.4,193.2 232.7,197.1 241.9,200.8 251.1,204.4 260.4,207.8 269.6,211.2 278.8,214.5 288.0,217.6 297.2,220.6 306.4,223.5 315.6,226.4 324.8,229.1 334.1,231.8 343.3,234.4 352.5,236.9 361.7,239.3 370.9,241.6 380.1,243.8 389.3,245.9 398.5,248.0 407.7,250.0 417.0,251.8 426.2,253.6 435.4,255.3 444.6,256.9 453.8,258.4 463.0,259.8 472.3,261.1 481.5,262.3 490.7,263.4 499.9,264.4 509.1,265.3 518.3,266.1 527.5,266.8 536.7,267.4 546.0,268.0 555.2,268.5 564.4,268.9 573.6,269.2 582.8,269.5 592.0,269.7 601.2,269.9 610.4,270.0 619.7,270.0 628.9,270.0 638.1,269.9 647.3,269.8 656.5,269.6 665.7,269.4 674.9,269.1 684.2,268.7 693.4,268.2 702.6,267.7 711.8,267.1 721.0,266.3 730.2,265.5 739.4,264.5 748.7,263.4 757.9,262.2 767.1,260.8 776.3,259.3 785.5,257.5 794.7,255.7 803.9,253.6 813.1,251.4 822.4,249.0 831.6,246.4 840.8,243.6 850.0,240.7" fill="none" stroke="#0878b9" stroke-width="2.2" stroke-linejoin="round"/><line x1="30.0" y1="270.0" x2="30.0" y2="275.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="30.0" y="289.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">20</text><line x1="227.4" y1="270.0" x2="227.4" y2="275.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="227.4" y="289.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">100</text><line x1="509.9" y1="270.0" x2="509.9" y2="275.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="509.9" y="289.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">1k</text><line x1="792.3" y1="270.0" x2="792.3" y2="275.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="792.3" y="289.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">10k</text><line x1="619.7" y1="86.0" x2="619.7" y2="270.0" stroke="#c65a3d" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><text x="625.7" y="98.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">最敏感 2447 Hz</text><circle cx="177.4" cy="172.2" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="185.4" y="176.2" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">67 Hz 要多给 25.3 dB</text><text x="30.0" y="300.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">纵轴读法：曲线越高，说明这个频率越不敏感，要听起来和 1 kHz 一样响就得多给越多分贝。</tspan><tspan x="30.0" dy="21">曲线不是平的——这就是「同样的声强，不同频率听起来不一样响」的全部意思。</tspan><tspan x="30.0" dy="21">（这条线由 A 计权公式取负算出；A 计权本身就是从 40 方等响曲线反推的，形状一致。）</tspan></text>
</svg>
