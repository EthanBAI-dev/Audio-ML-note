<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="音频特征的五个分类维度">
<rect width="880" height="436" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">一个音频特征，在这五条上各占一个位置</text><rect x="30.0" y="76.0" width="820.0" height="52.0" rx="8" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="44.0" y="98.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="start">抽象层级</text><text x="44.0" y="116.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">离原始测量有多远</text><rect x="374.4" y="93.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#0878b9" stroke-width="1"/><text x="396.9" y="108.0" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">低层</text><rect x="427.4" y="93.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#0878b9" stroke-width="1"/><text x="449.9" y="108.0" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">中层</text><rect x="480.4" y="93.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#0878b9" stroke-width="1"/><text x="502.9" y="108.0" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="middle">高层</text><rect x="30.0" y="136.0" width="820.0" height="52.0" rx="8" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="44.0" y="158.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">时间范围</text><text x="44.0" y="176.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">一次概括多长</text><rect x="374.4" y="153.0" width="126.0" height="22.0" rx="11" fill="#fff" stroke="#3b8f68" stroke-width="1"/><text x="437.4" y="168.0" font-size="12.5" font-weight="400" fill="#3b8f68" text-anchor="middle">瞬时 ~50ms</text><rect x="508.4" y="153.0" width="99.0" height="22.0" rx="11" fill="#fff" stroke="#3b8f68" stroke-width="1"/><text x="557.9" y="168.0" font-size="12.5" font-weight="400" fill="#3b8f68" text-anchor="middle">片段级 几秒</text><rect x="615.4" y="153.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#3b8f68" stroke-width="1"/><text x="637.9" y="168.0" font-size="12.5" font-weight="400" fill="#3b8f68" text-anchor="middle">全局</text><rect x="30.0" y="196.0" width="820.0" height="52.0" rx="8" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.5"/><text x="44.0" y="218.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="start">音乐属性</text><text x="44.0" y="236.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">描述音乐哪个方面</text><rect x="374.4" y="213.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#a5761a" stroke-width="1"/><text x="396.9" y="228.0" font-size="12.5" font-weight="400" fill="#a5761a" text-anchor="middle">节拍</text><rect x="427.4" y="213.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#a5761a" stroke-width="1"/><text x="449.9" y="228.0" font-size="12.5" font-weight="400" fill="#a5761a" text-anchor="middle">音色</text><rect x="480.4" y="213.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#a5761a" stroke-width="1"/><text x="502.9" y="228.0" font-size="12.5" font-weight="400" fill="#a5761a" text-anchor="middle">音高</text><rect x="533.4" y="213.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#a5761a" stroke-width="1"/><text x="555.9" y="228.0" font-size="12.5" font-weight="400" fill="#a5761a" text-anchor="middle">和声</text><rect x="30.0" y="256.0" width="820.0" height="52.0" rx="8" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.5"/><text x="44.0" y="278.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">信号域</text><text x="44.0" y="296.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">从哪个角度观察</text><rect x="374.4" y="273.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#c65a3d" stroke-width="1"/><text x="396.9" y="288.0" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">时域</text><rect x="427.4" y="273.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#c65a3d" stroke-width="1"/><text x="449.9" y="288.0" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">频域</text><rect x="480.4" y="273.0" width="45.0" height="22.0" rx="11" fill="#fff" stroke="#c65a3d" stroke-width="1"/><text x="502.9" y="288.0" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">时频</text><rect x="30.0" y="316.0" width="820.0" height="52.0" rx="8" fill="#f5f8fa" stroke="#5b6673" stroke-width="1.5"/><text x="44.0" y="338.0" font-size="17" font-weight="700" fill="#5b6673" text-anchor="start">算法来源</text><text x="44.0" y="356.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">人算还是程序学</text><rect x="374.4" y="333.0" width="72.0" height="22.0" rx="11" fill="#fff" stroke="#5b6673" stroke-width="1"/><text x="410.4" y="348.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">按公式算</text><rect x="454.4" y="333.0" width="85.5" height="22.0" rx="11" fill="#fff" stroke="#5b6673" stroke-width="1"/><text x="497.1" y="348.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">从数据里学</text><text x="30.0" y="386.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">五条互相独立：换一条不影响另外四条。看到一个陌生的特征名字，就在这五条上各定一次位。</tspan><tspan x="30.0" dy="21">反过来，面对一个新任务，也按这五个问题依次问一遍，答案就是该算什么。</tspan></text>
</svg>
