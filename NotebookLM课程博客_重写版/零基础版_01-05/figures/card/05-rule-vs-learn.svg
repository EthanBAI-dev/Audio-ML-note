<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 513" width="912" height="513" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="人工规则特征与模型学习特征的组合">
<rect width="912" height="513" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">特征的两种来源，可以组合</tspan></text><rect x="40.0" y="109.9" width="403.0" height="222.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="62" y="165.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">人工规则算</text><text x="62" y="217.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="62" dy="0">含义清楚、好排查</tspan><tspan x="62" dy="44">样本少也能用</tspan></text><rect x="469.0" y="109.9" width="403.0" height="222.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="491" y="165.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">模型自己学</text><text x="491" y="217.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="491" dy="0">能学复杂关系</tspan><tspan x="491" dy="44">但吃数据和算力</tspan></text><line x1="445.0" y1="220.9" x2="467.0" y2="220.9" stroke="#c65a3d" stroke-width="3" stroke-linecap="round"/><polygon points="467.0,220.9 455.4,226.7 455.4,215.1" fill="#c65a3d"/><rect x="40.0" y="359.9" width="832.0" height="100.0" rx="14" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="456" y="403.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="middle"><tspan x="456" dy="0">常见做法</tspan><tspan x="456" dy="44">前面用稳定规则，后面交给模型学</tspan></text>
</svg>
