<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 684" width="912" height="684" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="选择音频特征的四个问题">
<rect width="912" height="684" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">选特征前，先回答四个问题</tspan></text><rect x="40.0" y="109.9" width="832.0" height="116.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="84.0" cy="167.9" r="25" fill="#0878b9" stroke="none" stroke-width="1"/><text x="84" y="179.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="126" y="159.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">抽象层级</text><text x="126" y="201.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">目标能拆成可测量的现象吗？</text><rect x="40.0" y="239.9" width="832.0" height="116.0" rx="14" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="84.0" cy="297.9" r="25" fill="#0878b9" stroke="none" stroke-width="1"/><text x="84" y="309.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="126" y="289.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">时间尺度</text><text x="126" y="331.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">看一瞬间、一小段，还是整段？</text><rect x="40.0" y="369.9" width="832.0" height="116.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="84.0" cy="427.9" r="25" fill="#0878b9" stroke="none" stroke-width="1"/><text x="84" y="439.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="126" y="419.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">信号域</text><text x="126" y="461.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">看时间、看成分，还是一起看？</text><rect x="40.0" y="499.9" width="832.0" height="116.0" rx="14" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="84.0" cy="557.9" r="25" fill="#0878b9" stroke="none" stroke-width="1"/><text x="84" y="569.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="126" y="549.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">产生方式</text><text x="126" y="591.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">按公式算，还是让模型学？</text><text x="40" y="663.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">四个答案共同决定一个特征，不是四选一。</text>
</svg>
