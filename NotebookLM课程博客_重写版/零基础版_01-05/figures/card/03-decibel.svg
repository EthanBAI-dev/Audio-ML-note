<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 608" width="912" height="608" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="分贝把一万亿倍范围压成一条直线">
