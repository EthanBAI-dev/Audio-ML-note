<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 684" width="912" height="684" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="声音从纸盆推动空气到麦克风记录数字">
<rect width="912" height="684" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">空气的变化怎样</tspan><tspan x="40" dy="58">变成录音里的数字</tspan></text><rect x="40.0" y="167.9" width="832.0" height="118.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="226.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="82" y="237.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="122" y="215.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">纸盆来回运动</text><text x="122" y="257.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">往外推空气变密，往回收变疏</text><rect x="760.0" y="181.9" width="96.0" height="90.0" rx="12" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="774.0" y="204.9" width="20.0" height="44.0" rx="4" fill="#d9ecf8" stroke="#0878b9" stroke-width="2.5" opacity="1"/><path d="M794 208.88 L816 194.88 L816 258.88 L794 244.88 Z" fill="#edf6fc" stroke="#0878b9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M828 202.88 Q842 226.88 828 250.88" fill="none" stroke="#0878b9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M846 205.88 Q860 226.88 846 247.88" fill="none" stroke="#0878b9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M864 208.88 Q878 226.88 864 244.88" fill="none" stroke="#c65a3d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="40.0" y="299.9" width="832.0" height="118.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="358.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="82" y="369.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="122" y="347.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">疏密向外传播</text><text x="122" y="389.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">空气只在原地动，传的是变化</text><rect x="760.0" y="313.9" width="96.0" height="90.0" rx="12" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="782.0" cy="358.9" r="8" fill="#c65a3d" stroke="none" stroke-width="1"/><path d="M798.12 343.28 A26 26 0 0 1 798.12 374.48" fill="none" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M809.28 332.48 A44 44 0 0 1 809.28 385.28" fill="none" stroke="#aab8c4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M820.44 321.68 A62 62 0 0 1 820.44 396.08" fill="none" stroke="#aab8c4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="40.0" y="431.9" width="832.0" height="118.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="490.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="82" y="501.88" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="122" y="479.88" font-size="38" font-weight="700" fill="#1f2933" text-anchor="start">薄膜跟着动</text><text x="122" y="521.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">位置不同，记录到的也不同</text><rect x="760.0" y="445.9" width="96.0" height="90.0" rx="12" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="792.0" y="461.9" width="32.0" height="42.0" rx="16" fill="#edf6fc" stroke="#0878b9" stroke-width="2.8" opacity="1"/><path d="M781 489.88 Q782 515.88 808 515.88 Q834 515.88 835 489.88" fill="none" stroke="#5b6673" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="808.0" y1="515.9" x2="808.0" y2="523.9" stroke="#5b6673" stroke-width="2.8" stroke-linecap="round"/><rect x="40.0" y="563.9" width="832.0" height="118.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="82.0" cy="622.9" r="24" fill="#0878b9" stroke="none" stroke-width="1"/><text x="82" y="633.88" font-size="3