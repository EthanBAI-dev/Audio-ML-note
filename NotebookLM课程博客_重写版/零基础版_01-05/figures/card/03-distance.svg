<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 513" width="912" height="513" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="距离翻倍声强降到四分之一">
