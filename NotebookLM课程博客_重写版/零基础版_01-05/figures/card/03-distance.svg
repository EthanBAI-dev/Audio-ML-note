eight="700" fill="#c65a3d" text-anchor="start">每格只剩 1/4</text><text x="40" y="397.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">前提：空旷、无反射、各方向均匀发声。</text>
