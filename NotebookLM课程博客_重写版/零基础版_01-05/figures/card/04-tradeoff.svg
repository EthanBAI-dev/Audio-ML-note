<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 513" width="912" height="513" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="提高采样率与位深的收益和代价">
<rect width="912" height="513" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">两个数字，各换来什么</tspan></text><rect x="40.0" y="109.9" width="403.0" height="260.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="62" y="163.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">采样率更高</text><text x="62" y="221.88" font-size="32" font-weight="400" fill="#1f2933" text-anchor="start">换来：记得下更高的成分</text><text x="62" y="267.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">代价：文件大、算得慢</text><rect x="58.0" y="295.9" width="367.0" height="56.0" rx="10" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="241.5" y="331.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="middle">任务需要高频时才值</text><rect x="469.0" y="109.9" width="403.0" height="260.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="491" y="163.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">位深更高</text><text x="491" y="221.88" font-size="32" font-weight="400" fill="#1f2933" text-anchor="start">换来：档位更密，误差更小</text><text x="491" y="267.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">代价：文件同样变大</text><rect x="487.0" y="295.9" width="367.0" height="56.0" rx="10" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="670.5" y="331.88" font-size="32" font-weight="700" fill="#c65a3d" text-anchor="middle">现场够安静时才值</text><text x="40" y="415.88" font-size="34" font-weight="700" fill="#1f2933" text-anchor="start">不是越大越专业，而是刚好覆盖任务需要。</text>
</svg>
