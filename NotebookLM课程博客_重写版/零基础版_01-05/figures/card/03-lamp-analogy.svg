"400" fill="#5b6673" text-anchor="start">传到这里每平方米剩多少</text><rect x="768.0" y="295.9" width="88.0" height="84.0" rx="12" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><circle cx="790.0" cy="337.9" r="8" fill="#c65a3d" stroke="none" stroke-width="1"/><path d="M806.12 322.28 A26 26 0 0 1 806.12 353.48" fill="none" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M817.28 311.48 A44 44 0 0 1 817.28 364.28" fill="none" stroke="#aab8c4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M828.44 300.68 A62 62 0 0 1 828.44 375.08" fill="none" stroke="#aab8c4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="40.0" y="403.9" width="832.0" height="104.0" rx="14" fill="#edf6fc" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="467.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">声压</text><text x="250" y="465.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">麦克风在这一点量到什么</text><rect x="768.0" y="413.9" width="88.0" height="84.0" rx="12" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="782.0" y="429.9" width="60.0" height="52.0" rx="8" fill="#edf6fc" stroke="#5b6673" stroke-width="2" opacity="1"/><path d="M796 465.88 Q812 429.88 828 465.88" fill="none" stroke="#0878b9" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="812.0" y1="465.9" x2="822.0" y2="439.9" stroke="#c65a3d" stroke-width="3" stroke-linecap="round"/><circle cx="812.0" cy="465.9" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="40" y="555.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">放出、传到、测到，必须分开讨论。</text>
