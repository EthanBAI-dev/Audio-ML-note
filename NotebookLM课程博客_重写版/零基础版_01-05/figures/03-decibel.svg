<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 590" width="420" height="590" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="分贝将一万亿倍能量范围转换为零到一百二十分贝">
<rect width="420" height="590" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">分贝：把巨大倍数</tspan><tspan x="22" dy="25">压成容易比较的数字</tspan></text><rect x="42" y="76" width="346" height="370" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><line x1="76" y1="100" x2="76" y2="400" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="76" y="422" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">1</text><line x1="151" y1="100" x2="151" y2="400" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="151" y="422" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">10^3</text><line x1="226" y1="100" x2="226" y2="400" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="226" y="422" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">10^6</text><line x1="301" y1="100" x2="301" y2="400" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="301" y="422" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">10^9</text><line x1="376" y1="100" x2="376" y2="400" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="376" y="422" font-size="14" font-weight="400" fill="#647382" text-anchor="middle">10^12</text><line x1="76" y1="400" x2="376" y2="400" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="66" y="405" font-size="14" font-weight="400" fill="#647382" text-anchor="end">0</text><line x1="76" y1="325" x2="376" y2="325" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="66" y="330" font-size="14" font-weight="400" fill="#647382" text-anchor="end">30</text><line x1="76" y1="250" x2="376" y2="250" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="66" y="255" font-size="14" font-weight="400" fill="#647382" text-anchor="end">60</text><line x1="76" y1="175" x2="376" y2="175" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="66" y="180" font-size="14" font-weight="400" fill="#647382" text-anchor="end">90</text><line x1="76" y1="100" x2="376" y2="100" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><text x="66" y="105" font-size="14" font-weight="400" fill="#647382" text-anchor="end">120</text><polyline points="76.0,400.0 376.0,100.0" fill="none" stroke="#0878b9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="400" r="5" fill="#fff" stroke="#0878b9" stroke-width="2"/><text x="84" y="388" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">刚能听见</text><circle cx="226" cy="250" r="5" fill="#fff" stroke="#0878b9" stroke-width="2"/><text x="234" y="238" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">正常说话</text><circle cx="376" cy="100" r="5" fill="#fff" stroke="#0878b9" stroke-width="2"/><text x="368" y="88" font-size="14" font-weight="700" fill="#0878b9" text-anchor="end">接近疼痛</text><text x="50" y="474" font-size="14" font-weight="400" fill="#647382" text-anchor="start">横轴：能量是参考值的多少倍</text><text x="28" y="520" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start"><tspan x="28" dy="0">分贝永远是“相对于参考值”的比值。</tspan><tspan x="28" dy="23">参考值不同，分贝数就不能直接比较。</tspan></text>
</svg>
