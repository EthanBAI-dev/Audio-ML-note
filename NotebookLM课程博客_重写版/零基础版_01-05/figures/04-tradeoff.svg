<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" width="420" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="提高采样率与位深的收益和代价">
<rect width="420" height="600" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">采样率和位深</tspan><tspan x="22" dy="25">各自换来什么、付出什么</tspan></text><rect x="28" y="86" width="364" height="196" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="48" y="124" font-size="18" font-weight="700" fill="#0878b9" text-anchor="start">采样率更高</text><text x="48" y="164" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="48" dy="0">换来：能记录更高的频率成分</tspan><tspan x="48" dy="29">代价：文件更大，计算更多</tspan></text><rect x="300" y="106" width="70" height="62" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="313" y="146" width="10" height="14" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="330" y="130" width="10" height="30" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="347" y="114" width="10" height="46" rx="2" fill="#0878b9" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="46" y="226" width="328" height="38" rx="7" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="210" y="251" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">任务需要高频信息时才值得</text><rect x="28" y="314" width="364" height="196" rx="10" fill="#edf6fc" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="48" y="352" font-size="18" font-weight="700" fill="#0878b9" text-anchor="start">位深更高</text><text x="48" y="392" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="48" dy="0">换来：档位更密，量化误差更小</tspan><tspan x="48" dy="29">代价：文件同样会变大</tspan></text><rect x="300" y="334" width="70" height="62" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><line x1="310" y1="342" x2="360" y2="342" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="310" y1="349" x2="360" y2="349" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="310" y1="356" x2="360" y2="356" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="310" y1="363" x2="360" y2="363" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="310" y1="370" x2="360" y2="370" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><line x1="310" y1="377" x2="360" y2="377" stroke="#dce5ec" stroke-width="1" stroke-linecap="round"/><line x1="310" y1="384" x2="360" y2="384" stroke="#0878b9" stroke-width="1.4" stroke-linecap="round"/><circle cx="345" cy="358" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="46" y="454" width="328" height="38" rx="7" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="210" y="479" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">录音环境足够安静时才值得</text><text x="30" y="556" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="30" dy="0">参数不是越大越专业，</tspan><tspan x="30" dy="23">而是要刚好覆盖任务需要的信息。</tspan></text>
</svg>
