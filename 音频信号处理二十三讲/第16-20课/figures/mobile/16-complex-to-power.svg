<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" width="420" height="600" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="STFT 交出复数矩阵，取模平方后形状不变但只剩实数功率">
<rect width="420" height="600" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">一次调用得到复数矩阵，</tspan><tspan x="20.0" dy="25">取模平方换成功率矩阵</tspan></text><rect x="20.0" y="99.0" width="380.0" height="74.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="32.0" y="123.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">波形</text><text x="32.0" y="151.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">174943 个数</text><text x="32.0" y="173.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">7.93 秒</text><line x1="210.0" y1="179.0" x2="210.0" y2="198.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="210.0,198.0 206.6,191.9 213.4,191.9" fill="#5b6673"/><rect x="20.0" y="203.0" width="380.0" height="74.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="32.0" y="227.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">librosa.stft</text><text x="32.0" y="255.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">1025 × 342</text><text x="32.0" y="277.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">complex64</text><line x1="210.0" y1="283.0" x2="210.0" y2="302.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="210.0,302.0 206.6,295.9 213.4,295.9" fill="#5b6673"/><rect x="20.0" y="307.0" width="380.0" height="74.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.5"/><text x="32.0" y="331.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">abs(S) ** 2</text><text x="32.0" y="359.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">1025 × 342</text><text x="32.0" y="381.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">float32</text><text x="20.0" y="421.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">两个矩阵一样大：取模平方没丢掉任何一格，</tspan><tspan x="20.0" dy="21">丢的是每格里的相位。第 12 课量过，只剩幅度</tspan><tspan x="20.0" dy="21">就拼不回原波形——这一步不可逆。</tspan></text><rect x="20.0" y="486.0" width="380.0" height="100.0" rx="10" fill="#fff7ed" stroke="#a5761a" stroke-width="1.4"/><text x="34.0" y="510.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="start">列数为什么是 342 而不是 338</text><text x="34.0" y="532.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="34.0" dy="0">完整帧 338 个；默认 center=True 在两端</tspan><tspan x="34.0" dy="19">各补半帧，列数变成 342。写 center=False</tspan><tspan x="34.0" dy="19">就回到 338 列，正是第 15 课手写的数。</tspan></text>
</svg>
