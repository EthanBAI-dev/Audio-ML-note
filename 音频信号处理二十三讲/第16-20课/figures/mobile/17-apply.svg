<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 663" width="420" height="663" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="滤波器组乘上声谱图，1025 行压成 10 个梅尔带，列数不变">
<rect width="420" height="663" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">乘一次矩阵，</tspan><tspan x="20.0" dy="25">频率轴就换成了梅尔带</tspan></text><rect x="20.0" y="99.0" width="380.0" height="78.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="32.0" y="121.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">滤波器组 M</text><text x="32.0" y="147.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">10 × 1025</text><text x="32.0" y="167.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">带 × 频率格</text><text x="210.0" y="196.0" font-size="18" font-weight="700" fill="#5b6673" text-anchor="middle">×</text><rect x="20.0" y="203.0" width="380.0" height="78.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="32.0" y="225.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">声谱图 Y</text><text x="32.0" y="251.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">1025 × 342</text><text x="32.0" y="271.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">频率格 × 帧</text><text x="210.0" y="300.0" font-size="18" font-weight="700" fill="#5b6673" text-anchor="middle">=</text><rect x="20.0" y="307.0" width="380.0" height="78.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.5"/><text x="32.0" y="329.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">M @ Y</text><text x="32.0" y="355.0" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">10 × 342</text><text x="32.0" y="375.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">带 × 帧</text><rect x="20.0" y="409.0" width="380.0" height="148.0" rx="8" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="429.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">10 个梅尔带的声谱图（纵轴：第几个带）</text><image href="data:image/png;base64," x="108" y="441" width="280" height="86" preserveAspectRatio="none"/><rect x="108.0" y="441.0" width="280.0" height="86.0" rx="0" fill="none" stroke="#d7dfe6" stroke-width="1"/><text x="102.0" y="531.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">1 带 180 Hz</text><text x="102.0" y="492.8" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">5 带 1501 Hz</text><text x="102.0" y="445.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">10 带 6219 Hz</text><text x="108.0" y="546.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0</text><text x="248.0" y="546.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">4.0</text><text x="388.0" y="546.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">8 秒</text><text x="20.0" y="571.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">列数没动，行数从 1025 压到 10，</tspan><tspan x="20.0" dy="21">少了 102.5 倍。时间轴没碰，换掉的只有频率轴。</tspan><tspan x="20.0" dy="21">每个带在图上一样高，在赫兹上覆盖的范围</tspan><tspan x="20.0" dy="21">却越往上越宽。</tspan></text>
</svg>
