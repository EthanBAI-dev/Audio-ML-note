<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 529" width="420" height="529" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="13 行 MFCC 原样画出与逐行标准化之后的对比">
<rect width="420" height="529" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">低阶那几行的量级</tspan><tspan x="20.0" dy="25">压过其余</tspan></text><text x="20.0" y="101.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">原样画出来</text><image href="data:image/png;base64," x="72" y="113" width="318" height="92" preserveAspectRatio="none"/><rect x="72.0" y="113.0" width="318.0" height="92.0" rx="8" fill="none" stroke="#d7dfe6" stroke-width="1"/><text x="66.0" y="124.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">第 12 行</text><text x="66.0" y="202.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">第 0 行</text><text x="20.0" y="225.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">每一行各自标准化之后</text><image href="data:image/png;base64," x="72" y="237" width="318" height="92" preserveAspectRatio="none"/><rect x="72.0" y="237.0" width="318.0" height="92.0" rx="8" fill="none" stroke="#d7dfe6" stroke-width="1"/><text x="66.0" y="248.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">第 12 行</text><text x="66.0" y="326.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">第 0 行</text><text x="20.0" y="349.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">上面只分得出最下面那一条，其余十二行</tspan><tspan x="20.0" dy="21">被压成同一片颜色。逐行平均绝对值是一道陡坡：</tspan><tspan x="20.0" dy="21">第 0 行 245、第 1 行 168，</tspan><tspan x="20.0" dy="21">到第 4 行以后就掉到十上下了。</tspan><tspan x="20.0" dy="21">第 0 个系数是其余十二个平均的 10.4 倍，</tspan><tspan x="20.0" dy="21">而它和该帧对数梅尔谱均值相关 1.00，</tspan><tspan x="20.0" dy="21">说的是这一帧多响，不是什么音色。</tspan><tspan x="20.0" dy="21">各行标准化之后，花纹才同时看得见。</tspan></text>
</svg>
