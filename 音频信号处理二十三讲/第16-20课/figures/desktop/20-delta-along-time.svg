oke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="167.1" y1="285.0" x2="188.1" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="199.9" y1="285.0" x2="220.9" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="232.7" y1="285.0" x2="253.7" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="265.5" y1="285.0" x2="286.5" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><rect x="298.3" y="222.4" width="21.0" height="62.6" rx="1" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="331.1" y="238.1" width="21.0" height="46.9" rx="1" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="363.9" y="253.7" width="21.0" height="31.3" rx="1" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="396.7" y="269.3" width="21.0" height="15.7" rx="1" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="429.5" y1="285.0" x2="450.5" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><rect x="462.3" y="269.3" width="21.0" height="15.7" rx="1" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="495.1" y="253.7" width="21.0" height="31.3" rx="1" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="527.9" y="238.1" width="21.0" height="46.9" rx="1" fill="#c65a3d" stroke="none" stroke-width="1"/><rect x="560.7" y="222.4" width="21.0" height="62.6" rx="1" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="593.5" y1="285.0" x2="614.5" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="626.3" y1="285.0" x2="647.3" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="659.1" y1="285.0" x2="680.1" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="691.9" y1="285.0" x2="712.9" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="724.7" y1="285.0" x2="745.7" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="757.5" y1="285.0" x2="778.5" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="790.3" y1="285.0" x2="811.3" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="823.1" y1="285.0" x2="844.1" y2="285.0" stroke="#d7dfe6" stroke-width="2" stroke-linecap="round"/><line x1="440.0" y1="206.0" x2="440.0" y2="292.0" stroke="#a5761a" stroke-width="1.4" stroke-dasharray="4 3" stroke-linecap="round"/><text x="440.0" y="308.0" font-size="12.5" font-weight="700" fill="#a5761a" text-anchor="middle">被改的第 200 帧</text><text x="30.0" y="340.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">delta 不是「后一帧减前一帧」，而是把连续 9 帧摆在一起拟合一条直线，取斜率。</tspan><tspan x="30.0" dy="21">所以一帧的改动会摊到左右各四帧上。中间那一列反而纹丝不动——斜率是右边四帧减左边四帧，</tspan><tspan x="30.0" dy="21">被改的那一帧自己的权重正好是 0：一帧的 delta 完全不取决于它自己。</tspan></text>
