<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="STFT 交出复数矩阵，取模平方后形状不变但只剩实数功率">
<rect width="880" height="340" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">一次调用得到复数矩阵，取模平方换成功率矩阵</text><rect x="30.0" y="78.0" width="250.7" height="88.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="42.0" y="102.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">波形</text><text x="42.0" y="130.0" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">174943 个数</text><text x="42.0" y="152.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">7.93 秒</text><line x1="288.7" y1="122.0" x2="307.7" y2="122.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="307.7,122.0 301.5,125.4 301.5,118.6" fill="#5b6673"/><rect x="314.7" y="78.0" width="250.7" height="88.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="326.7" y="102.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="start">librosa.stft</text><text x="326.7" y="130.0" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">1025 × 342</text><text x="326.7" y="152.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">complex64</text><line x1="573.3" y1="122.0" x2="592.3" y2="122.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="592.3,122.0 586.2,125.4 586.2,118.6" fill="#5b6673"/><rect x="599.3" y="78.0" width="250.7" height="88.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.5"/><text x="611.3" y="102.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">abs(S) ** 2</text><text x="611.3" y="130.0" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">1025 × 342</text><text x="611.3" y="152.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">float32</text><text x="30.0" y="206.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">两个矩阵一样大——取模平方没有丢掉任何一格，丢掉的是每一格里的相位。</tspan><tspan x="30.0" dy="21">第 12 课量过：只剩幅度就拼不回原来的波形，所以这一步是不可逆的。</tspan></text><rect x="30.0" y="250.0" width="820.0" height="76.0" rx="10" fill="#fff7ed" stroke="#a5761a" stroke-width="1.4"/><text x="44.0" y="274.0" font-size="12.5" font-weight="700" fill="#a5761a" text-anchor="start">列数为什么是 342 而不是 338</text><text x="44.0" y="296.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="44.0" dy="0">只数完整帧是 (174943 − 2048) // 512 + 1 = 338 帧；librosa 默认 center=True，两端各补半帧，于是列数变成 342。</tspan><tspan x="44.0" dy="19">写 center=False 就回到 338 列——第 15 课手写的那个数。</tspan></text>
</svg>
