<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="手写滤波器组与库的结果逐步对齐，三个默认值各差在哪里">
<rect width="880" height="560" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">形状一样，数字全不一样：三个默认值逐个改过来</text><rect x="30.0" y="76.0" width="820.0" height="24.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="93.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="start">这一步</text><text x="390.8" y="93.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="start">三角形顶点落在第几格</text><text x="620.4" y="93.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="start">最高权重</text><text x="840.0" y="93.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="end">和手写那版的最大差</text><rect x="30.0" y="104.0" width="820.0" height="40.0" rx="6" fill="#eef7f1" stroke="#3b8f68" stroke-width="1.4"/><text x="40.0" y="121.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">手写那版（第 17 课）</text><text x="40.0" y="137.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">对照基准</text><text x="390.8" y="129.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">17、38、64、98、139 …</text><text x="620.4" y="129.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">1.0000</text><text x="840.0" y="129.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="end">—</text><rect x="30.0" y="149.0" width="820.0" height="40.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="166.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">① 库的默认值</text><text x="40.0" y="182.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">什么都没改</text><text x="390.8" y="174.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">28、56、84、115、158 …</text><text x="620.4" y="174.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">0.0033</text><text x="840.0" y="174.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">0.9999</text><rect x="30.0" y="194.0" width="820.0" height="40.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="211.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">② 加上 fmax=8000</text><text x="40.0" y="227.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">库默认 fmax = sr/2 = 11025</text><text x="390.8" y="219.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">25、51、76、103、136 …</text><text x="620.4" y="219.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">0.0036</text><text x="840.0" y="219.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">0.9995</text><rect x="30.0" y="239.0" width="820.0" height="40.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="256.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">③ 再加上 norm=None</text><text x="40.0" y="272.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">库默认 norm='slaney'，三角形面积归一</text><text x="390.8" y="264.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">25、51、76、103、136 …</text><text x="620.4" y="264.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">0.9999</text><text x="840.0" y="264.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">0.5080</text><rect x="30.0" y="284.0" width="820.0" height="40.0" rx="6" fill="#eef7f1" stroke="#3b8f68" stroke-width="1.4"/><text x="40.0" y="301.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="start">④ 再加上 htk=True</text><text x="40.0" y="317.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">库默认 htk=False，另一条梅尔公式</text><text x="390.8" y="309.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">17、38、64、98、139 …</text><text x="620.4" y="309.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">0.9998</text><text x="840.0" y="309.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="end">0.0147</text><text x="30.0" y="339.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="start">为什么顶点会错位：两条梅尔公式根本不是一条</text><rect x="30.0" y="351.0" width="820.0" height="22.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="40.0" y="367.0" font-size="12.5" font-weight="700" fill="#5b6673" text-anchor="start">频率</text><text x="407.2" y="367.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="end">HTK（第 17 课那条）</text><text x="840.0" y="367.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">Slaney（库的默认）</text><text x="40.0" y="392.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">100 Hz</text><text x="407.2" y="392.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="end">150.49 Mel</text><text x="840.0" y="392.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">1.50 Mel</text><line x1="30.0" y1="398.0" x2="850.0" y2="398.0" stroke="#d7dfe6" stroke-width="0.8" stroke-linecap="round"/><text x="40.0" y="418.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">1000 Hz</text><text x="407.2" y="418.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="end">999.99 Mel</text><text x="840.0" y="418.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">15.00 Mel</text><line x1="30.0" y1="424.0" x2="850.0" y2="424.0" stroke="#d7dfe6" stroke-width="0.8" stroke-linecap="round"/><text x="40.0" y="444.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">4000 Hz</text><text x="407.2" y="444.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="end">2146.06 Mel</text><text x="840.0" y="444.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">35.16 Mel</text><line x1="30.0" y1="450.0" x2="850.0" y2="450.0" stroke="#d7dfe6" stroke-width="0.8" stroke-linecap="round"/><text x="40.0" y="470.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">8000 Hz</text><text x="407.2" y="470.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="end">2840.02 Mel</text><text x="840.0" y="470.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="end">45.25 Mel</text><line x1="30.0" y1="476.0" x2="850.0" y2="476.0" stroke="#d7dfe6" stroke-width="0.8" stroke-linecap="round"/><text x="30.0" y="489.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">三处都改过来之后，顶点位置完全一致，最大差只剩 0.0147。</tspan><tspan x="30.0" dy="21">这点残差来自第 17 课的第 ④ 步：那里把三角形的三个角四舍五入到了最近的频率格，</tspan><tspan x="30.0" dy="21">库则直接拿精确频率去算每一格的权重。</tspan></text>
</svg>
