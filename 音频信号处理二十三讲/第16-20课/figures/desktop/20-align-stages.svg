<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 332" width="880" height="332" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="逐个改默认值时，自己算的 MFCC 与库的最大差">
<rect width="880" height="332" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">一行 librosa.feature.mfcc，要改对四个默认值才能自己复现</text><text x="30.0" y="99.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">起点：40 带 + 第 18 课改过的那三个</text><line x1="298.0" y1="81.0" x2="298.0" y2="109.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="298.0" y="88.0" width="430.2" height="14.0" rx="2" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="736.2" y="99.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">344.2</text><text x="30.0" y="133.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">把 htk 改回 False</text><line x1="298.0" y1="115.0" x2="298.0" y2="143.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="298.0" y="122.0" width="428.3" height="14.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="734.3" y="133.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">342.7</text><text x="30.0" y="167.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">把 norm 改回 'slaney'</text><line x1="298.0" y1="149.0" x2="298.0" y2="177.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="298.0" y="156.0" width="256.5" height="14.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="562.5" y="167.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">205.2</text><text x="30.0" y="201.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">去掉 fmax（默认到 sr/2）</text><line x1="298.0" y1="183.0" x2="298.0" y2="211.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="298.0" y="190.0" width="240.9" height="14.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="546.9" y="201.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">192.8</text><text x="30.0" y="235.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="start">把梅尔带数 40 改成 128</text><line x1="298.0" y1="217.0" x2="298.0" y2="245.0" stroke="#d7dfe6" stroke-width="1" stroke-linecap="round"/><rect x="298.0" y="224.0" width="0.0" height="14.0" rx="2" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="306.0" y="235.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="start">0.0000　逐位相同</text><line x1="30.0" y1="258.0" x2="850.0" y2="258.0" stroke="#d7dfe6" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><text x="30.0" y="278.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">对照：从起点只把梅尔带改成 128、别的三个不动，最大差还有 226.2。</tspan><tspan x="30.0" dy="21">四个默认值缺一不可；其中梅尔带数最要命，因为它决定喂给 DCT 的原料有几根。</tspan></text>
</svg>
