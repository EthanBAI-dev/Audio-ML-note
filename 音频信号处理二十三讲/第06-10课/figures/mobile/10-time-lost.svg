<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 563" width="420" height="563" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="整段变换与分帧后逐帧变换的对比">
<rect width="420" height="563" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">整段做一次，</tspan><tspan x="20.0" dy="25">和切成小段各做一次</tspan></text><rect x="20.0" y="85.0" width="380.0" height="192.0" rx="10" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="36.0" y="111.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">整段变换一次</text><rect x="36.0" y="123.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="141.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">10 秒录音</text><line x1="50.0" y1="150.0" x2="50.0" y2="159.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,159.0 47.6,154.6 52.4,154.6" fill="#c65a3d"/><rect x="36.0" y="161.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="179.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">一次傅里叶变换</text><line x1="50.0" y1="188.0" x2="50.0" y2="197.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,197.0 47.6,192.6 52.4,192.6" fill="#c65a3d"/><rect x="36.0" y="199.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="217.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">一条频谱</text><line x1="50.0" y1="226.0" x2="50.0" y2="235.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,235.0 47.6,230.6 52.4,230.6" fill="#c65a3d"/><rect x="36.0" y="237.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="46.0" y="255.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">答不出第几秒</text><rect x="20.0" y="291.0" width="380.0" height="192.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="36.0" y="317.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">先分帧再逐帧变换</text><rect x="36.0" y="329.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="347.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">切成小段</text><line x1="50.0" y1="356.0" x2="50.0" y2="365.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,365.0 47.6,360.6 52.4,360.6" fill="#3b8f68"/><rect x="36.0" y="367.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="385.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">每段各变换一次</text><line x1="50.0" y1="394.0" x2="50.0" y2="403.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,403.0 47.6,398.6 52.4,398.6" fill="#3b8f68"/><rect x="36.0" y="405.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="46.0" y="423.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">一列列排开</text><line x1="50.0" y1="432.0" x2="50.0" y2="441.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="50.0,441.0 47.6,436.6 52.4,436.6" fill="#3b8f68"/><rect x="36.0" y="443.0" width="348.0" height="26.0" rx="6" fill="#fff" stroke="#3b8f68" stroke-width="2"/><text x="46.0" y="461.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">声谱图</text><text x="20.0" y="501.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">整段变换一次：「先低后高」和「低高同时响」，频谱几乎一样</tspan><tspan x="20.0" dy="21">先分帧再逐帧变换：横轴时间、纵轴频率，时间回来了</tspan></text>
</svg>
