<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 612" width="420" height="612" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="时域流水线与频域流水线，后者多出加窗和傅里叶变换">
<rect width="420" height="612" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">两条流水线前两步一样，</tspan><tspan x="20.0" dy="25">频域那条多出加窗和变换</tspan></text><rect x="20.0" y="97.0" width="380.0" height="172.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="34.0" y="121.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">时域</text><rect x="34.0" y="129.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="44.0" y="147.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">ADC</text><line x1="48.0" y1="156.0" x2="48.0" y2="161.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="48.0,161.0 45.6,156.6 50.4,156.6" fill="#3b8f68"/><rect x="34.0" y="163.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="44.0" y="181.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">分帧</text><line x1="48.0" y1="190.0" x2="48.0" y2="195.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="48.0,195.0 45.6,190.6 50.4,190.6" fill="#3b8f68"/><rect x="34.0" y="197.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="44.0" y="215.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">逐帧计算</text><line x1="48.0" y1="224.0" x2="48.0" y2="229.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="48.0,229.0 45.6,224.6 50.4,224.6" fill="#3b8f68"/><rect x="34.0" y="231.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="44.0" y="249.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">聚合</text><rect x="20.0" y="285.0" width="380.0" height="240.0" rx="10" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="309.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">频域</text><rect x="34.0" y="317.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="44.0" y="335.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">ADC</text><line x1="48.0" y1="344.0" x2="48.0" y2="349.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="48.0,349.0 45.6,344.6 50.4,344.6" fill="#0878b9"/><rect x="34.0" y="351.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="44.0" y="369.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">分帧</text><line x1="48.0" y1="378.0" x2="48.0" y2="383.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="48.0,383.0 45.6,378.6 50.4,378.6" fill="#0878b9"/><rect x="34.0" y="385.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="44.0" y="403.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">加窗</text><text x="376.0" y="403.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">多出来的</text><line x1="48.0" y1="412.0" x2="48.0" y2="417.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="48.0,417.0 45.6,412.6 50.4,412.6" fill="#0878b9"/><rect x="34.0" y="419.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="44.0" y="437.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">傅里叶变换</text><text x="376.0" y="437.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">多出来的</text><line x1="48.0" y1="446.0" x2="48.0" y2="451.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="48.0,451.0 45.6,446.6 50.4,446.6" fill="#0878b9"/><rect x="34.0" y="453.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="44.0" y="471.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">逐帧计算</text><line x1="48.0" y1="480.0" x2="48.0" y2="485.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="48.0,485.0 45.6,480.6 50.4,480.6" fill="#0878b9"/><rect x="34.0" y="487.0" width="352.0" height="26.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="44.0" y="505.0" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">聚合</text><text x="20.0" y="545.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">加窗是为了解决频谱泄漏；加窗又把每帧两端</tspan><tspan x="20.0" dy="21">消掉了，所以帧还必须重叠。每一步都是被</tspan><tspan x="20.0" dy="21">上一步逼出来的，没有一步是装饰。</tspan></text>
</svg>
