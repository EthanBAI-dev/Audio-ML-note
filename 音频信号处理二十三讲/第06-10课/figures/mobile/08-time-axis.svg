<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 337" width="420" height="337" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="帧起点与帧中心两种时间标法相差半个帧长">
<rect width="420" height="337" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">这个点该标在帧的开头，</tspan><tspan x="20.0" dy="25">还是帧的中间</tspan></text><rect x="20.0" y="95.0" width="150.0" height="34.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="28.0" y="116.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">第 1 帧</text><rect x="95.0" y="101.0" width="150.0" height="34.0" rx="5" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.8"/><text x="103.0" y="122.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">第 2 帧</text><rect x="170.0" y="107.0" width="150.0" height="34.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="178.0" y="128.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">第 3 帧</text><line x1="20.0" y1="197.0" x2="400.0" y2="197.0" stroke="#d7dfe6" stroke-width="1.6" stroke-linecap="round"/><circle cx="95.0" cy="197.0" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="95.0" y="219.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">标在帧开头</text><circle cx="170.0" cy="197.0" r="5" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="170.0" y="219.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">标在帧中心</text><line x1="95.0" y1="181.0" x2="170.0" y2="181.0" stroke="#1f2933" stroke-width="1.8" stroke-linecap="round"/><polygon points="170.0,181.0 163.9,184.4 163.9,177.6" fill="#1f2933"/><text x="132.5" y="173.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">差 23.22 ms</text><text x="20.0" y="249.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">这一帧覆盖 46.4 ms，算出的数概括的是</tspan><tspan x="20.0" dy="21">整段 46.4 ms，不是开头那一瞬间。标在</tspan><tspan x="20.0" dy="21">帧开头，整条包络就早了 23.22 ms——</tspan><tspan x="20.0" dy="21">和波形叠在一起画时，包络会抢在前面。</tspan></text>
</svg>
