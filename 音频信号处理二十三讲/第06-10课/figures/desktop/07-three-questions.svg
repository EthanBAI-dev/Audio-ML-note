<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 238" width="880" height="238" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="振幅包络、均方根、过零率各回答一个问题">
<rect width="880" height="238" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">同一段小片段，三种特征各问一个不同的问题</text><rect x="30.0" y="66.0" width="253.3" height="92.0" rx="9" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.6"/><text x="156.7" y="96.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="middle">振幅包络 AE</text><text x="156.7" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="156.7" dy="0">这一小段里</tspan><tspan x="156.7" dy="19">最高峰有多高</tspan></text><line x1="288.3" y1="112.0" x2="308.3" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="308.3,112.0 302.2,115.4 302.2,108.6" fill="#5b6673"/><text x="298.3" y="178.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">只看一个数</text><rect x="313.3" y="66.0" width="253.3" height="92.0" rx="9" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="440.0" y="96.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="middle">均方根 RMS</text><text x="440.0" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="440.0" dy="0">这一小段</tspan><tspan x="440.0" dy="19">整体有多强</tspan></text><line x1="571.7" y1="112.0" x2="591.7" y2="112.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="591.7,112.0 585.5,115.4 585.5,108.6" fill="#5b6673"/><text x="581.7" y="178.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">全部数一起算</text><rect x="596.7" y="66.0" width="253.3" height="92.0" rx="9" fill="#faf4e6" stroke="#a5761a" stroke-width="1.6"/><text x="723.3" y="96.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="middle">过零率 ZCR</text><text x="723.3" y="120.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle"><tspan x="723.3" dy="0">波形穿过中线</tspan><tspan x="723.3" dy="19">有多频繁</tspan></text><text x="30.0" y="216.0" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="start">三个答案都在，才知道是「短促一下」还是「一直很响」</text>
</svg>
