<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="880" height="274" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="帧起点与帧中心两种时间标法相差半个帧长">
<rect width="880" height="274" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">这个点该标在帧的开头，还是帧的中间</text><rect x="30.0" y="74.0" width="210.0" height="34.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="38.0" y="95.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">第 1 帧</text><rect x="135.0" y="80.0" width="210.0" height="34.0" rx="5" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.8"/><text x="143.0" y="101.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">第 2 帧</text><rect x="240.0" y="86.0" width="210.0" height="34.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="248.0" y="107.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">第 3 帧</text><line x1="30.0" y1="176.0" x2="850.0" y2="176.0" stroke="#d7dfe6" stroke-width="1.6" stroke-linecap="round"/><circle cx="135.0" cy="176.0" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="135.0" y="198.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">标在帧开头</text><circle cx="240.0" cy="176.0" r="5" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="240.0" y="198.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">标在帧中心</text><line x1="135.0" y1="160.0" x2="240.0" y2="160.0" stroke="#1f2933" stroke-width="1.8" stroke-linecap="round"/><polygon points="240.0,160.0 233.9,163.4 233.9,156.6" fill="#1f2933"/><text x="187.5" y="152.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">差 23.22 ms</text><text x="30.0" y="228.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">这一帧覆盖 46.4 ms 的声音，算出来的那个数概括的是整段 46.4 ms，不是它开头那一瞬间。</tspan><tspan x="30.0" dy="21">标在帧开头，整条包络就比真实事件早了 23.22 ms；拿它去和波形对齐画图，会看到包络总是抢在前面。</tspan></text>
</svg>
