 font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="end">理论值 1.000980</text><text x="30.0" y="304.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">比值不抖——它是一个确定的常数，正好等于 K/(K−1) = 1024/1023 = 1.000978。</tspan><tspan x="30.0" dy="21">librosa 除以帧长 K，本课程除以相邻对的个数 K−1。两个都对，只是口径不同。</tspan><tspan x="30.0" dy="21">差 0.1% 看着可以忽略，但两批不同口径的数字混进同一张表就不再可比，而且不会报错。</tspan></text>
