<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="时域流水线与频域流水线，后者多出加窗和傅里叶变换">
<rect width="880" height="342" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">两条流水线前两步一样，频域那条多出加窗和变换</text><rect x="30.0" y="76.0" width="820.0" height="92.0" rx="10" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.6"/><text x="44.0" y="100.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">时域</text><rect x="44.0" y="112.0" width="187.5" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="137.8" y="132.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">ADC</text><line x1="233.5" y1="128.0" x2="242.5" y2="128.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="242.5,128.0 236.4,131.4 236.4,124.6" fill="#3b8f68"/><rect x="245.5" y="112.0" width="187.5" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="339.3" y="132.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">分帧</text><line x1="435.0" y1="128.0" x2="444.0" y2="128.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="444.0,128.0 437.9,131.4 437.9,124.6" fill="#3b8f68"/><rect x="447.0" y="112.0" width="187.5" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="540.8" y="132.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">逐帧计算</text><line x1="636.5" y1="128.0" x2="645.5" y2="128.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><polygon points="645.5,128.0 639.4,131.4 639.4,124.6" fill="#3b8f68"/><rect x="648.5" y="112.0" width="187.5" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="742.3" y="132.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">聚合</text><rect x="30.0" y="184.0" width="820.0" height="92.0" rx="10" fill="#eaf4fb" stroke="#0878b9" stroke-width="1.6"/><text x="44.0" y="208.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="start">频域</text><rect x="44.0" y="220.0" width="120.3" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="104.2" y="240.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">ADC</text><line x1="166.3" y1="236.0" x2="175.3" y2="236.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="175.3,236.0 169.2,239.4 169.2,232.6" fill="#0878b9"/><rect x="178.3" y="220.0" width="120.3" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="238.5" y="240.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">分帧</text><line x1="300.7" y1="236.0" x2="309.7" y2="236.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="309.7,236.0 303.5,239.4 303.5,232.6" fill="#0878b9"/><rect x="312.7" y="220.0" width="120.3" height="32.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="372.8" y="240.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">加窗</text><text x="372.8" y="268.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">多出来的</text><line x1="435.0" y1="236.0" x2="444.0" y2="236.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="444.0,236.0 437.9,239.4 437.9,232.6" fill="#0878b9"/><rect x="447.0" y="220.0" width="120.3" height="32.0" rx="6" fill="#fff" stroke="#c65a3d" stroke-width="2"/><text x="507.2" y="240.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">傅里叶变换</text><text x="507.2" y="268.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="middle">多出来的</text><line x1="569.3" y1="236.0" x2="578.3" y2="236.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="578.3,236.0 572.2,239.4 572.2,232.6" fill="#0878b9"/><rect x="581.3" y="220.0" width="120.3" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="641.5" y="240.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">逐帧计算</text><line x1="703.7" y1="236.0" x2="712.7" y2="236.0" stroke="#0878b9" stroke-width="1.8" stroke-linecap="round"/><polygon points="712.7,236.0 706.5,239.4 706.5,232.6" fill="#0878b9"/><rect x="715.7" y="220.0" width="120.3" height="32.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="775.8" y="240.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle">聚合</text><text x="30.0" y="296.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">加窗是为了解决频谱泄漏；而加窗又把每帧两端消掉了，所以帧还必须重叠。</tspan><tspan x="30.0" dy="21">每一步都是被上一步逼出来的，没有一步是可有可无的装饰。</tspan></text>
</svg>
