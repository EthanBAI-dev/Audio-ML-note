<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="平均绝对距离与均方根距离两种频谱带宽定义">
<rect width="880" height="420" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">同一个频谱有两种常见“宽度”：平均绝对距离与均方根距离</text><rect x="64.0" y="80.0" width="776.0" height="180.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><polyline points="64.0,260.0 193.3,219.1 322.7,96.4 452.0,219.1 581.3,260.0 710.7,260.0 840.0,260.0" fill="none" stroke="#0878b9" stroke-width="2.2" stroke-linejoin="round"/><circle cx="64.0" cy="260.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="193.3" cy="219.1" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="322.7" cy="96.4" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="452.0" cy="219.1" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="581.3" cy="260.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="710.7" cy="260.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="840.0" cy="260.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="322.7" y1="84.0" x2="322.7" y2="256.0" stroke="#a5761a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="322.7" y="100.0" font-size="14" font-weight="700" fill="#a5761a" text-anchor="middle">质心 1000 Hz</text><text x="64.0" y="280.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0</text><text x="452.0" y="280.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1.5k</text><text x="840.0" y="280.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">3k Hz</text><rect x="30.0" y="304.0" width="401.0" height="76.0" rx="9" fill="#fff" stroke="#c65a3d" stroke-width="1.4"/><text x="42.0" y="328.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">p = 1　平均绝对距离</text><text x="42.0" y="358.0" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">166.7 Hz</text><rect x="449.0" y="304.0" width="401.0" height="76.0" rx="9" fill="#fff" stroke="#3b8f68" stroke-width="1.4"/><text x="461.0" y="328.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">p = 2　均方根距离（库默认）</text><text x="461.0" y="358.0" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">288.7 Hz</text><text x="30.0" y="398.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">两把尺都合理，但结果不能混用；本课用 p=2 对齐库函数。</text>
</svg>
