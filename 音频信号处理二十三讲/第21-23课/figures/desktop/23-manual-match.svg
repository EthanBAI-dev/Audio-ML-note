<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 324" width="880" height="324" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="手写频谱质心和带宽与库函数的最大差">
<rect width="880" height="324" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">手写公式与库函数逐帧核对，误差不到十万分之一赫兹</text><rect x="30.0" y="80.0" width="820.0" height="76.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.4"/><text x="44.0" y="106.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="start">频谱质心</text><text x="44.0" y="136.0" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">三段录音的最大绝对差：1.917e-5 Hz</text><rect x="30.0" y="172.0" width="820.0" height="76.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.4"/><text x="44.0" y="198.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">p=2 频谱带宽</text><text x="44.0" y="228.0" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">三段录音的最大绝对差：1.156e-5 Hz</text><text x="30.0" y="268.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">公式、幅度权重、真实 Hz 频率轴和矩阵方向都一致。</tspan><tspan x="30.0" dy="21">剩下的差来自浮点数的计算顺序，不会改变任何图或结论。</tspan></text>
</svg>
