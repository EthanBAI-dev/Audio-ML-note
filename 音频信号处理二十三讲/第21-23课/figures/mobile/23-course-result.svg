<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 483" width="420" height="483" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="从统一录音到可核对音频特征的完整课程流程">
<rect width="420" height="483" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">课程终点：把录音变成</tspan><tspan x="20.0" dy="25">能比较、能检查、能解释的数字</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">统一录音条件</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">采样率、声道、长度</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">切成短帧</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">保留时间变化</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">选择表示</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">时域、频谱、梅尔、MFCC</text><line x1="46.0" y1="291.0" x2="46.0" y2="305.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,305.0 43.1,299.7 48.9,299.7" fill="#5b6673"/><rect x="20.0" y="309.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.6"/><text x="34.0" y="333.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">提取特征</text><text x="34.0" y="353.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">每帧少量数字</text><line x1="46.0" y1="365.0" x2="46.0" y2="379.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,379.0 43.1,373.7 48.9,373.7" fill="#5b6673"/><rect x="20.0" y="383.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.6"/><text x="34.0" y="407.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">核对与比较</text><text x="34.0" y="427.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">形状、单位、边界、误差</text><text x="20.0" y="461.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">完整参数、边界检查和输出都保留在项目代码中。</text>
</svg>
