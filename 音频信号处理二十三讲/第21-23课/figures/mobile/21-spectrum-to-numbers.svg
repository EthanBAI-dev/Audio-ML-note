<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 409" width="420" height="409" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="从波形到逐帧频域特征的计算流程">
<rect width="420" height="409" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">一帧频谱有上千格，</tspan><tspan x="20.0" dy="25">最后压成三个数</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">波形</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">一串样本</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">分帧加窗</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">只看几十毫秒</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">傅里叶变换</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">得到一列频谱</text><line x1="46.0" y1="291.0" x2="46.0" y2="305.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,305.0 43.1,299.7 48.9,299.7" fill="#5b6673"/><rect x="20.0" y="309.0" width="380.0" height="54.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.6"/><text x="34.0" y="333.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">逐帧统计</text><text x="34.0" y="353.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">BER、质心、带宽</text><text x="20.0" y="387.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">每一帧得到三个数；沿时间排起来，就是三条特征轨迹。</text>
</svg>
