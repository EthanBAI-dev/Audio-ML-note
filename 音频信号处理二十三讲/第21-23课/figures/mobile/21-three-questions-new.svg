<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 788" width="420" height="788" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="带能量比、频谱质心和频谱带宽回答三个不同问题">
<rect width="420" height="788" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">同一列频谱，</tspan><tspan x="20.0" dy="25">可以问三个不同问题</tspan></text><rect x="20.0" y="95.0" width="380.0" height="204.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.4"/><text x="32.0" y="119.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">低、高两边各有多少？</text><rect x="44.0" y="137.0" width="344.0" height="94.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><polyline points="44.0,231.0 101.3,209.6 158.7,145.5 216.0,209.6 273.3,231.0 330.7,231.0 388.0,231.0" fill="none" stroke="#0878b9" stroke-width="2.2" stroke-linejoin="round"/><circle cx="44.0" cy="231.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="101.3" cy="209.6" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="158.7" cy="145.5" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="216.0" cy="209.6" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="273.3" cy="231.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="330.7" cy="231.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><circle cx="388.0" cy="231.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><text x="44.0" y="249.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0</text><text x="216.0" y="249.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1.5k</text><text x="388.0" y="249.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">3k Hz</text><text x="32.0" y="273.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="32.0" dy="0">BER = 17 / 1 = 17</tspan></text><rect x="20.0" y="315.0" width="380.0" height="204.0" rx="9" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.4"/><text x="32.0" y="339.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">频率重心在哪里？</text><rect x="44.0" y="357.0" width="344.0" height="94.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><polyline points="44.0,451.0 101.3,429.6 158.7,365.5 216.0,429.6 273.3,451.0 330.7,451.0 388.0,451.0" fill="none" stroke="#c65a3d" stroke-width="2.2" stroke-linejoin="round"/><circle cx="44.0" cy="451.0" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><circle cx="101.3" cy="429.6" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><circle cx="158.7" cy="365.5" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><circle cx="216.0" cy="429.6" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><circle cx="273.3" cy="451.0" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><circle cx="330.7" cy="451.0" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><circle cx="388.0" cy="451.0" r="3" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="44.0" y="469.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0</text><text x="216.0" y="469.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1.5k</text><text x="388.0" y="469.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">3k Hz</text><text x="32.0" y="493.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="32.0" dy="0">质心 = 1000 Hz</tspan></text><rect x="20.0" y="535.0" width="380.0" height="204.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.4"/><text x="32.0" y="559.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">围绕重心铺得多开？</text><rect x="44.0" y="577.0" width="344.0" height="94.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><polyline points="44.0,671.0 101.3,649.6 158.7,585.5 216.0,649.6 273.3,671.0 330.7,671.0 388.0,671.0" fill="none" stroke="#3b8f68" stroke-width="2.2" stroke-linejoin="round"/><circle cx="44.0" cy="671.0" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><circle cx="101.3" cy="649.6" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><circle cx="158.7" cy="585.5" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><circle cx="216.0" cy="649.6" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><circle cx="273.3" cy="671.0" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><circle cx="330.7" cy="671.0" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><circle cx="388.0" cy="671.0" r="3" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="44.0" y="689.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">0</text><text x="216.0" y="689.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">1.5k</text><text x="388.0" y="689.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">3k Hz</text><text x="32.0" y="713.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="32.0" dy="0">p=2 带宽 = 288.7 Hz</tspan></text><text x="20.0" y="759.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">BER 用功率；质心和带宽用幅度。公式相似，权重不能混。</tspan></text>
</svg>
