<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="手写频谱质心和带宽与库函数的最大差">
<rect width="420" height="320" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">手写公式与库函数逐帧核对，误差不到十万分之一赫兹</tspan></text><rect x="20.0" y="76.0" width="380.0" height="76.0" rx="9" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.4"/><text x="34.0" y="102.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">频谱质心</text><text x="34.0" y="132.0" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">三段录音的最大绝对差：1.917e-5 Hz</text><rect x="20.0" y="168.0" width="380.0" height="76.0" rx="9" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.4"/><text x="34.0" y="194.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">p=2 频谱带宽</text><text x="34.0" y="224.0" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">三段录音的最大绝对差：1.156e-5 Hz</text><text x="20.0" y="264.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">公式、幅度权重、真实 Hz 频率轴和矩阵方向都一致。</tspan><tspan x="20.0" dy="21">剩下的差来自浮点数的计算顺序，不会改变任何图或结论。</tspan></text>
</svg>
