<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 448" width="420" height="448" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="音乐属性的四个方面：节拍、音色、音高、和声">
<rect width="420" height="448" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">同一段音乐，</tspan><tspan x="20.0" dy="25">可以从四个方面分别描述</tspan></text><rect x="20.0" y="99.0" width="184.0" height="122.0" rx="8" fill="#fff" stroke="#0878b9" stroke-width="1.5"/><text x="32.0" y="123.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">节拍</text><text x="32.0" y="142.0" font-size="13.5" font-weight="400" fill="#5b6673" text-anchor="start">什么时候有一下，快慢如何</text><line x1="28.0" y1="181.0" x2="196.0" y2="181.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><line x1="41.4" y1="193.0" x2="41.4" y2="167.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="41.4" cy="167.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="78.4" y1="193.0" x2="78.4" y2="167.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="78.4" cy="167.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="115.4" y1="193.0" x2="115.4" y2="167.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="115.4" cy="167.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="152.3" y1="193.0" x2="152.3" y2="167.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="152.3" cy="167.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="185.9" y1="193.0" x2="185.9" y2="167.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="185.9" cy="167.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><rect x="216.0" y="99.0" width="184.0" height="122.0" rx="8" fill="#fff" stroke="#c65a3d" stroke-width="1.5"/><text x="228.0" y="123.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">音色</text><text x="228.0" y="142.0" font-size="13.5" font-weight="400" fill="#5b6673" text-anchor="start">听起来像什么乐器</text><line x1="230.0" y1="203.0" x2="230.0" y2="165.0" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="230.0" cy="165.0" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="256.0" y1="203.0" x2="256.0" y2="182.1" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="256.0" cy="182.1" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="282.0" y1="203.0" x2="282.0" y2="173.4" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="282.0" cy="173.4" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="308.0" y1="203.0" x2="308.0" y2="191.6" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="308.0" cy="191.6" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="334.0" y1="203.0" x2="334.0" y2="187.0" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="334.0" cy="187.0" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="360.0" y1="203.0" x2="360.0" y2="196.2" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="360.0" cy="196.2" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="224.0" y1="203.0" x2="392.0" y2="203.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="20.0" y="233.0" width="184.0" height="122.0" rx="8" fill="#fff" stroke="#3b8f68" stroke-width="1.5"/><text x="32.0" y="257.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">音高</text><text x="32.0" y="276.0" font-size="13.5" font-weight="400" fill="#5b6673" text-anchor="start">这个音有多高</text><polyline points="28.0,327.8 46.7,327.8 65.3,316.3 84.0,316.3 102.7,304.8 121.3,304.8 140.0,311.7 158.7,311.7 177.3,297.9 196.0,297.9" fill="none" stroke="#3b8f68" stroke-width="2.2" stroke-linejoin="round"/><rect x="216.0" y="233.0" width="184.0" height="122.0" rx="8" fill="#fff" stroke="#a5761a" stroke-width="1.5"/><text x="228.0" y="257.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">和声</text><text x="228.0" y="276.0" font-size="13.5" font-weight="400" fill="#5b6673" text-anchor="start">同时响的几个音什么关系</text><line x1="278.0" y1="300.0" x2="338.0" y2="300.0" stroke="#a5761a" stroke-width="2.2" stroke-linecap="round"/><circle cx="278.0" cy="300.0" r="3" fill="#a5761a" stroke="none" stroke-width="1"/><line x1="278.0" y1="315.0" x2="338.0" y2="315.0" stroke="#a5761a" stroke-width="2.2" stroke-linecap="round"/><circle cx="278.0" cy="315.0" r="3" fill="#a5761a" stroke="none" stroke-width="1"/><line x1="278.0" y1="330.0" x2="338.0" y2="330.0" stroke="#a5761a" stroke-width="2.2" stroke-linecap="round"/><circle cx="278.0" cy="330.0" r="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="20.0" y="377.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">四个方面互相独立：换个乐器演奏，音色变了，</tspan><tspan x="20.0" dy="21">节拍、音高、和声都没变。这一维决定往哪儿</tspan><tspan x="20.0" dy="21">找特征——古典和摇滚差在节拍和音色上。</tspan></text>
</svg>
