<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 595" width="420" height="595" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="人工音频特征与模型学习特征的组合">
<rect width="420" height="595" fill="#ffffff"/>
<text x="22" y="30" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="22" dy="0">音频特征的两种来源</tspan><tspan x="22" dy="25">可以组合，不必二选一</tspan></text><rect x="24" y="77" width="372" height="158" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="44" y="113" font-size="17.5" font-weight="700" fill="#0878b9" text-anchor="start">人工规则计算</text><text x="44" y="149" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="44" dy="0">含义清楚、容易排查</tspan><tspan x="44" dy="24">样本少也能使用</tspan><tspan x="44" dy="24">风险：规则可能漏掉关键线索</tspan></text><rect x="306" y="101" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="319" y="145" width="10" height="14" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="336" y="129" width="10" height="30" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="353" y="113" width="10" height="46" rx="2" fill="#0878b9" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="24" y="285" width="372" height="158" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="44" y="321" font-size="17.5" font-weight="700" fill="#0878b9" text-anchor="start">模型从数据中学习</text><text x="44" y="357" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="44" dy="0">能学习复杂关系</tspan><tspan x="44" dy="24">但更依赖数据和算力</tspan><tspan x="44" dy="24">风险：可能学到无关差异</tspan></text><rect x="306" y="309" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><line x1="319.0" y1="328.0" x2="342.0" y2="324.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="319.0" y1="328.0" x2="342.0" y2="342.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="319.0" y1="328.0" x2="342.0" y2="360.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="319.0" y1="356.0" x2="342.0" y2="324.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="319.0" y1="356.0" x2="342.0" y2="342.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="319.0" y1="356.0" x2="342.0" y2="360.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="342.0" y1="324.0" x2="365.0" y2="342.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="342.0" y1="342.0" x2="365.0" y2="342.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="342.0" y1="360.0" x2="365.0" y2="342.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><circle cx="319" cy="328" r="4" fill="#d9ecf8" stroke="#0878b9" stroke-width="1"/><circle cx="319" cy="356" r="4" fill="#d9ecf8" stroke="#0878b9" stroke-width="1"/><circle cx="342" cy="324" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="342" cy="342" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="342" cy="360" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="365" cy="342" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><line x1="210.0" y1="243.0" x2="210.0" y2="277.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="210,277 206.8,270.8 213.2,270.8" fill="#c65a3d"/><rect x="24" y="469" width="372" height="82" rx="10" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="210" y="501" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="middle"><tspan x="210" dy="0">常见组合</tspan><tspan x="210" dy="25">前面用稳定规则，后面交给模型学习</tspan></text><text x="24" y="577" font-size="15" font-weight="400" fill="#647382" text-anchor="start">选择依据是任务证据和数据条件。</text>
</svg>
