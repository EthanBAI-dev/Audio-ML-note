<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">同样是让程序判断，</tspan><tspan x="20.0" dy="25">照片和录音的入口不一样</tspan></text><text x="20.0" y="107.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">照片</text><rect x="20.0" y="119.0" width="118.7" height="108.0" rx="8" fill="#eef4f8" stroke="#0878b9" stroke-width="1.5"/><text x="32.0" y="141.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">固定的颜色网格</text><text x="32.0" y="159.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">每个位置一个颜色数值</text><image href="/figures/01-05/photo/deep-learning-kitten.jpg" x="43.3" y="166" width="72" height="52" preserveAspectRatio="xMidYMid slice" clip-path="url(#cat-photo-mobile)"/><path d="M61.3 166v52M79.3 166v52M97.3 166v52M43.3 183.3h72M43.3 200.7h72" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".7"/><rect x="43.3" y="166" width="72" height="52" rx="5" fill="none" stroke="#0878b9" stroke-width="1"/><line x1="141.7" y1="173.0" x2="147.7" y2="173.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="147.7,173.0 141.5,176.4 141.5,169.6" fill="#5b6673"/><rect x="150.7" y="119.0" width="118.7" height="108.0" rx="8" fill="#fff" stroke="#0878b9" stroke-width="1.5"/><text x="162.7" y="141.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">判断程序</text><text x="162.7" y="159.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">从示例里学会区别</text><rect x="184.0" y="181.0" width="52.0" height="8.0" rx="4" fill="#0878b9" stroke="none" stroke-width="1"/><rect x="184.0" y="193.0" width="52.0" height="8.0" rx="4" fill="#d6e6f1" stroke="none" stroke-width="1"/><rect x="184.0" y="205.0" width="52.0" height="8.0" rx="4" fill="#d6e6f1" stroke="none" stroke-width="1"/><line x1="272.3" y1="173.0" x2="278.3" y2="173.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="278.3,173.0 272.2,176.4