329.0 304.9,332.4 304.9,325.6" fill="#5b6673"/><rect x="314.0" y="275.0" width="86.0" height="108.0" rx="8" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.5"/><text x="326.0" y="297.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">答案</text><text x="357.0" y="341.0" font-size="22" font-weight="700" fill="#3b8f68" text-anchor="middle">汽车</text><text x="20.0" y="405.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">两行只差一格：录音多出「整理声音证据」，</tspan><tspan x="20.0" dy="21">这一步就是这 23 课的全部内容。照片一进来</tspan><tspan x="20.0" dy="21">就是排好的网格，缩到同样宽高就能逐格比；</tspan><tspan x="20.0" dy="21">录音是一长串数，长度、每秒记录次数、音量</tspan><tspan x="20.0" dy="21">都可能不同，不先整理就没法比。</tspan></text>
