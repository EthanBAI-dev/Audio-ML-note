<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 548" width="420" height="548" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="音频特征的五个分类维度">
<rect width="420" height="548" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">一个音频特征，</tspan><tspan x="20.0" dy="25">在这五条上各占一个位置</tspan></text><rect x="20.0" y="97.0" width="380.0" height="66.0" rx="8" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.5"/><text x="34.0" y="118.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">抽象层级</text><text x="34.0" y="137.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">离原始测量有多远</text><rect x="34.0" y="141.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#0878b9" stroke-width="1"/><text x="57.0" y="156.0" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">低层</text><rect x="88.0" y="141.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#0878b9" stroke-width="1"/><text x="111.0" y="156.0" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">中层</text><rect x="142.0" y="141.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#0878b9" stroke-width="1"/><text x="165.0" y="156.0" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">高层</text><rect x="20.0" y="171.0" width="380.0" height="66.0" rx="8" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.5"/><text x="34.0" y="192.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">时间范围</text><text x="34.0" y="211.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">一次概括多长</text><rect x="34.0" y="215.0" width="130.0" height="22.0" rx="11" fill="#fff" stroke="#3b8f68" stroke-width="1"/><text x="99.0" y="230.0" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">瞬时 ~50ms</text><rect x="172.0" y="215.0" width="102.0" height="22.0" rx="11" fill="#fff" stroke="#3b8f68" stroke-width="1"/><text x="223.0" y="230.0" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">片段级 几秒</text><rect x="282.0" y="215.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#3b8f68" stroke-width="1"/><text x="305.0" y="230.0" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="middle">全局</text><rect x="20.0" y="245.0" width="380.0" height="66.0" rx="8" fill="#f5f8fa" stroke="#a5761a" stroke-width="1.5"/><text x="34.0" y="266.0" font-size="16" font-weight="700" fill="#a5761a" text-anchor="start">音乐属性</text><text x="34.0" y="285.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">描述音乐哪个方面</text><rect x="34.0" y="289.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#a5761a" stroke-width="1"/><text x="57.0" y="304.0" font-size="14" font-weight="400" fill="#a5761a" text-anchor="middle">节拍</text><rect x="88.0" y="289.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#a5761a" stroke-width="1"/><text x="111.0" y="304.0" font-size="14" font-weight="400" fill="#a5761a" text-anchor="middle">音色</text><rect x="142.0" y="289.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#a5761a" stroke-width="1"/><text x="165.0" y="304.0" font-size="14" font-weight="400" fill="#a5761a" text-anchor="middle">音高</text><rect x="196.0" y="289.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#a5761a" stroke-width="1"/><text x="219.0" y="304.0" font-size="14" font-weight="400" fill="#a5761a" text-anchor="middle">和声</text><rect x="20.0" y="319.0" width="380.0" height="66.0" rx="8" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.5"/><text x="34.0" y="340.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">信号域</text><text x="34.0" y="359.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">从哪个角度观察</text><rect x="34.0" y="363.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#c65a3d" stroke-width="1"/><text x="57.0" y="378.0" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="middle">时域</text><rect x="88.0" y="363.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#c65a3d" stroke-width="1"/><text x="111.0" y="378.0" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="middle">频域</text><rect x="142.0" y="363.0" width="46.0" height="22.0" rx="11" fill="#fff" stroke="#c65a3d" stroke-width="1"/><text x="165.0" y="378.0" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="middle">时频</text><rect x="20.0" y="393.0" width="380.0" height="66.0" rx="8" fill="#f5f8fa" stroke="#5b6673" stroke-width="1.5"/><text x="34.0" y="414.0" font-size="16" font-weight="700" fill="#5b6673" text-anchor="start">算法来源</text><text x="34.0" y="433.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">人算还是程序学</text><rect x="34.0" y="437.0" width="74.0" height="22.0" rx="11" fill="#fff" stroke="#5b6673" stroke-width="1"/><text x="71.0" y="452.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">按公式算</text><rect x="116.0" y="437.0" width="88.0" height="22.0" rx="11" fill="#fff" stroke="#5b6673" stroke-width="1"/><text x="160.0" y="452.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">从数据里学</text><text x="20.0" y="477.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">五条互相独立，换一条不影响另外四条。</tspan><tspan x="20.0" dy="21">看到陌生的特征名字，在这五条上各定一次位；</tspan><tspan x="20.0" dy="21">面对新任务，按这五个问题依次问一遍。</tspan></text>
</svg>
