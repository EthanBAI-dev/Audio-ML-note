<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 393" width="420" height="393" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="抗混叠滤波、采样、量化三步的先后顺序，以及顺序颠倒的后果">
<rect width="420" height="393" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">连续电压变成数字：</tspan><tspan x="20.0" dy="25">三步，顺序不能换</tspan></text><rect x="20.0" y="85.0" width="380.0" height="52.0" rx="9" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.8"/><text x="34.0" y="109.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">① 抗混叠滤波</text><text x="34.0" y="128.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">先砍掉记不清楚的高频</text><line x1="46.0" y1="139.0" x2="46.0" y2="151.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,151.0 43.1,145.7 48.9,145.7" fill="#5b6673"/><rect x="20.0" y="155.0" width="380.0" height="52.0" rx="9" fill="#edf6fc" stroke="#0878b9" stroke-width="1.8"/><text x="34.0" y="179.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">② 采样</text><text x="34.0" y="198.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">每 1/fs 秒量一次</text><line x1="46.0" y1="209.0" x2="46.0" y2="221.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,221.0 43.1,215.7 48.9,215.7" fill="#5b6673"/><rect x="20.0" y="225.0" width="380.0" height="52.0" rx="9" fill="#edf6fc" stroke="#0878b9" stroke-width="1.8"/><text x="34.0" y="249.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">③ 量化</text><text x="34.0" y="268.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">靠到最近的档位</text><rect x="20.0" y="303.0" width="380.0" height="76.0" rx="9" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.6"/><text x="36.0" y="329.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">× 先采样，再滤波</text><text x="36.0" y="351.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="36.0" dy="0">假的低频这时候已经和真的一模一样，</tspan><tspan x="36.0" dy="19">再滤也分不开。</tspan></text>
</svg>
