<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 375" width="420" height="375" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="声功率描述声源，声强描述某一个位置">
<rect width="420" height="375" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">声功率只有一个数，</tspan><tspan x="20.0" dy="25">声强每个位置一个数</tspan></text><rect x="20.0" y="95.0" width="380.0" height="168.0" rx="8" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><circle cx="86.0" cy="179.0" r="9" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="86.0" y="159.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">声源</text><text x="86.0" y="251.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">声功率 1 个数</text><circle cx="86.0" cy="179.0" r="109.4" fill="none" stroke="#d7dfe6" stroke-width="1.2"/><circle cx="195.4" cy="179.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="195.4" y="167.0" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">位置 1</text><text x="195.4" y="201.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">100%</text><circle cx="86.0" cy="179.0" r="190.1" fill="none" stroke="#d7dfe6" stroke-width="1.2"/><circle cx="276.1" cy="179.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="276.1" y="167.0" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">位置 2</text><text x="276.1" y="201.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">33%</text><circle cx="86.0" cy="179.0" r="273.6" fill="none" stroke="#d7dfe6" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="359.6" cy="179.0" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="359.6" y="167.0" font-size="14" font-weight="400" fill="#0878b9" text-anchor="middle">位置 3</text><text x="359.6" y="201.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">16%</text><text x="20.0" y="283.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">蓝点是三个位置，百分比是每平方米分到</tspan><tspan x="20.0" dy="21">的能量（位置 1 记作 100%）。声源没变，</tspan><tspan x="20.0" dy="21">声功率没变；变的是传到这儿还剩多少——</tspan><tspan x="20.0" dy="21">这才是麦克风量到的东西。</tspan></text>
</svg>
