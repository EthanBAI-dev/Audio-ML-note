<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 363" width="880" height="363" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="从听阈到痛阈的声强阶梯与对应的分贝值">
<rect width="880" height="363" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">声强从听阈到痛阈差 13 个数量级，写成分贝只有 0 到 130</text><rect x="30.0" y="76.0" width="820.0" height="29.0" rx="6" fill="#eef4f8" stroke="#0878b9" stroke-width="1.5"/><text x="42.0" y="94.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">刚能听见</text><text x="302.4" y="94.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">10^-12 W/m²</text><text x="838.0" y="94.0" font-size="15.5" font-weight="700" fill="#0878b9" text-anchor="end">0 dB</text><rect x="30.0" y="110.0" width="820.0" height="29.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="42.0" y="128.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">安静的房间</text><text x="302.4" y="128.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">10^-10 W/m²</text><text x="838.0" y="128.0" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="end">20 dB</text><rect x="30.0" y="144.0" width="820.0" height="29.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="42.0" y="162.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">正常交谈</text><text x="302.4" y="162.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">10^-6 W/m²</text><text x="838.0" y="162.0" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="end">60 dB</text><rect x="30.0" y="178.0" width="820.0" height="29.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="42.0" y="196.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">繁忙街道</text><text x="302.4" y="196.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">10^-4 W/m²</text><text x="838.0" y="196.0" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="end">80 dB</text><rect x="30.0" y="212.0" width="820.0" height="29.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="42.0" y="230.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">摇滚现场</text><text x="302.4" y="230.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">10^-1 W/m²</text><text x="838.0" y="230.0" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="end">110 dB</text><rect x="30.0" y="246.0" width="820.0" height="29.0" rx="6" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.5"/><text x="42.0" y="264.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">开始感到疼</text><text x="302.4" y="264.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">10^1 W/m²</text><text x="838.0" y="264.0" font-size="15.5" font-weight="700" fill="#c65a3d" text-anchor="end">130 dB</text><text x="30.0" y="292.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">左边每往下一格是十倍，一路乘了 13 次；右边只从 0 走到 130。</tspan><tspan x="30.0" dy="21">两条性质记住：声强每变十倍正好多 10 dB；每翻一倍多约 3 dB（因为 10·log₁₀2 = 3.01）。</tspan><tspan x="30.0" dy="21">听阈本身是 0 dB——0 dB 不是没有声音，是正好等于参考值。</tspan></text>
</svg>
