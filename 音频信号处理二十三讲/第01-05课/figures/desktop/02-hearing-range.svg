<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322" width="880" height="322" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="人耳听觉范围 20 Hz 到 20 kHz，以及常见声音落在哪里">
<rect width="880" height="322" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">人耳能听到的，是每秒 20 次到 20000 次之间的振动</text><rect x="30.0" y="84.0" width="121.0" height="34.0" rx="5" fill="#f0f2f4" stroke="#d7dfe6" stroke-width="1"/><rect x="754.1" y="84.0" width="95.9" height="34.0" rx="5" fill="#f0f2f4" stroke="#d7dfe6" stroke-width="1"/><rect x="151.0" y="84.0" width="603.1" height="34.0" rx="5" fill="#e8f3ea" stroke="#3b8f68" stroke-width="1.8"/><text x="452.6" y="106.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="middle">听得见</text><text x="38.0" y="106.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">次声</text><text x="842.0" y="106.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">超声</text><line x1="151.0" y1="74.0" x2="151.0" y2="128.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><text x="151.0" y="68.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="middle">20 Hz</text><line x1="754.1" y1="74.0" x2="754.1" y2="128.0" stroke="#3b8f68" stroke-width="1.8" stroke-linecap="round"/><text x="754.1" y="68.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="middle">20 kHz</text><line x1="90.5" y1="140.0" x2="90.5" y2="146.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="90.5" y="160.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">10</text><line x1="291.5" y1="140.0" x2="291.5" y2="146.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="291.5" y="160.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">100</text><line x1="492.6" y1="140.0" x2="492.6" y2="146.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="492.6" y="160.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">1k</text><line x1="693.6" y1="140.0" x2="693.6" y2="146.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><text x="693.6" y="160.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">10k</text><text x="30.0" y="160.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">每格 ×10</text><circle cx="35.0" cy="170.0" r="3.5" fill="#5b6673" stroke="none" stroke-width="1"/><text x="46.0" y="174.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">次声　约 8 Hz</text><circle cx="35.0" cy="191.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="46.0" y="195.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">最低的钢琴音　约 27.5 Hz</text><circle cx="35.0" cy="212.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="46.0" y="216.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">男声基频　约 110 Hz</text><circle cx="35.0" cy="233.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="46.0" y="237.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">女声基频　约 220 Hz</text><circle cx="445.0" cy="170.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="456.0" y="174.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">A4 标准音　约 440 Hz</text><circle cx="445.0" cy="191.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="456.0" y="195.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">最高的钢琴音　约 4186 Hz</text><circle cx="445.0" cy="212.0" r="3.5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="456.0" y="216.0" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">镲片的亮部　约 12 kHz</text><circle cx="445.0" cy="233.0" r="3.5" fill="#5b6673" stroke="none" stroke-width="1"/><text x="456.0" y="237.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">超声　约 40 kHz</text><text x="30.0" y="272.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">这个上限随年龄下降：年轻人可能听到 18 kHz 以上，中年之后常降到 15 kHz 左右。</tspan><tspan x="30.0" dy="21">第 04 课决定「每秒该记录多少次」时，用的就是 20 kHz 这条上限。</tspan></text>
</svg>
