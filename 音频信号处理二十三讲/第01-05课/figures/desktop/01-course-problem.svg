<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">同样是让程序判断，照片和录音的入口不一样</text><text x="30.0" y="86.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="start">照片</text><rect x="30.0" y="98.0" width="261.3" height="120.0" rx="8" fill="#eef4f8" stroke="#0878b9" stroke-width="1.5"/><text x="42.0" y="120.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">固定的颜色网格</text><text x="42.0" y="138.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">每个位置一个颜色数值</text><image href="/figures/01-05/photo/deep-learning-kitten.jpg" x="113.7" y="149" width="94" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#cat-photo)"/><path d="M137.2 149v60M160.7 149v60M184.2 149v60M113.7 169h94M113.7 189h94" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/><rect x="113.7" y="149" width="94" height="60" rx="6" fill="none" stroke="#0878b9" stroke-width="1"/><line x1="294.3" y1="158.0" x2="306.3" y2="158.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="306.3,158.0 300.2,161.4 300.2,154.6" fill="#5b6673"/><rect x="309.3" y="98.0" width="261.3" height="120.0" rx="8" fill="#fff" stroke="#0878b9" stroke-width="1.5"/><text x="321.3" y="120.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">判断程序</text><text x="321.3" y="138.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">从示例里学会区别</text><rect x="414.0" y="172.0" width="52.0" height="8.0" rx="4" fill="#0878b9" stroke="none" stroke-width="1"/><rect x="414.0" y="184.0" width="52.0" height="8.0" rx="4" fill="#d6e6f1" stroke="none" stroke-width="1"/><rect x="414.0" y="196.0" width="52.0" height="8.0" rx="4" fill="#d6e6f1" stroke="none" stroke-width="1"/><line x1="573.7" y1="158.0" x2="585.7" y2="158.0" stroke="#5b6673" stroke-width="1.8" stroke-linecap="round"/><polygon points="585.7,158.0 579.5,161.4 579.5,154.6" fill="#5b6673"/><rect x="588.7" y="98.0" width="261.3" height="120.0" rx="8" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.5"/><text x="600.7" y="120.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">答案</text><text x="719.3" y="170.0" font-size="30" font-weight="700" fill="#3b8f68" text-anchor="middle">猫</text><text x="30.0" y="258.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">录音</text><rect x="30.0" y="270.0" width="191.5" height="120.0" rx="8" fill="#fbf0ec" stroke="#c65a3d" stroke-width="1.5"/><text x="42.0" y="292.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">一长串数</text><text x="42.0" y="310.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">按时间先后排列</text><rect x="40.0" y="340.0" width="171.5" height="38.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="40.0" y1="359.0" x2="211.5" y2="359.0" stroke="#d7dfe6" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><polyline points="40.0,359.0 41.4,357.9 42.9,356.8 44.3,355.6 45.8,354.5 47.2,353.5 48.6,352.6 50.1,351.8 51.5,351.3 53.0,350.9 54.4,350.9 55.9,351.1 57.3,351.6 58.7,352.3 60.2,353.3 61.6,354.6 63.1,356.0 64.5,357.6 65.9,359.3 67.4,361.1 68.8,362.9 70.3,364.6 71.7,366.2 73.1,367.7 74.6,368.9 76.0,369.8 77.5,370.4 78.9,370.6 80.4,370.5 81.8,370.0 83.2,369.1 84.7,367.9 86.1,366.4 87.6,364.6 89.0,362.6 90.4,360.4 91.9,358.1 93.3,355.8 94.8,353.6 96.2,351.5 97.6,349.5 99.1,347.9 100.5,346.6 102.0,345.7 103.4,345.1 104.9,345.0 106.3,345.4 107.7,346.2 109.2,347.4 110.6,349.0 112.1,350.9 113.5,353.1 114.9,355.4 116.4,358.0 117.8,360.5 119.3,363.1 120.7,365.5 122.1,367.7 123.6,369.6 125.0,371.2 126.5,372.5 127.9,373.3 129.4,373.7 130.8,373.6 132.2,373.0 133.7,372.0 135.1,370.6 136.6,368.8 138.0,366.8 139.4,364.5 140.9,362.1 142.3,359.5 143.8,357.0 145.2,354.6 146.6,352.3 148.1,350.3 149.5,348.5 151.0,347.2 152.4,346.2 153.9,345.6 155.3,345.4 156.7,345.7 158.2,346.4 159.6,347.5 161.1,348.9 162.5,350.6 163.9,352.5 165.4,354.6 166.8,356.8 168.3,