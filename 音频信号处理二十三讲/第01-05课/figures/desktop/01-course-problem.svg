><polygon points="655.5,330.0 649.4,333.4 649.4,326.6" fill="#5b6673"/><rect x="658.5" y="270.0" width="191.5" height="120.0" rx="8" fill="#eef7f2" stroke="#3b8f68" stroke-width="1.5"/><text x="670.5" y="292.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">答案</text><text x="754.3" y="342.0" font-size="26" font-weight="700" fill="#3b8f68" text-anchor="middle">汽车</text><text x="30.0" y="412.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">两行的差别只有一格：录音多出「整理声音证据」这一步，而这一步就是这 23 课的全部内容。</tspan><tspan x="30.0" dy="21">照片一进来就是排好的网格，两张照片缩到同样宽高就能一个位置对一个位置地比；</tspan><tspan x="30.0" dy="21">录音一进来是一长串数，长度、每秒记录次数、录音音量都可能不同，不先整理就没法比。</tspan></text>
</svg>
