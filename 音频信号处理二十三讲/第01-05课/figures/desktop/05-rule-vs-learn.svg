<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 364" width="880" height="364" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="人工音频特征与模型学习特征的组合">
<rect width="880" height="364" fill="#ffffff"/>
<text x="34" y="34" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">音频特征的两种来源可以组合，不必二选一</text><rect x="34" y="54" width="376" height="158" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="54" y="90" font-size="18" font-weight="700" fill="#0878b9" text-anchor="start">人工规则计算</text><text x="54" y="126" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="54" dy="0">含义清楚、容易排查</tspan><tspan x="54" dy="24">样本少也能使用</tspan><tspan x="54" dy="24">风险：规则可能漏掉关键线索</tspan></text><rect x="320" y="78" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><rect x="333" y="122" width="10" height="14" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="350" y="106" width="10" height="30" rx="2" fill="#d9ecf8" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="367" y="90" width="10" height="46" rx="2" fill="#0878b9" stroke="#0878b9" stroke-width="1" opacity="1"/><rect x="470" y="54" width="376" height="158" rx="10" fill="#f7f9fb" stroke="#dce5ec" stroke-width="1" opacity="1"/><text x="490" y="90" font-size="18" font-weight="700" fill="#0878b9" text-anchor="start">模型从数据中学习</text><text x="490" y="126" font-size="15" font-weight="400" fill="#647382" text-anchor="start"><tspan x="490" dy="0">能学习复杂关系</tspan><tspan x="490" dy="24">但更依赖数据和算力</tspan><tspan x="490" dy="24">风险：可能学到无关差异</tspan></text><rect x="756" y="78" width="72" height="66" rx="8" fill="#ffffff" stroke="#dce5ec" stroke-width="1" opacity="1"/><line x1="769.0" y1="97.0" x2="792.0" y2="93.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="769.0" y1="97.0" x2="792.0" y2="111.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="769.0" y1="97.0" x2="792.0" y2="129.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="769.0" y1="125.0" x2="792.0" y2="93.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="769.0" y1="125.0" x2="792.0" y2="111.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="769.0" y1="125.0" x2="792.0" y2="129.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="792.0" y1="93.0" x2="815.0" y2="111.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="792.0" y1="111.0" x2="815.0" y2="111.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><line x1="792.0" y1="129.0" x2="815.0" y2="111.0" stroke="#aac5d7" stroke-width="1" stroke-linecap="round"/><circle cx="769" cy="97" r="4" fill="#d9ecf8" stroke="#0878b9" stroke-width="1"/><circle cx="769" cy="125" r="4" fill="#d9ecf8" stroke="#0878b9" stroke-width="1"/><circle cx="792" cy="93" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="792" cy="111" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="792" cy="129" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><circle cx="815" cy="111" r="4" fill="#0878b9" stroke="#0878b9" stroke-width="1"/><line x1="422.0" y1="133.0" x2="458.0" y2="133.0" stroke="#c65a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="458,133 451.8,136.2 451.8,129.8" fill="#c65a3d"/><rect x="34" y="238" width="812" height="82" rx="10" fill="#fff3ef" stroke="#efd0c6" stroke-width="1" opacity="1"/><text x="440" y="270" font-size="15" font-weight="700" fill="#c65a3d" text-anchor="middle"><tspan x="440" dy="0">常见组合</tspan><tspan x="440" dy="25">前面用稳定规则，后面交给模型学习</tspan></text><text x="34" y="346" font-size="15" font-weight="400" fill="#647382" text-anchor="start">选择依据是任务证据和数据条件。</text>
</svg>
