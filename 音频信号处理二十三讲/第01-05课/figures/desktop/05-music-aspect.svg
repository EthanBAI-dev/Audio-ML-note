<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 282" width="880" height="282" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="音乐属性的四个方面：节拍、音色、音高、和声">
<rect width="880" height="282" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">同一段音乐，可以从四个方面分别描述</text><rect x="30.0" y="78.0" width="196.0" height="132.0" rx="8" fill="#fff" stroke="#0878b9" stroke-width="1.5"/><text x="42.0" y="102.0" font-size="17" font-weight="700" fill="#0878b9" text-anchor="start">节拍</text><text x="42.0" y="121.0" font-size="12" font-weight="400" fill="#5b6673" text-anchor="start">什么时候有一下，快慢如何</text><line x1="38.0" y1="165.0" x2="218.0" y2="165.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><line x1="52.4" y1="177.0" x2="52.4" y2="151.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="52.4" cy="151.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="92.0" y1="177.0" x2="92.0" y2="151.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="92.0" cy="151.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="131.6" y1="177.0" x2="131.6" y2="151.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="131.6" cy="151.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="171.2" y1="177.0" x2="171.2" y2="151.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="171.2" cy="151.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="207.2" y1="177.0" x2="207.2" y2="151.0" stroke="#0878b9" stroke-width="2.4" stroke-linecap="round"/><circle cx="207.2" cy="151.0" r="3" fill="#0878b9" stroke="none" stroke-width="1"/><rect x="238.0" y="78.0" width="196.0" height="132.0" rx="8" fill="#fff" stroke="#c65a3d" stroke-width="1.5"/><text x="250.0" y="102.0" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">音色</text><text x="250.0" y="121.0" font-size="12" font-weight="400" fill="#5b6673" text-anchor="start">听起来像什么乐器</text><line x1="252.0" y1="192.0" x2="252.0" y2="144.0" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="252.0" cy="144.0" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="280.0" y1="192.0" x2="280.0" y2="165.6" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="280.0" cy="165.6" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="308.0" y1="192.0" x2="308.0" y2="154.6" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="308.0" cy="154.6" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="336.0" y1="192.0" x2="336.0" y2="177.6" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="336.0" cy="177.6" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="364.0" y1="192.0" x2="364.0" y2="171.8" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="364.0" cy="171.8" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="392.0" y1="192.0" x2="392.0" y2="183.4" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="392.0" cy="183.4" r="2.6" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="246.0" y1="192.0" x2="426.0" y2="192.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="446.0" y="78.0" width="196.0" height="132.0" rx="8" fill="#fff" stroke="#3b8f68" stroke-width="1.5"/><text x="458.0" y="102.0" font-size="17" font-weight="700" fill="#3b8f68" text-anchor="start">音高</text><text x="458.0" y="121.0" font-size="12" font-weight="400" fill="#5b6673" text-anchor="start">这个音有多高</text><polyline points="454.0,180.8 474.0,180.8 494.0,166.8 514.0,166.8 534.0,152.8 554.0,152.8 574.0,161.2 594.0,161.2 614.0,144.4 634.0,144.4" fill="none" stroke="#3b8f68" stroke-width="2.2" stroke-linejoin="round"/><rect x="654.0" y="78.0" width="196.0" height="132.0" rx="8" fill="#fff" stroke="#a5761a" stroke-width="1.5"/><text x="666.0" y="102.0" font-size="17" font-weight="700" fill="#a5761a" text-anchor="start">和声</text><text x="666.0" y="121.0" font-size="12" font-weight="400" fill="#5b6673" text-anchor="start">同时响的几个音什么关系</text><line x1="722.0" y1="150.0" x2="782.0" y2="150.0" stroke="#a5761a" stroke-width="2.2" stroke-linecap="round"/><circle cx="722.0" cy="150.0" r="3" fill="#a5761a" stroke="none" stroke-width="1"/><line x1="722.0" y1="165.0" x2="782.0" y2="165.0" stroke="#a5761a" stroke-width="2.2" stroke-linecap="round"/><circle cx="722.0" cy="165.0" r="3" fill="#a5761a" stroke="none" stroke-width="1"/><line x1="722.0" y1="180.0" x2="782.0" y2="180.0" stroke="#a5761a" stroke-width="2.2" stroke-linecap="round"/><circle cx="722.0" cy="180.0" r="3" fill="#a5761a" stroke="none" stroke-width="1"/><text x="30.0" y="232.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">四个方面互相独立。同一段音乐换个乐器演奏，音色变了，节拍、音高、和声都没变。</tspan><tspan x="30.0" dy="21">这一维决定往哪儿找特征：课程的三分类里，古典和摇滚差在节拍和音色上，不差在音高上。</tspan></text>
</svg>
