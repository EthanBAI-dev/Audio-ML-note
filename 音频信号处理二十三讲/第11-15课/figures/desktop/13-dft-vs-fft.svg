<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="直接离散傅里叶变换和快速傅里叶变换随样本数增长的实测耗时曲线">
<rect width="880" height="414" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">样本数每翻一倍，直接 DFT 和 FFT 的耗时怎样长</text><rect x="30.0" y="84.0" width="397.0" height="150.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="76.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">直接 DFT（毫秒）</text><polyline points="30.0,230.5 162.3,224.8 294.7,198.1 427.0,100.1" fill="none" stroke="#c65a3d" stroke-width="2.2" stroke-linejoin="round"/><circle cx="30.0" cy="230.5" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="30.0" y="222.5" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">0.15</text><circle cx="162.3" cy="224.8" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="162.3" y="216.8" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">0.41</text><circle cx="294.7" cy="198.1" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="294.7" y="190.1" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">1.61</text><circle cx="427.0" cy="100.1" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="427.0" y="92.1" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="middle">5.99</text><text x="30.0" y="252.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">64</text><text x="162.3" y="252.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">128</text><text x="294.7" y="252.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">256</text><text x="427.0" y="252.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">512</text><rect x="453.0" y="84.0" width="397.0" height="150.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><text x="453.0" y="76.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">NumPy FFT（毫秒）</text><polyline points="453.0,150.6 585.3,143.8 717.7,122.1 850.0,100.1" fill="none" stroke="#3b8f68" stroke-width="2.2" stroke-linejoin="round"/><circle cx="453.0" cy="150.6" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="453.0" y="142.6" font-size="12.5" font-weight="400" fill="#3b8f68" text-anchor="middle">0.0037</text><circle cx="585.3" cy="143.8" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="585.3" y="135.8" font-size="12.5" font-weight="400" fill="#3b8f68" text-anchor="middle">0.0040</text><circle cx="717.7" cy="122.1" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="717.7" y="114.1" font-size="12.5" font-weight="400" fill="#3b8f68" text-anchor="middle">0.0050</text><circle cx="850.0" cy="100.1" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="850.0" y="92.1" font-size="12.5" font-weight="400" fill="#3b8f68" text-anchor="middle">0.0060</text><text x="453.0" y="252.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">64</text><text x="585.3" y="252.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">128</text><text x="717.7" y="252.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">256</text><text x="850.0" y="252.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">512</text><rect x="30.0" y="286.0" width="820.0" height="58.0" rx="8" fill="#edf8f3" stroke="#3b8f68" stroke-width="1.5"/><text x="44.0" y="309.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">N=512 的本机实测</text><text x="44.0" y="333.0" font-size="19" font-weight="700" fill="#3b8f68" text-anchor="start">FFT 快约 998 倍</text><text x="836.0" y="325.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">两张图纵轴不同；比较增长形状，不比较线高</text><text x="30.0" y="362.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">直接照定义计算要做约 N² 次组合；FFT 利用不同频率之间重复出现的结构，</tspan><tspan x="30.0" dy="21">把增长压到约 N log₂N。具体毫秒数随机器变化，趋势不会因此反过来。</tspan></text>
</svg>
