<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="一个频率对应一个复数系数，模是幅度、角是相位">
<rect width="880" height="320" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">一个频率算出一个复数，模是幅度、角是相位</text><rect x="30.0" y="78.0" width="180.0" height="180.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="36.0" y1="168.0" x2="204.0" y2="168.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="120.0" y1="84.0" x2="120.0" y2="252.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="202.0" y="162.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="126.0" y="96.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><line x1="120.0" y1="168.0" x2="120.0" y2="111.7" stroke="#c65a3d" stroke-width="2.4" stroke-linecap="round"/><circle cx="120.0" cy="111.7" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="128.0" y="125.7" font-size="17" font-weight="700" fill="#c65a3d" text-anchor="start">c</text><rect x="236.0" y="92.0" width="614.0" height="34.0" rx="6" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.3"/><text x="246.0" y="114.0" font-size="12.5" font-weight="700" fill="#0878b9" text-anchor="start">实部 Re(c)</text><text x="444.8" y="114.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">0.0000</text><text x="840.0" y="114.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">余弦那支试探波的读数</text><rect x="236.0" y="132.0" width="614.0" height="34.0" rx="6" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.3"/><text x="246.0" y="154.0" font-size="12.5" font-weight="700" fill="#3b8f68" text-anchor="start">虚部 Im(c)</text><text x="444.8" y="154.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">1.0000</text><text x="840.0" y="154.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">正弦那支试探波的读数</text><rect x="236.0" y="172.0" width="614.0" height="34.0" rx="6" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.3"/><text x="246.0" y="194.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">模 |c|</text><text x="444.8" y="194.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">1.0000</text><text x="840.0" y="194.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">幅度：这个频率有多强</text><rect x="236.0" y="212.0" width="614.0" height="34.0" rx="6" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.3"/><text x="246.0" y="234.0" font-size="12.5" font-weight="700" fill="#c65a3d" text-anchor="start">角 ∠c</text><text x="444.8" y="234.0" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">1.5708 弧度</text><text x="840.0" y="234.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">相位：从哪里起步</text><text x="30.0" y="270.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">模和角不是从系数里「再算一次」得到的——它们就是同一个点的另一套坐标。</tspan><tspan x="30.0" dy="21">第 11 课已经验证过：模等于第 10 课量到的强度，角等于第 10 课量到的相位。</tspan></text>
</svg>
