<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="模为 1 时不同的角分别指向复平面的哪个方向">
<rect width="880" height="460" fill="#fff"/>
<text x="30.0" y="36.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">模都是 1，角是多少就指向哪儿</text><rect x="335.0" y="78.0" width="210.0" height="210.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="341.0" y1="183.0" x2="539.0" y2="183.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="440.0" y1="84.0" x2="440.0" y2="282.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="537.0" y="177.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="446.0" y="96.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><circle cx="440.0" cy="183.0" r="67.4" fill="none" stroke="#d7dfe6" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="440.0" y1="183.0" x2="487.7" y2="135.3" stroke="#0878b9" stroke-width="2.2" stroke-linecap="round"/><circle cx="487.7" cy="135.3" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="440.0" y1="183.0" x2="440.0" y2="115.6" stroke="#3b8f68" stroke-width="2.2" stroke-linecap="round"/><circle cx="440.0" cy="115.6" r="4.5" fill="#3b8f68" stroke="none" stroke-width="1"/><line x1="440.0" y1="183.0" x2="372.6" y2="183.0" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="372.6" cy="183.0" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="440.0" y1="183.0" x2="440.0" y2="250.4" stroke="#a5761a" stroke-width="2.2" stroke-linecap="round"/><circle cx="440.0" cy="250.4" r="4.5" fill="#a5761a" stroke="none" stroke-width="1"/><circle cx="35.0" cy="306.0" r="4" fill="#0878b9" stroke="none" stroke-width="1"/><text x="46.0" y="310.0" font-size="12.5" font-weight="400" fill="#0878b9" text-anchor="start">γ = π/4（45°）　→　+0.7071+0.7071i</text><circle cx="35.0" cy="328.0" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="46.0" y="332.0" font-size="12.5" font-weight="400" fill="#3b8f68" text-anchor="start">γ = π/2（90°）　→　+0.0000+1.0000i</text><circle cx="35.0" cy="350.0" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="46.0" y="354.0" font-size="12.5" font-weight="400" fill="#c65a3d" text-anchor="start">γ = π（180°）　→　-1.0000+0.0000i</text><circle cx="35.0" cy="372.0" r="4" fill="#a5761a" stroke="none" stroke-width="1"/><text x="46.0" y="376.0" font-size="12.5" font-weight="400" fill="#a5761a" text-anchor="start">γ = −π/2（-90°）　→　+0.0000-1.0000i</text><text x="30.0" y="410.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">四个点都落在这个虚线圆上——模全是 1，只有方向不同。</tspan><tspan x="30.0" dy="21">记住这一点：角变了，长度不变。下一课公式里那个 e 的指数项做的就是这件事。</tspan></text>
</svg>
