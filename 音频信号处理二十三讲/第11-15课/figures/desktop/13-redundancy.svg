<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 494" width="880" height="494" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="真实信号的离散傅里叶变换在奈奎斯特位置两侧成共轭镜像">
