"147.1" y="282.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">1</text><text x="264.3" y="282.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">2</text><text x="381.4" y="282.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">3</text><text x="498.6" y="282.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">4</text><text x="615.7" y="282.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">5</text><text x="732.9" y="282.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">6</text><text x="850.0" y="282.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">7</text><line x1="498.6" y1="82.0" x2="498.6" y2="270.0" stroke="#a5761a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="498.6" y="104.0" font-size="12.5" font-weight="700" fill="#a5761a" text-anchor="middle">k=4 · 4 Hz</text><rect x="30.0" y="308.0" width="820.0" height="34.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="42.0" y="331.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">k=1</text><text x="440.0" y="331.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">互为共轭镜像  ↔</text><text x="838.0" y="331.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">k=7</text><rect x="30.0" y="350.0" width="820.0" height="34.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="42.0" y="373.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">k=2</text><text x="440.0" y="373.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">互为共轭镜像  ↔</text><text x="838.0" y="373.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">k=6</text><rect x="30.0" y="392.0" width="820.0" height="34.0" rx="6" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="42.0" y="415.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">k=3</text><text x="440.0" y="415.0" font-size="12.5" font-weight="400" fill="#5b6673" text-anchor="middle">互为共轭镜像  ↔</text><text x="838.0" y="415.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">k=5</text><text x="30.0" y="442.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="30.0" dy="0">蓝色的正频率和橙色的负频率成对出现：X[N-k] 是 X[k] 的共轭。</tspan><tspan x="30.0" dy="21">因此真实录音只保留从 0 到奈奎斯特频率这一半，也能恢复另一半；这不是删除新信息。</tspan></text>
