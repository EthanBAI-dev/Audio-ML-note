<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 697" width="420" height="697" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="复数在复平面上的直角坐标与极坐标两种表示">
<rect width="420" height="697" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">同一个点，</tspan><tspan x="20.0" dy="25">两种说法装的信息一样多</tspan></text><rect x="20.0" y="99.0" width="220.0" height="220.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="26.0" y1="209.0" x2="234.0" y2="209.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="130.0" y1="105.0" x2="130.0" y2="313.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="232.0" y="203.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="136.0" y="117.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><text x="28.0" y="117.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">直角坐标</text><line x1="181.4" y1="209.0" x2="181.4" y2="140.4" stroke="#0878b9" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="130.0" y1="140.4" x2="181.4" y2="140.4" stroke="#0878b9" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="181.4" cy="140.4" r="5" fill="#0878b9" stroke="none" stroke-width="1"/><text x="189.4" y="134.4" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">3 + 4i</text><text x="155.7" y="225.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">实部 3</text><text x="124.0" y="174.7" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">虚部 4</text><rect x="20.0" y="359.0" width="220.0" height="220.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="26.0" y1="469.0" x2="234.0" y2="469.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="130.0" y1="365.0" x2="130.0" y2="573.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="232.0" y="463.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="136.0" y="377.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><text x="28.0" y="377.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">极坐标</text><line x1="130.0" y1="469.0" x2="181.4" y2="400.4" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="181.4" cy="400.4" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><path d="M156.0,469.0 A26,26 0 0 0 145.6,448.2" fill="none" stroke="#c65a3d" stroke-width="1.6"/><text x="160.0" y="491.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="middle">γ = 0.9273</text><text x="149.7" y="426.7" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="end">模 5</text><text x="20.0" y="605.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">左边用「往右 3、往上 4」，右边用「离原点</tspan><tspan x="20.0" dy="21">5、朝 53.13°」。两种说法转得回去。</tspan><tspan x="20.0" dy="21">极坐标正好对上声音要的两样：模＝有多强，</tspan><tspan x="20.0" dy="21">角＝从哪里起步。</tspan></text>
</svg>
