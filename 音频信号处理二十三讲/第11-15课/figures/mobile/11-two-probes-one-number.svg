<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 709" width="420" height="709" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="两支试探波的读数拼成一个复数后，模是强度、角是相位">
<rect width="420" height="709" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">第 10 课那两个读数，</tspan><tspan x="20.0" dy="25">拼起来就是一个复数</tspan></text><text x="20.0" y="93.0" font-size="14" font-weight="700" fill="#5b6673" text-anchor="start">两支试探波各自的读数</text><line x1="20.0" y1="153.0" x2="400.0" y2="153.0" stroke="#d7dfe6" stroke-width="1.4" stroke-linecap="round"/><rect x="99.0" y="153.0" width="32.0" height="2.0" rx="2" fill="#0878b9" stroke="none" stroke-width="1"/><text x="115.0" y="147.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="middle">0.0000</text><text x="115.0" y="223.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">余弦那支</text><rect x="289.0" y="109.8" width="32.0" height="43.2" rx="2" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="305.0" y="103.8" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="middle">1.0000</text><text x="305.0" y="223.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="middle">正弦那支</text><rect x="20.0" y="253.0" width="190.0" height="190.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="26.0" y1="348.0" x2="204.0" y2="348.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="115.0" y1="259.0" x2="115.0" y2="437.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="202.0" y="342.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="121.0" y="271.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><line x1="115.0" y1="348.0" x2="115.0" y2="288.0" stroke="#c65a3d" stroke-width="2.4" stroke-linecap="round"/><circle cx="115.0" cy="288.0" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="121.0" y="302.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">模 1.0000</text><rect x="20.0" y="465.0" width="380.0" height="42.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="482.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">模 |z|</text><text x="30.0" y="499.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">1.0000</text><text x="390.0" y="482.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">＝ 第 10 课量到的强度</text><rect x="20.0" y="511.0" width="380.0" height="42.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="528.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">角 γ</text><text x="30.0" y="545.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">1.5708 弧度</text><text x="390.0" y="528.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">＝ 第 10 课量到的相位</text><rect x="20.0" y="557.0" width="380.0" height="42.0" rx="5" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1"/><text x="30.0" y="574.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">起点挪四分之一圈后</text><text x="30.0" y="591.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">模 1.0000　角 -0.0000</text><text x="390.0" y="574.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">模没变，角变了 90°</text><text x="20.0" y="617.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">余弦那支当实部、正弦那支当虚部，两个读数</tspan><tspan x="20.0" dy="21">成了一个点的横纵坐标。离原点多远＝有多强，</tspan><tspan x="20.0" dy="21">朝哪个方向＝从哪里起步。起点挪四分之一圈时</tspan><tspan x="20.0" dy="21">模纹丝不动，被抹掉的问题就此消失。</tspan></text>
</svg>
