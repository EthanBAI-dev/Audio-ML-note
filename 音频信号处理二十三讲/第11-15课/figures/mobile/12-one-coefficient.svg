<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 618" width="420" height="618" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="一个频率对应一个复数系数，模是幅度、角是相位">
<rect width="420" height="618" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">一个频率算出一个复数，</tspan><tspan x="20.0" dy="25">模是幅度、角是相位</tspan></text><rect x="20.0" y="99.0" width="210.0" height="210.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="26.0" y1="204.0" x2="224.0" y2="204.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="125.0" y1="105.0" x2="125.0" y2="303.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="222.0" y="198.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="131.0" y="117.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><line x1="125.0" y1="204.0" x2="125.0" y2="136.6" stroke="#c65a3d" stroke-width="2.4" stroke-linecap="round"/><circle cx="125.0" cy="136.6" r="5" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="133.0" y="150.6" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">c</text><rect x="20.0" y="335.0" width="380.0" height="44.0" rx="6" fill="#f5f8fa" stroke="#0878b9" stroke-width="1.3"/><text x="30.0" y="354.0" font-size="14" font-weight="700" fill="#0878b9" text-anchor="start">实部 Re(c)</text><text x="30.0" y="372.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">0.0000</text><text x="390.0" y="354.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">余弦那支试探波的读数</text><rect x="20.0" y="385.0" width="380.0" height="44.0" rx="6" fill="#f5f8fa" stroke="#3b8f68" stroke-width="1.3"/><text x="30.0" y="404.0" font-size="14" font-weight="700" fill="#3b8f68" text-anchor="start">虚部 Im(c)</text><text x="30.0" y="422.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">1.0000</text><text x="390.0" y="404.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">正弦那支试探波的读数</text><rect x="20.0" y="435.0" width="380.0" height="44.0" rx="6" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.3"/><text x="30.0" y="454.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">模 |c|</text><text x="30.0" y="472.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">1.0000</text><text x="390.0" y="454.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">幅度：这个频率有多强</text><rect x="20.0" y="485.0" width="380.0" height="44.0" rx="6" fill="#f5f8fa" stroke="#c65a3d" stroke-width="1.3"/><text x="30.0" y="504.0" font-size="14" font-weight="700" fill="#c65a3d" text-anchor="start">角 ∠c</text><text x="30.0" y="522.0" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">1.5708 弧度</text><text x="390.0" y="504.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">相位：从哪里起步</text><text x="20.0" y="547.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">模和角不是再算一次得到的，它们就是同一个点</tspan><tspan x="20.0" dy="21">的另一套坐标。第 11 课验证过：模＝强度，</tspan><tspan x="20.0" dy="21">角＝相位。</tspan></text>
</svg>
