<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 335" width="420" height="335" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="真实录音的完整 FFT 与单边 FFT 数组长度和频率范围对应关系">
<rect width="420" height="335" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">一段小提琴录音，</tspan><tspan x="20.0" dy="25">三个数组长度怎样对应</tspan></text><rect x="20.0" y="87.0" width="380.0" height="54.0" rx="9" fill="#eef6fd" stroke="#0878b9" stroke-width="1.6"/><text x="34.0" y="111.0" font-size="16" font-weight="700" fill="#0878b9" text-anchor="start">时间样本</text><text x="34.0" y="131.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">N = 59772，22050 Hz 单声道</text><line x1="46.0" y1="143.0" x2="46.0" y2="157.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,157.0 43.1,151.7 48.9,151.7" fill="#5b6673"/><text x="60.0" y="156.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">完整 FFT</text><rect x="20.0" y="161.0" width="380.0" height="54.0" rx="9" fill="#fff3ee" stroke="#c65a3d" stroke-width="1.6"/><text x="34.0" y="185.0" font-size="16" font-weight="700" fill="#c65a3d" text-anchor="start">正负频率都保留</text><text x="34.0" y="205.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">59772 个系数，len(fft) = N</text><line x1="46.0" y1="217.0" x2="46.0" y2="231.0" stroke="#5b6673" stroke-width="2" stroke-linecap="round"/><polygon points="46.0,231.0 43.1,225.7 48.9,225.7" fill="#5b6673"/><text x="60.0" y="230.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">去掉镜像</text><rect x="20.0" y="235.0" width="380.0" height="54.0" rx="9" fill="#edf8f3" stroke="#3b8f68" stroke-width="1.6"/><text x="34.0" y="259.0" font-size="16" font-weight="700" fill="#3b8f68" text-anchor="start">只留非负频率</text><text x="34.0" y="279.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">29887 个系数；频率轴逐项配对</text><text x="20.0" y="313.0" font-size="14.5" font-weight="700" fill="#c65a3d" text-anchor="start">最高 11025 Hz；本课看 0—2205 Hz</text>
</svg>
