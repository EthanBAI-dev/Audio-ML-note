<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 522" width="420" height="522" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="模为 1 时不同的角分别指向复平面的哪个方向">
<rect width="420" height="522" fill="#fff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20.0" dy="0">模都是 1，</tspan><tspan x="20.0" dy="25">角是多少就指向哪儿</tspan></text><rect x="20.0" y="99.0" width="230.0" height="230.0" rx="6" fill="#fff" stroke="#d7dfe6" stroke-width="1"/><line x1="26.0" y1="214.0" x2="244.0" y2="214.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><line x1="135.0" y1="105.0" x2="135.0" y2="323.0" stroke="#d7dfe6" stroke-width="1.2" stroke-linecap="round"/><text x="242.0" y="208.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="end">Re</text><text x="141.0" y="117.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start">Im</text><circle cx="135.0" cy="214.0" r="74.8" fill="none" stroke="#d7dfe6" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="135.0" y1="214.0" x2="187.9" y2="161.1" stroke="#0878b9" stroke-width="2.2" stroke-linecap="round"/><circle cx="187.9" cy="161.1" r="4.5" fill="#0878b9" stroke="none" stroke-width="1"/><line x1="135.0" y1="214.0" x2="135.0" y2="139.2" stroke="#3b8f68" stroke-width="2.2" stroke-linecap="round"/><circle cx="135.0" cy="139.2" r="4.5" fill="#3b8f68" stroke="none" stroke-width="1"/><line x1="135.0" y1="214.0" x2="60.2" y2="214.0" stroke="#c65a3d" stroke-width="2.2" stroke-linecap="round"/><circle cx="60.2" cy="214.0" r="4.5" fill="#c65a3d" stroke="none" stroke-width="1"/><line x1="135.0" y1="214.0" x2="135.0" y2="288.8" stroke="#a5761a" stroke-width="2.2" stroke-linecap="round"/><circle cx="135.0" cy="288.8" r="4.5" fill="#a5761a" stroke="none" stroke-width="1"/><circle cx="25.0" cy="347.0" r="4" fill="#0878b9" stroke="none" stroke-width="1"/><text x="36.0" y="351.0" font-size="14" font-weight="400" fill="#0878b9" text-anchor="start">γ = π/4（45°）　→　+0.7071+0.7071i</text><circle cx="25.0" cy="369.0" r="4" fill="#3b8f68" stroke="none" stroke-width="1"/><text x="36.0" y="373.0" font-size="14" font-weight="400" fill="#3b8f68" text-anchor="start">γ = π/2（90°）　→　+0.0000+1.0000i</text><circle cx="25.0" cy="391.0" r="4" fill="#c65a3d" stroke="none" stroke-width="1"/><text x="36.0" y="395.0" font-size="14" font-weight="400" fill="#c65a3d" text-anchor="start">γ = π（180°）　→　-1.0000+0.0000i</text><circle cx="25.0" cy="413.0" r="4" fill="#a5761a" stroke="none" stroke-width="1"/><text x="36.0" y="417.0" font-size="14" font-weight="400" fill="#a5761a" text-anchor="start">γ = −π/2（-90°）　→　+0.0000-1.0000i</text><text x="20.0" y="451.0" font-size="14" font-weight="400" fill="#5b6673" text-anchor="start"><tspan x="20.0" dy="0">四个点都落在虚线圆上，模全是 1，只有方向不同。</tspan><tspan x="20.0" dy="21">角变了，长度不变——下一课公式里 e 的指数项</tspan><tspan x="20.0" dy="21">做的就是这件事。</tspan></text>
</svg>
