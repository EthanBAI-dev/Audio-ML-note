<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 759.88" width="912" height="759.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="频率成分相同但出现顺序相反的两段声音">
<rect width="912" height="759.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">成分一样，</tspan><tspan x="40" dy="58">顺序不一样</tspan></text><text x="48" y="207.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="start">先低后高</text><rect x="40.0" y="225.9" width="403.0" height="200.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="52.0" y="310.7" width="181.5" height="34.0" rx="6" fill="#0878b9" stroke="none" stroke-width="1" opacity="1"/><rect x="241.5" y="374.7" width="181.5" height="34.0" rx="6" fill="#0878b9" stroke="none" stroke-width="1" opacity="1"/><text x="44" y="471.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">↑ 高低　→ 时间</text><text x="477" y="207.88" font-size="38" font-weight="700" fill="#c65a3d" text-anchor="start">先高后低</text><rect x="469.0" y="225.9" width="403.0" height="200.0" rx="10" fill="#fff" stroke="#d7dfe6" stroke-width="1" opacity="1"/><rect x="481.0" y="374.7" width="181.5" height="34.0" rx="6" fill="#c65a3d" stroke="none" stroke-width="1" opacity="1"/><rect x="670.5" y="310.7" width="181.5" height="34.0" rx="6" fill="#c65a3d" stroke="none" stroke-width="1" opacity="1"/><text x="473" y="471.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">↑ 高低　→ 时间</text><rect x="40.0" y="487.9" width="832.0" height="176.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="543.88" font-size="32" font-weight="700" fill="#1f2933" text-anchor="start">整段汇总的频谱：两边一模一样</text><text x="64" y="599.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">因为它只统计有什么，不记什么时候</text><text x="40" y="719.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">想回答“什么时候”，就得一小段一小段地看。</text>
</svg>
