<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 883.88" width="912" height="883.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="STFT 从移动窗口到时频矩阵的三个步骤">
