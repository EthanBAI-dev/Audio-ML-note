<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 877.88" width="912" height="877.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Hiragino Sans GB, sans-serif" fill="#1f2933" role="img" aria-label="一万样本经一千点窗口、五百点帧移得到的矩阵尺寸">
<rect width="912" height="877.88" fill="#ffffff"/>
<text x="40" y="75.88" font-size="46" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">输出有多少行多少列，</tspan><tspan x="40" dy="58">都是算出来的</tspan></text><rect x="40.0" y="167.9" width="832.0" height="108.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="233.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">录音</text><text x="848" y="233.88" font-size="38" font-weight="700" fill="#0878b9" text-anchor="end">10000 个样本</text><rect x="40.0" y="289.9" width="832.0" height="108.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="355.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">每帧</text><text x="848" y="355.88" font-size="38" font-weight="700" fill="#c65a3d" text-anchor="end">1000 个样本</text><rect x="40.0" y="411.9" width="832.0" height="108.0" rx="14" fill="#f5f8fa" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="477.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">每次前进</text><text x="848" y="477.88" font-size="38" font-weight="700" fill="#3b8f68" text-anchor="end">500 个样本</text><rect x="40.0" y="533.9" width="832.0" height="108.0" rx="14" fill="#fdf6e6" stroke="#d7dfe6" stroke-width="1" opacity="1"/><text x="64" y="599.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">得到</text><text x="848" y="599.88" font-size="38" font-weight="700" fill="#a5761a" text-anchor="end">501 行 × 19 列</text><text x="40" y="721.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">501 = 1000 ÷ 2 + 1</text><text x="40" y="773.88" font-size="32" font-weight="400" fill="#5b6673" text-anchor="start">19 = 装得下的完整帧数</text><text x="40" y="837.88" font-size="34" font-weight="700" fill="#c65a3d" text-anchor="start">先算清形状，再动手写代码，能省掉一半调试。</text>
</svg>
